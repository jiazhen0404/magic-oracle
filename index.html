<style>
:root{
  --bg-top:#0e0a22; --bg-mid:#1a1338; --bg-bot:#271b47;
  --gold:#d9bd82; --gold-soft:#c3a874; --gold-line:rgba(206,176,112,.38);
  --text:#ece4f5; --text-soft:#b6a6cf; --text-faint:#8b7bab;

  --cinzel:'Cinzel',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--text);
  background:radial-gradient(150% 100% at 50% 0%, var(--bg-bot), var(--bg-mid) 45%, var(--bg-top));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0}
button{font-family:var(--serif);cursor:pointer}
.starfield{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#f4ecd0;box-shadow:0 0 4px #e9d9a8}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spinAura{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes auraPulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes shakeCyl{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-1.6deg)}35%{transform:translateX(7px) rotate(1.6deg)}55%{transform:translateX(-6px) rotate(-1.2deg)}75%{transform:translateX(6px) rotate(1.2deg)}90%{transform:translateX(-3px) rotate(-.6deg)}}
@keyframes stickRise{0%{transform:translateY(200px);opacity:0}22%{opacity:1}100%{transform:translateY(6px);opacity:1}}
@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@keyframes tapRing{0%{transform:translate(-50%,-50%) scale(.85);opacity:.55}100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}

#root{position:relative;z-index:2}

.brand-cn{font-family:var(--serif);color:var(--gold);letter-spacing:.28em;text-shadow:0 0 20px rgba(217,189,130,.45)}
.brand-en{font-family:var(--cinzel);color:var(--gold-soft);letter-spacing:.5em}

/* DRAWING stage */
.draw-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cap{font-size:14px;line-height:2;margin-bottom:2px;min-height:56px;display:flex;align-items:center}
.cyl-stage{position:relative;width:260px;height:340px;margin:6px auto;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.aura{position:absolute;left:50%;top:48%;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle, rgba(217,189,130,.22), transparent 62%);animation:spinAura 20s linear infinite, auraPulse 3.5s ease-in-out infinite;pointer-events:none}
.aura.hot{background:radial-gradient(circle, rgba(255,220,150,.4), transparent 62%);animation:spinAura 6s linear infinite, auraPulse 1.4s ease-in-out infinite}

.cyl-img.floaty{animation:floaty 4s ease-in-out infinite}

.flash{position:absolute;left:50%;top:30%;width:210px;height:210px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(255,242,205,.9), transparent 60%);opacity:0;animation:flash 1.1s ease-out 1.7s forwards;pointer-events:none;z-index:6}

  position:absolute;

  height:190px;
  transform:translate(-50%,-50%);

    radial-gradient(circle,
      rgba(255,221,162,.22) 0 12%,
      rgba(194,105,255,.18) 34%,
      rgba(244,75,213,.10) 54%,

}

.orbit-glow{

  z-index:3;
  left:50%;
  top:52%;
  width:215px;
  height:72px;
  transform:translate(-50%,-50%) rotate(-14deg);
  border:1px solid rgba(233,191,113,.32);
  border-radius:50%;
  box-shadow:
    0 0 12px rgba(226,178,102,.28),
    inset 0 0 10px rgba(208,125,255,.15);
  animation:orbitTilt 9s linear infinite;
}

.mist{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  border-radius:50%;
  pointer-events:none;
  mix-blend-mode:screen;
  filter:blur(16px);
  opacity:.7;
  transform-origin:center;
}

.mist::after{
  content:"";
  position:absolute;
  inset:0;

一期限；你可以繼續愛牠，同時繼續生活。","sa":"找一個願意聽你談牠的人，說一段你最不想被忘記的故事。"},{"n":220,"t":"永遠的小房間","sub":"離別中","yu":"你以為只是普通的一天，對牠而言，可能就是最安心的一天。","jie":"「永遠的小房間」說的是已經離世的毛孩。這支籤不是要證明牠真的回來了，而是想接住你仍然存在的思念。現在的你也許仍會哭，但比起追問『為什麼離開』，開始更常想到『謝謝牠來過』。 這支籤象徵告別正在慢慢完成：不是關係消失，而是關係從陪伴變成記憶。 如果最近夢到牠、忽然想起牠，或遇到熟悉的小巧合，可以把那一刻當成記憶在輕輕提醒你：你們一起生活過的愛，沒有因為離別就失去意義。","adv":"寫下最後一句：『謝謝你來到我的生命裡，因為……』。","st":"你終於準備好說謝謝。","msg":"如果把「永遠的小房間」寫成一封象徵性的毛孩來信，可能會是：「你想起我的時候，不用急著證明我有沒有回來。那些一起生活過的記憶，就是我留給你的陪伴。」","rx":"現在的你也許仍會哭，但比起追問『為什麼離開』，開始更常想到『謝謝牠來過』。","fw":"這支籤象徵告別正在慢慢完成：不是關係消失，而是關係從陪伴變成記憶。","sa":"寫下最後一句：『謝謝你來到我的生命裡，因為……』。"},{"n":221,"t":"掌心裡的新心跳","sub":"離別中","yu":"牠離開了你的懷抱，也許只是為了換一種方式，再次被你抱在懷裡。","st":"這支籤象徵牠正在準備一段與你更深的新緣分。","msg":"如果把這份緣分寫成牠的來信，可能會是：『這一次，我想用另一種身分來到你身邊。也許我會成為你的小孩，讓你再次聽見屬於我們的心跳。』","rx":"你可能開始夢見嬰兒、聽見孩子的笑聲，或對成為父母這件事產生比以往更深的感受。這些也可能只是思念的投射，不必急著證明。","fw":"若你未來迎來孩子，某些眼神、神情或依偎方式，也許會讓你想起牠；那份熟悉可以成為愛的延續，而不必成為身分的證明。","sa":"把期待留在心裡，但也允許未來的孩子成為獨立而完整的新生命。","adv":"把期待留在心裡，但也允許未來的孩子成為獨立而完整的新生命。","jie":"「掌心裡的新心跳」象徵毛孩可能準備以更靠近你的身分，再次與你相遇。有人會把這份感覺理解為牠想投胎成自己的孩子。這不是可以被證實的預言，而是一種關於愛沒有結束、只是換了形狀的溫柔想像。"},{"n":222,"t":"約定好的搖籃","sub":"離別中","yu":"有些靈魂不是走遠了，而是在時間的另一端，等一個適合回來的入口。","st":"牠可能還在等待適合的時間，不急著開始下一段生命。","msg":"象徵性的牠想告訴你：『我沒有錯過回來的路，只是那扇門還沒打開。你先好好生活，等時間到了，我會找到最適合的方式靠近你。』","rx":"近期可能沒有明顯的夢或巧合，反而是一段安靜期。安靜不代表牠離你更遠，也可能只是你的心正在休息。","fw":"這段緣分比較像等待，而不是立刻重逢；未來可能透過孩子、新毛孩或一次意外相遇，再次喚起熟悉感。","sa":"不用為重逢設定期限，先把自己的生活照顧好。","adv":"不用為重逢設定期限，先把自己的生活照顧好。","jie":"「約定好的搖籃」說的是等待中的緣分。牠也許還沒有準備投胎，或新的生命時機尚未到來。這支籤不催你尋找證據，只想提醒你：真正深的愛，經得起一段沒有訊息的時間。"},{"n":223,"t":"換一雙眼睛看你","sub":"離別中","yu":"下一次見面，牠也許沒有原來的模樣，卻仍會用熟悉的眼神認出你。","st":"這支籤象徵牠可能以另一隻毛孩的身分，重新走進你的生活。","msg":"如果牠真的換了模樣，牠可能想說：『不要只找以前的花色和名字。你認得我的方式，也許會是一個眼神、一個小動作，或我靠近你時那份熟悉。』","rx":"你可能遇見一隻對你特別有反應的動物，或新毛孩出現和牠相似的小習慣。相似可以帶來安慰，但不代表一定是同一個靈魂。","fw":"新的陪伴有機會到來，而且會碰觸你心裡很柔軟的地方。它可以延續舊愛，也值得被當作新的生命重新認識。","sa":"如果遇見讓你有熟悉感的毛孩，先了解牠真正的個性與需要，再決定是否相伴。","adv":"如果遇見讓你有熟悉感的毛孩，先了解牠真正的個性與需要，再決定是否相伴。","jie":"「換一雙眼睛看你」象徵牠可能換成另一隻毛孩回來。重逢不一定複製過去，更可能是熟悉感與新個性同時存在。請把這份感覺當成緣分的邀請，而不是要求新毛孩成為牠的替代品。"},{"n":224,"t":"門口的新腳步","sub":"離別中","yu":"熟悉的腳步停過一次，生命也可能安排另一雙小腳，再次走向你。","st":"牠可能準備透過一次收養、救援或偶然相遇，把新的緣分帶到你門前。","msg":"象徵性的牠像在說：『你不用四處找我。當那個需要你、也願意靠近你的生命出現時，你會知道自己的心又能打開了。』","rx":"你可能突然看見送養訊息、在路上遇到動物，或被朋友詢問是否願意照顧一個新生命。","fw":"新的毛孩緣分可能來得很自然，但不一定立刻發生；它更像在你準備好時，輕輕敲門。","sa":"先評估時間、空間與照顧能力，不要只因一瞬間的熟悉感做決定。","adv":"先評估時間、空間與照顧能力，不要只因一瞬間的熟悉感做決定。","jie":"「門口的新腳步」談的是透過收養或偶遇而來的再次相逢。你可能會覺得是牠安排了這段緣分，也可能只是愛讓你重新看見需要被照顧的生命。無論是哪一種理解，真正重要的是你已經慢慢有能力再次去愛。"},{"n":225,"t":"家族裡的小星星","sub":"離別中","yu":"牠熟悉的不只有你，也有整個家的聲音；下一段緣分，也許仍會落在這個家族裡。","st":"這支籤象徵牠可能投胎成家人或親友的孩子，繼續靠近熟悉的家庭。","msg":"如果這份想像能說話，牠也許會說：『我想回到有你們笑聲的地方。就算不再只屬於你，你仍可能在家人的懷裡，再次看見我熟悉的光。』","rx":"家族中可能傳來懷孕、新生兒或領養孩子的消息，讓你無端想起牠，甚至感到一種難以解釋的親近。","fw":"若新的孩子來到家族，這份熟悉可能讓你得到安慰；但孩子仍有自己的生命故事，不需要背負成為誰的責任。","sa":"珍惜熟悉感，同時尊重新生命自己的個性與人生。","adv":"珍惜熟悉感，同時尊重新生命自己的個性與人生。","jie":"「家族裡的小星星」把投胎的可能放在熟悉的家族裡。也許是你的孩子，也許是手足或親友的孩子。這支籤想說的不是誰一定是牠，而是你曾經給牠的家庭感，可能成為你相信牠願意再次靠近的理由。"},{"n":226,"t":"先認出你的聲音","sub":"離別中","yu":"模樣可以改變，名字可以重新取；有些熟悉，卻會在聽見你的聲音時先醒來。","st":"牠可能已經以新的生命開始旅程，而你們尚未正式相遇。","msg":"象徵性的牠想說：『我正在學習新的身體、新的世界。也許現在還不能走到你面前，但熟悉的愛，會替我們保留一條路。』","rx":"你可能對某個陌生孩子或動物的反應格外在意，尤其是牠聽見你的聲音後，出現讓你熟悉的眼神或動作。","fw":"是否重逢不一定很快有答案。這份籤比較像提醒你留意緣分，而不是四處尋找牠的證明。","sa":"遇到熟悉感時先停一下、感受一下，不急著替對方定義身分。","adv":"遇到熟悉感時先停一下、感受一下，不急著替對方定義身分。","jie":"「先認出你的聲音」象徵牠也許已經投胎，只是你們還沒真正相遇。重逢若存在，未必靠外表辨認，而可能來自一個瞬間的熟悉。請保留想像，也為現實中的新生命留下自由。"},{"n":227,"t":"另一個家的窗","sub":"離別中","yu":"牠下一段生命未必回到你身邊，也可能在另一扇窗前，被另一雙手好好接住。","st":"這支籤象徵牠可能已在另一個家庭展開新的生命。","msg":"如果牠能傳來一句話，也許會是：『別因為我沒有回到你身邊就難過。你教過我被愛的感覺，所以無論我去了哪裡，都知道怎麼靠近溫暖。』","rx":"你可能夢見牠在陌生但明亮的地方，身邊有人照顧；醒來後，比起悲傷，心裡反而多了一點放心。","fw":"你們未必會在現實中再次相認，但你對牠的祝福，能幫助自己慢慢接受：愛也可以包含放手。","sa":"試著對牠說：『如果你在別的地方過得幸福，我也願意替你高興。』","adv":"試著對牠說：『如果你在別的地方過得幸福，我也願意替你高興。』","jie":"「另一個家的窗」不是失去第二次，而是一種更寬的祝福。牠可能沒有選擇回到你身邊，而是在另一個家庭開始新生活。若你願意相信投胎，這支籤希望你知道：沒有再次擁有，也不代表你們的愛不夠深。"},{"n":228,"t":"還想再當你的毛孩","sub":"離別中","yu":"曾經被你好好愛過的靈魂，也許會記得家的方向，想再一次成為你的毛孩。","st":"牠可能仍偏愛以毛孩的身分回來，延續熟悉的陪伴方式。","msg":"象徵性的牠像在撒嬌：『做人好像太複雜了，我還想用四隻腳跑向你，睡你的位置，繼續當那個被你叫名字就回頭的孩子。』","rx":"未來出現的新毛孩，可能在睡姿、撒嬌方式、喜歡的位置或某個小脾氣上，讓你突然鼻酸。","fw":"新的毛孩緣分可能再次靠近，但相似與不同都會同時存在；那不是複製，而是一段新的相處。","sa":"可以相信熟悉感，但不要拿新毛孩和牠反覆比較。","adv":"可以相信熟悉感，但不要拿新毛孩和牠反覆比較。","jie":"「還想再當你的毛孩」是一支很親近的重逢籤。牠可能還想以最熟悉的方式回到你身邊：再次成為你的狗、貓或其他毛孩。這是一種象徵性的解讀，真正的重點是新的陪伴若出現，你已經知道如何好好愛牠。"},{"n":229,"t":"夢裡選的新名字","sub":"離別中","yu":"牠在夢裡沒有回頭，也許不是離開你，而是正往下一個名字走去。","st":"這支籤象徵牠已經準備告別舊身分，迎接下一段生命。","msg":"牠的象徵性來信可能是：『以前的名字我會放在心裡，但下一次，我也想知道自己還能成為誰。請不要因為我往前走，就以為我不愛你。』","rx":"你可能夢見牠走向門、光、階梯或陌生遠方；夢裡的氣氛若平靜，常反映你的心正在接受牠繼續前進。","fw":"牠的下一段旅程可能不再圍繞過去，而你也會慢慢從追問去向，走向祝福。","sa":"替牠寫一句祝福：『無論下一次叫什麼名字，都希望你被好好愛著。』","adv":"替牠寫一句祝福：『無論下一次叫什麼名字，都希望你被好好愛著。』","jie":"「夢裡選的新名字」象徵牠已準備投胎，並願意成為一個全新的生命。真正的愛不是要求牠永遠停在原來的位置，而是即使捨不得，也願意祝福牠帶著被愛過的記憶繼續前進。"},{"n":230,"t":"同一天的兩道光","sub":"離別中","yu":"一個生命告別的日子，也可能在多年後，成為另一個生命靠近你的暗號。","st":"日期、時間或數字的巧合，可能讓你聯想到牠已用新的身分回來。","msg":"象徵性的牠可能想說：『我知道你會記得那些重要的日子，所以如果有一天，另一道光在相似的時間亮起，你可以把它當成我留給你的問候。』","rx":"新生命的生日、相遇日或重要數字，可能和牠的紀念日出現巧合，讓你感到震動。巧合可以有意義，但不等於證明。","fw":"你會找到一種能同時記得牠、也歡迎新生命的方式，不必在過去與未來之間二選一。","sa":"記下巧合帶來的感受，不需要急著說服別人相信。","adv":"記下巧合帶來的感受，不需要急著說服別人相信。","jie":"「同一天的兩道光」談的是日期與數字帶來的重逢感。你可能因此相信牠投胎回來，也可能把它理解成記憶替日子加上意義。無論答案是哪一個，那份被安慰的感覺都是真實的。"},{"n":231,"t":"借一個小習慣回來","sub":"離別中","yu":"牠未必帶著全部記憶回來，也許只偷偷留下了一個你最熟悉的小習慣。","st":"新生命身上出現熟悉習慣，可能讓你感到牠以某種方式延續了緣分。","msg":"如果牠能解釋，也許會說：『新的我會有新的個性，但我想留下一點小暗號，讓你在某個瞬間知道，那份愛曾經來過。』","rx":"你可能在孩子或新毛孩身上，看見相似的睡姿、偏好、表情或安慰你的方式。","fw":"熟悉的小動作會替你打開記憶，也可能幫助你更溫柔地接納眼前這個全新的生命。","sa":"把相似當作禮物，不要把不同當成牠沒有回來的證據。","adv":"把相似當作禮物，不要把不同當成牠沒有回來的證據。","jie":"「借一個小習慣回來」是一支關於細節的投胎籤。新的生命也許只帶著一點熟悉，而不是完整複製牠。這樣的安排反而更溫柔：你可以記得從前，也能真正認識現在。"},{"n":232,"t":"不急著離開的靈魂","sub":"離別中","yu":"不是每個靈魂都急著投胎；有些會先坐在回憶旁邊，陪你把眼淚慢慢哭完。","st":"牠可能還沒有準備投胎，象徵性的陪伴仍停留在你的記憶與日常裡。","msg":"牠可能想說：『我知道你還需要一點時間。我不催你放下，也不急著去很遠的地方。等你想到我時不再只剩眼淚，我們再一起往前。』","rx":"你可能常在熟悉的位置感到牠的存在、夢見牠待在原來的家，或下意識保留牠的生活習慣。","fw":"投胎的想像目前不是重點；這段時間更像是你們一起完成告別，把愛安放到不再刺痛的位置。","sa":"不必催自己收起遺物或開始新的陪伴，照自己的速度來。","adv":"不必催自己收起遺物或開始新的陪伴，照自己的速度來。","jie":"「不急著離開的靈魂」提醒你，不是所有離世毛孩都必須立刻投胎。若你仍感覺牠在家裡，可以把那份存在感理解成深刻生活記憶留下的回音。等你們都準備好了，下一段旅程自然會開始。"},{"n":233,"t":"先去遠方旅行","sub":"離別中","yu":"牠不一定立刻回來，也許想先看看沒有病痛、沒有牽繩的遠方。","st":"牠可能象徵性地進入一段自由休息的旅程，暫時沒有投胎計畫。","msg":"如果牠能寄來明信片，也許會寫：『我現在跑得很輕，身體也不痛了。別擔心我沒有回來，我只是想先去看看更遠的地方。』","rx":"夢裡的牠可能在奔跑、草地、海邊或開闊空間，看起來比生病時更輕鬆。","fw":"你會慢慢從牠最後的病痛畫面，重新想起牠健康、快樂的樣子；重逢是否發生，可以交給更後面的時間。","sa":"選一張牠最有精神的照片，放在你看得到的地方。","adv":"選一張牠最有精神的照片，放在你看得到的地方。","jie":"「先去遠方旅行」是一支暫不投胎的籤。牠可能需要休息，也可能只是你希望牠終於自由的心願。這份想像能幫助你把牠從最後的痛苦中放開，重新記得牠曾經那麼有生命力。"},{"n":234,"t":"成為守護你的孩子","sub":"離別中","yu":"以前是你照顧牠，下一次相遇，也許換牠用一個孩子的笑容，陪你走更長的路。","st":"這支籤象徵牠可能投胎成你的孩子，讓彼此的照顧關係換一種方向繼續。","msg":"象徵性的牠想說：『以前你替我準備每一餐、守著我生病。下一次，如果我成為你的孩子，我想用更長的時間陪你，也讓你知道自己值得被依賴。』","rx":"你可能夢見牠變成孩子、抱著嬰兒，或在想到未來家庭時，突然感覺牠也在那幅畫面裡。","fw":"這份籤帶來的是家庭緣分的想像；若孩子真的到來，牠可能讓你再次體會熟悉的牽掛，也會展開完全不同的新關係。","sa":"把這份想像當成祝福，不要把懷孕或生育變成驗證牠是否回來的壓力。","adv":"把這份想像當成祝福，不要把懷孕或生育變成驗證牠是否回來的壓力。","jie":"「成為守護你的孩子」直接指向投胎成你的小孩。它感人的地方不在於保證，而在於一種角色交換：你曾用盡全力照顧牠，也許下一次，這份靈魂緣分會用更長的人生回到你身邊。"},{"n":235,"t":"擦肩而過的小朋友","sub":"離別中","yu":"有些重逢不會留下姓名，只是一個陌生孩子回頭看你時，心忽然被輕輕碰了一下。","st":"牠可能已投胎成你生命之外的孩子，你們只會短暫相遇。","msg":"如果那一眼真有某種緣分，牠可能在說：『我過得很好，只是想讓你看一眼。你不需要把我帶回家，知道我平安就夠了。』","rx":"你可能遇見一個陌生孩子對你微笑、靠近，或用熟悉的眼神看你，讓你在沒有理由的情況下想起牠。","fw":"這類重逢可能只有一瞬間，卻足以讓你心裡某個問題得到安慰；不必追問對方身分。","sa":"把那一刻收進心裡，尊重陌生孩子與家人的界線。","adv":"把那一刻收進心裡，尊重陌生孩子與家人的界線。","jie":"「擦肩而過的小朋友」說的是短暫的投胎重逢。牠可能成為與你沒有家庭關係的孩子，只在人群裡和你交換一個眼神。這支籤提醒你，有些相遇的意義只是讓你放心，不是要你重新擁有。"},{"n":236,"t":"比你更早認出的緣分","sub":"離別中","yu":"你還在懷疑時，新的生命也許已經先用靠近，回答了牠記不記得你。","st":"新的孩子或毛孩可能比你更早表現出親近，帶來被認出的感覺。","msg":"象徵性的牠可能想說：『你可以慢慢想，我會先靠近。以前是你在人群裡找到我，這一次，換我先找到你。』","rx":"第一次見面時，對方可能主動靠近、依偎、安靜凝視，或對你的聲音有特別明顯的反應。","fw":"關係會在自然相處中慢慢形成；是否與前世有關未必能確定，但你們眼前的緣分值得珍惜。","sa":"先建立現實中的信任，不要急著測試對方是否記得前世。","adv":"先建立現實中的信任，不要急著測試對方是否記得前世。","jie":"「比你更早認出的緣分」是一支主動靠近的重逢籤。新的生命可能對你有超乎預期的親近，讓你相信牠先認出了你。保留這份感動，同時讓新的關係從現在開始，而不是被過去限制。"},{"n":237,"t":"帶著祝福去下一站","sub":"離別中","yu":"你最後說出口的祝福，也許就是牠走向下一段生命時，帶在身上的小小行李。","st":"牠可能已經準備投胎，而你真心的祝福能幫助自己放下牽掛。","msg":"象徵性的牠想說：『我知道你捨不得，但你說希望我下次也幸福時，我就知道自己可以放心往前走了。』","rx":"你可能在告別、祭拜或寫信後，夢見牠轉身離開；醒來雖然會哭，心裡卻比以前平靜。","fw":"牠的去向可能不會有明確答案，但你的悲傷會慢慢從抓緊，變成能夠祝福。","sa":"對牠說出你希望牠下一段生命得到的三件事。","adv":"對牠說出你希望牠下一段生命得到的三件事。","jie":"「帶著祝福去下一站」象徵投胎前的最後一份禮物。你無法替牠選擇下一段生命，卻可以把祝福交給牠。當愛不再只是挽留，也能成為送牠安心出發的 const DATA_URLS={love:"data/love.json",work:"data/work.json",choice:"data/choice.json",life:"data/life.json",pet:"data/pet.json"};
async function loadTheme(theme){
  if(theme==="random"){
    await Promise.all(Object.keys(DATA_URLS).map(loadTheme));
    return;
  }
  if(F[theme]) return;
  try{
    const res=await fetch(DATA_URLS[theme],{cache:"no-cache"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows=await res.json();
    if(!Array.isArray(rows)||!rows.length) throw new Error("empty data");
    F[theme]=rows;
  }catch(err){
    console.warn(`外部籤詩載入失敗，改用內建資料：${theme}`,err);
    F[theme]=EMBEDDED_FORTUNES[theme];
  }
}

async function draw(theme,sub){
  await loadTheme(theme);
  let pool=[];
  let rt=theme;
  if(theme==="random"){
    pool=[...F.love,...F.work,...F.choice,...F.life,...F.pet];
    const p=pool[Math.floor(Math.random()*pool.length)];
    rt=F.love.includes(p)?"love":F.work.includes(p)?"work":F.choice.includes(p)?"choice":F.pet.includes(p)?"pet":"life";
    return {...p,theme:rt,id:p.n+"-"+Date.now()};
  }
  pool=(F[theme]||[]).filter(p=>!sub||p.sub===sub);
  if(!pool.length) throw new Error(`找不到「${TL[theme]||theme} / ${sub||"未分類"}」的籤詩資料`);
  const p=pool[Math.floor(Math.random()*pool.length)];
  return {...p,theme:rt,id:p.n+"-"+Date.now()};
}
