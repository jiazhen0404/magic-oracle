/* 相談室測試模式。網址帶 ?test=1 進站就記住，?test=0 關掉。
   一定要在這裡執行——抽籤時網址會被改寫成 #start，參數就沒了。 */
(function(){
  try{
    var q = new URLSearchParams(location.search).get('test');
    if(q === '1') localStorage.setItem('uw.talk.test','1');
    if(q === '0') localStorage.removeItem('uw.talk.test');
  }catch(e){}
})();
</script>

<style>
:root{
  --bg-top:#0e0a22; --bg-mid:#1a1338; --bg-bot:#271b47;
  --gold:#d9bd82; --gold-soft:#c3a874; --gold-line:rgba(206,176,112,.38);
  --text:#ece4f5; --text-soft:#b6a6cf; --text-faint:#8b7bab;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--text);
  background:radial-gradient(150% 100% at 50% 0%, var(--bg-bot), var(--bg-mid) 45%, var(--bg-top));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0}
button{font-family:var(--serif);cursor:pointer}
.starfield{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#f4ecd0;box-shadow:0 0 4px #e9d9a8}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spinAura{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes auraPulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes shakeCyl{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-1.6deg)}35%{transform:translateX(7px) rotate(1.6deg)}55%{transform:translateX(-6px) rotate(-1.2deg)}75%{transform:translateX(6px) rotate(1.2deg)}90%{transform:translateX(-3px) rotate(-.6deg)}}
@keyframes stickRise{0%{transform:translateY(200px);opacity:0}22%{opacity:1}100%{transform:translateY(6px);opacity:1}}
@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@keyframes tapRing{0%{transform:translate(-50%,-50%) scale(.85);opacity:.55}100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}

#root{position:relative;z-index:2}

.brand-cn{font-family:var(--serif);color:var(--gold);letter-spacing:.28em;text-shadow:0 0 20px rgba(217,189,130,.45)}

.gold-label{color:var(--gold);letter-spacing:.35em;font-size:14px}
.faint{color:var(--text-faint)} .soft{color:var(--text-soft)}

/* ===== Full-page / RWD background fix ===== */
html {

  isolation:isolate;

/* Real background layer: always fills the viewport, even on mobile browsers */
body::before {
  content:"";
  position:fixed !important;
  inset:-2px !important;
  width:auto !important;
  height:auto !important;
  z-index:0 !important;
  pointer-events:none;
  background:
    linear-gradient(rgba(7,3,20,.08), rgba(7,3,20,.20)),

  transform:translateZ(0);
  -webkit-transform:translateZ(0);
}

/* Subtle readability vignette on a separate layer */
body::after {
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at center,
      rgba(8,3,20,0) 0%,
      rgba(7,3,18,.04) 56%,

成緣分的邀請，而不是要求新毛孩成為牠的替代品。"},{"n":224,"t":"門口的新腳步","sub":"離別中","yu":"熟悉的腳步停過一次，生命也可能安排另一雙小腳，再次走向你。","st":"牠可能準備透過一次收養、救援或偶然相遇，把新的緣分帶到你門前。","msg":"象徵性的牠像在說：『你不用四處找我。當那個需要你、也願意靠近你的生命出現時，你會知道自己的心又能打開了。』","rx":"你可能突然看見送養訊息、在路上遇到動物，或被朋友詢問是否願意照顧一個新生命。","fw":"新的毛孩緣分可能來得很自然，但不一定立刻發生；它更像在你準備好時，輕輕敲門。","sa":"先評估時間、空間與照顧能力，不要只因一瞬間的熟悉感做決定。","adv":"先評估時間、空間與照顧能力，不要只因一瞬間的熟悉感做決定。","jie":"「門口的新腳步」談的是透過收養或偶遇而來的再次相逢。你可能會覺得是牠安排了這段緣分，也可能只是愛讓你重新看見需要被照顧的生命。無論是哪一種理解，真正重要的是你已經慢慢有能力再次去愛。"},{"n":225,"t":"家族裡的小星星","sub":"離別中","yu":"牠熟悉的不只有你，也有整個家的聲音；下一段緣分，也許仍會落在這個家族裡。","st":"這支籤象徵牠可能投胎成家人或親友的孩子，繼續靠近熟悉的家庭。","msg":"如果這份想像能說話，牠也許會說：『我想回到有你們笑聲的地方。就算不再只屬於你，你仍可能在家人的懷裡，再次看見我熟悉的光。』","rx":"家族中可能傳來懷孕、新生兒或領養孩子的消息，讓你無端想起牠，甚至感到一種難以解釋的親近。","fw":"若新的孩子來到家族，這份熟悉可能讓你得到安慰；但孩子仍有自己的生命故事，不需要背負成為誰的責任。","sa":"珍惜熟悉感，同時尊重新生命自己的個性與人生。","adv":"珍惜熟悉感，同時尊重新生命自己的個性與人生。","jie":"「家族裡的小星星」把投胎的可能放在熟悉的家族裡。也許是你的孩子，也許是手足或親友的孩子。這支籤想說的不是誰一定是牠，而是你曾經給牠的家庭感，可能成為你相信牠願意再次靠近的理由。"},{"n":226,"t":"先認出你的聲音","sub":"離別中","yu":"模樣可以改變，名字可以重新取；有些熟悉，卻會在聽見你的聲音時先醒來。","st":"牠可能已經以新的生命開始旅程，而你們尚未正式相遇。","msg":"象徵性的牠想說：『我正在學習新的身體、新的世界。也許現在還不能走到你面前，但熟悉的愛，會替我們保留一條路。』","rx":"你可能對某個陌生孩子或動物的反應格外在意，尤其是牠聽見你的聲音後，出現讓你熟悉的眼神或動作。","fw":"是否重逢不一定很快有答案。這份籤比較像提醒你留意緣分，而不是四處尋找牠的證明。","sa":"遇到熟悉感時先停一下、感受一下，不急著替對方定義身分。","adv":"遇到熟悉感時先停一下、感受一下，不急著替對方定義身分。","jie":"「先認出你的聲音」象徵牠也許已經投胎，只是你們還沒真正相遇。重逢若存在，未必靠外表辨認，而可能來自一個瞬間的熟悉。請保留想像，也為現實中的新生命留下自由。"},{"n":227,"t":"另一個家的窗","sub":"離別中","yu":"牠下一段生命未必回到你身邊，也可能在另一扇窗前，被另一雙手好好接住。","st":"這支籤象徵牠可能已在另一個家庭展開新的生命。","msg":"如果牠能傳來一句話，也許會是：『別因為我沒有回到你身邊就難過。你教過我被愛的感覺，所以無論我去了哪裡，都知道怎麼靠近溫暖。』","rx":"你可能夢見牠在陌生但明亮的地方，身邊有人照顧；醒來後，比起悲傷，心裡反而多了一點放心。","fw":"你們未必會在現實中再次相認，但你對牠的祝福，能幫助自己慢慢接受：愛也可以包含放手。","sa":"試著對牠說：『如果你在別的地方過得幸福，我也願意替你高興。』","adv":"試著對牠說：『如果你在別的地方過得幸福，我也願意替你高興。』","jie":"「另一個家的窗」不是失去第二次，而是一種更寬的祝福。牠可能沒有選擇回到你身邊，而是在另一個家庭開始新生活。若你願意相信投胎，這支籤希望你知道：沒有再次擁有，也不代表你們的愛不夠深。"},{"n":228,"t":"還想再當你的毛孩","sub":"離別中","yu":"曾經被你好好愛過的靈魂，也許會記得家的方向，想再一次成為你的毛孩。","st":"牠可能仍偏愛以毛孩的身分回來，延續熟悉的陪伴方式。","msg":"象徵性的牠像在撒嬌：『做人好像太複雜了，我還想用四隻腳跑向你，睡你的位置，繼續當那個被你叫名字就回頭的孩子。』","rx":"未來出現的新毛孩，可能在睡姿、撒嬌方式、喜歡的位置或某個小脾氣上，讓你突然鼻酸。","fw":"新的毛孩緣分可能再次靠近，但相似與不同都會同時存在；那不是複製，而是一段新的相處。","sa":"可以相信熟悉感，但不要拿新毛孩和牠反覆比較。","adv":"可以相信熟悉感，但不要拿新毛孩和牠反覆比較。","jie":"「還想再當你的毛孩」是一支很親近的重逢籤。牠可能還想以最熟悉的方式回到你身邊：再次成為你的狗、貓或其他毛孩。這是一種象徵性的解讀，真正的重點是新的陪伴若出現，你已經知道如何好好愛牠。"},{"n":229,"t":"夢裡選的新名字","sub":"離別中","yu":"牠在夢裡沒有回頭，也許不是離開你，而是正往下一個名字走去。","st":"這支籤象徵牠已經準備告別舊身分，迎接下一段生命。","msg":"牠的象徵性來信可能是：『以前的名字我會放在心裡，但下一次，我也想知道自己還能成為誰。請不要因為我往前走，就以為我不愛你。』","rx":"你可能夢見牠走向門、光、階梯或陌生遠方；夢裡的氣氛若平靜，常反映你的心正在接受牠繼續前進。","fw":"牠的下一段旅程可能不再圍繞過去，而你也會慢慢從追問去向，走向祝福。","sa":"替牠寫一句祝福：『無論下一次叫什麼名字，都希望你被好好愛著。』","adv":"替牠寫一句祝福：『無論下一次叫什麼名字，都希望你被好好愛著。』","jie":"「夢裡選的新名字」象徵牠已準備投胎，並願意成為一個全新的生命。真正的愛不是要求牠永遠停在原來的位置，而是即使捨不得，也願意祝福牠帶著被愛過的記憶繼續前進。"},{"n":230,"t":"同一天的兩道光","sub":"離別中","yu":"一個生命告別的日子，也可能在多年後，成為另一個生命靠近你的暗號。","st":"日期、時間或數字的巧合，可能讓你聯想到牠已用新的身分回來。","msg":"象徵性的牠可能想說：『我知道你會記得那些重要的日子，所以如果有一天，另一道光在相似的時間亮起，你可以把它當成我留給你的問候。』","rx":"新生命的生日、相遇日或重要數字，可能和牠的紀念日出現巧合，讓你感到震動。巧合可以有意義，但不等於證明。","fw":"你會找到一種能同時記得牠、也歡迎新生命的方式，不必在過去與未來之間二選一。","sa":"記下巧合帶來的感受，不需要急著說服別人相信。","adv":"記下巧合帶來的感受，不需要急著說服別人相信。","jie":"「同一天的兩道光」談的是日期與數字帶來的重逢感。你可能因此相信牠投胎回來，也可能把它理解成記憶替日子加上意義。無論答案是哪一個，那份被安慰的感覺都是真實的。"},{"n":231,"t":"借一個小習慣回來","sub":"離別中","yu":"牠未必帶著全部記憶回來，也許只偷偷留下了一個你最熟悉的小習慣。","st":"新生命身上出現熟悉習慣，可能讓你感到牠以某種方式延續了緣分。","msg":"如果牠能解釋，也許會說：『新的我會有新的個性，但我想留下一點小暗號，讓你在某個瞬間知道，那份愛曾經來過。』","rx":"你可能在孩子或新毛孩身上，看見相似的睡姿、偏好、表情或安慰你的方式。","fw":"熟悉的小動作會替你打開記憶，也可能幫助你更溫柔地接納眼前這個全新的生命。","sa":"把相似當作禮物，不要把不同當成牠沒有回來的證據。","adv":"把相似當作禮物，不要把不同當成牠沒有回來的證據。","jie":"「借一個小習慣回來」是一支關於細節的投胎籤。新的生命也許只帶著一點熟悉，而不是完整複製牠。這樣的安排反而更溫柔：你可以記得從前，也能真正認識現在。"},{"n":232,"t":"不急著離開的靈魂","sub":"離別中","yu":"不是每個靈魂都急著投胎；有些會先坐在回憶旁邊，陪你把眼淚慢慢哭完。","st":"牠可能還沒有準備投胎，象徵性的陪伴仍停留在你的記憶與日常裡。","msg":"牠可能想說：『我知道你還需要一點時間。我不催你放下，也不急著去很遠的地方。等你想到我時不再只剩眼淚，我們再一起往前。』","rx":"你可能常在熟悉的位置感到牠的存在、夢見牠待在原來的家，或下意識保留牠的生活習慣。","fw":"投胎的想像目前不是重點；這段時間更像是你們一起完成告別，把愛安放到不再刺痛的位置。","sa":"不必催自己收起遺物或開始新的陪伴，照自己的速度來。","adv":"不必催自己收起遺物或開始新的陪伴，照自己的速度來。","jie":"「不急著離開的靈魂」提醒你，不是所有離世毛孩都必須立刻投胎。若你仍感覺牠在家裡，可以把那份存在感理解成深刻生活記憶留下的回音。等你們都準備好了，下一段旅程自然會開始。"},{"n":233,"t":"先去遠方旅行","sub":"離別中","yu":"牠不一定立刻回來，也許想先看看沒有病痛、沒有牽繩的遠方。","st":"牠可能象徵性地進入一段自由休息的旅程，暫時沒有投胎計畫。","msg":"如果牠能寄來明信片，也許會寫：『我現在跑得很輕，身體也不痛了。別擔心我沒有回來，我只是想先去看看更遠的地方。』","rx":"夢裡的牠可能在奔跑、草地、海邊或開闊空間，看起來比生病時更輕鬆。","fw":"你會慢慢從牠最後的病痛畫面，重新想起牠健康、快樂的樣子；重逢是否發生，可以交給更後面的時間。","sa":"選一張牠最有精神的照片，放在你看得到的地方。","adv":"選一張牠最有精神的照片，放在你看得到的地方。","jie":"「先去遠方旅行」是一支暫不投胎的籤。牠可能需要休息，也可能只是你希望牠終於自由的心願。這份想像能幫助你把牠從最後的痛苦中放開，重新記得牠曾經那麼有生命力。"},{"n":234,"t":"成為守護你的孩子","sub":"離別中","yu":"以前是你照顧牠，下一次相遇，也許換牠用一個孩子的笑容，陪你走更長的路。","st":"這支籤象徵牠可能投胎成你的孩子，讓彼此的照顧關係換一種方向繼續。","msg":"象徵性的牠想說：『以前你替我準備每一餐、守著我生病。下一次，如果我成為你的孩子，我想用更長的時間陪你，也讓你知道自己值得被依賴。』","rx":"你可能夢見牠變成孩子、抱著嬰兒，或在想到未來家庭時，突然感覺牠也在那幅畫面裡。","fw":"這份籤帶來的是家庭緣分的想像；若孩子真的到來，牠可能讓你再次體會熟悉的牽掛，也會展開完全不同的新關係。","sa":"把這份想像當成祝福，不要把懷孕或生育變成驗證牠是否回來的壓力。","adv":"把這份想像當成祝福，不要把懷孕或生育變成驗證牠是否回來的壓力。","jie":"「成為守護你的孩子」直接指向投胎成你的小孩。它感人的地方不在於保證，而在於一種角色交換：你曾用盡全力照顧牠，也許下一次，這份靈魂緣分會用更長的人生回到你身邊。"},{"n":235,"t":"擦肩而過的小朋友","sub":"離別中","yu":"有些重逢不會留下姓名，只是一個陌生孩子回頭看你時，心忽然被輕輕碰了一下。","st":"牠可能已投胎成你生命之外的孩子，你們只會短暫相遇。","msg":"如果那一眼真有某種緣分，牠可能在說：『我過得很好，只是想讓你看一眼。你不需要把我帶回家，知道我平安就夠了。』","rx":"你可能遇見一個陌生孩子對你微笑、靠近，或用熟悉的眼神看你，讓你在沒有理由的情況下想起牠。","fw":"這類重逢可能只有一瞬間，卻足以讓你心裡某個問題得到安慰；不必追問對方身分。","sa":"把那一刻收進心裡，尊重陌生孩子與家人的界線。","adv":"把那一刻收進心裡，尊重陌生孩子與家人的界線。","jie":"「擦肩而過的小朋友」說的是短暫的投胎重逢。牠可能成為與你沒有家庭關係的孩子，只在人群裡和你交換一個眼神。這支籤提醒你，有些相遇的意義只是讓你放心，不是要你重新擁有。"},{"n":236,"t":"比你更早認出的緣分","sub":"離別中","yu":"你還在懷疑時，新的生命也許已經先用靠近，回答了牠記不記得你。","st":"新的孩子或毛孩可能比你更早表現出親近，帶來被認出的感覺。","msg":"象徵性的牠可能想說：『你可以慢慢想，我會先靠近。以前是你在人群裡找到我，這一次，換我先找到你。』","rx":"第一次見面時，對方可能主動靠近、依偎、安靜凝視，或對你的聲音有特別明顯的反應。","fw":"關係會在自然相處中慢慢形成；是否與前世有關未必能確定，但你們眼前的緣分值得珍惜。","sa":"先建立現實中的信任，不要急著測試對方是否記得前世。","adv":"先建立現實中的信任，不要急著測試對方是否記得前世。","jie":"「比你更早認出的緣分」是一支主動靠近的重逢籤。新的生命可能對你有超乎預期的親近，讓你相信牠先認出了你。保留這份感動，同時讓新的關係從現在開始，而不是被過去限制。"},{"n":237,"t":"帶著祝福去下一站","sub":"離別中","yu":"你最後說出口的祝福，也許就是牠走向下一段生命時，帶在身上的小小行李。","st":"牠可能已經準備投胎，而你真心的祝福能幫助自己放下牽掛。","msg":"象徵性的牠想說：『我知道你捨不得，但你說希望我下次也幸福時，我就知道自己可以放心往前走了。』","rx":"你可能在告別、祭拜或寫信後，夢見牠轉身離開；醒來雖然會哭，心裡卻比以前平靜。","fw":"牠的去向可能不會有明確答案，但你的悲傷會慢慢從抓緊，變成能夠祝福。","sa":"對牠說出你希望牠下一段生命得到的三件事。","adv":"對牠說出你希望牠下一段生命得到的三件事。","jie":"「帶著祝福去下一站」象徵投胎前的最後一份禮物。你無法替牠選擇下一段生命，卻可以把祝福交給牠。當愛不再只是挽留，也能成為送牠安心出發的力量。"},{"n":238,"t":"新的生命不是替代","sub":"離別中","yu":"即使牠真的回來，也不會只是過去的複製；愛會記得，生命仍要重新長大。","st":"這支籤提醒你，投胎重逢與尋找替代品是兩件不同的事。","msg":"象徵性的牠可能想說：『如果我再回來，請重新認識我。不要要求我做回以前的每一件事，因為我也想在你的愛裡長成新的自己。』","rx":"新孩子或毛孩可能既有熟悉之處，也有完全不同的個性；不同不代表緣分是假的。","fw":"當你不再要求重現過去，新的關係反而更能自然地長出屬於自己的深度。","sa":"少問『是不是牠』，多問『眼前這個生命需要我怎麼愛』。","adv":"少問『是不是牠』，多問『眼前這個生命需要我怎麼愛』。","jie":"「新的生命不是替代」是投胎籤裡很重要的提醒。即使你相信牠回來了，眼前的新生命也不該被要求完整複製過去。真正延續的不是習慣與外表，而是你願意再次學習如何愛一個獨立的生命。"},{"n":239,"t":"先成為你的夢","sub":"離別中","yu":"在成為下一個生命之前，牠也許會先回到夢裡，讓你知道自己準備出發了。","st":"牠可能透過告別夢，象徵自己即將走向投胎或新的旅程。","msg":"夢裡的牠可能想說：『我來不是讓你再次失去，而是想在出發前好好看你一眼。下次見面，也許我們都會換一個模樣。』","rx":"夢境可能特別清楚、平靜，牠看起來健康，甚至像在道別；醒來後常會同時感到難過與安心。","fw":"這個夢可能成為悲傷的轉折，讓你比較能接受牠繼續前進，也開始對未來的重逢保持溫柔期待。","sa":"把夢記下來，但不要因為沒有再夢見牠就認為牠消失了。","adv":"把夢記下來，但不要因為沒有再夢見牠就認為牠消失了。","jie":"「先成為你的夢」象徵投胎前的告別。很多人在失去毛孩後，會把清楚而平靜的夢理解為牠來說再見。無論夢是否具有超自然意義，它都可能幫助你的心完成一段重要的送別。"},{"n":240,"t":"我們還會再相愛一次","sub":"離別中","yu":"下一次，你們也許不會記得從前的名字，卻仍會在相遇時，再一次選擇彼此。","st":"這支籤象徵你和牠的緣分可能跨過不同身分，在未來重新開始。","msg":"如果牠能把約定留下，可能會是：『我不保證用什麼模樣回來，但如果人群、歲月和新的生命讓我們再相遇，我還是想再一次走向你。』","rx":"未來某段關係可能帶來沒有來由的熟悉、信任與心疼，像是你們不需要很久就知道如何陪伴彼此。","fw":"重逢未必能被認出或證明，但你曾給牠的愛，會讓你在下一次緣分到來時，更有能力珍惜。","sa":"不要停止生活來等待牠；好好走下去，才有機會在新的路上再次相遇。","adv":"不要停止生活來等待牠；好好走下去，才有機會在新的路上再次相遇。","jie":"「我們還會再相愛一次」不是保證重逢的預言，而是一個關於緣分的溫柔承諾。投胎也許讓名字、模樣和身分都改變，但如果愛真的會留下方向，那麼下一次相遇時，你們仍可能重新選擇彼此。"}]};

const TL={love:"愛情",work:"工作",choice:"選擇",life:"人生",pet:"毛孩",monthly:"本月主題籤",random:"隨機一籤"};
async function draw(theme,sub){
  await loadTheme(theme);
  let pool=[];
  let rt=theme;
  if(theme==="random"){
    pool=[...F.love,...F.work,...F.choice,...F.life,...F.pet];
    const p=pool[Math.floor(Math.random()*pool.length)];
    rt=F.love.includes(p)?"love":F.work.includes(p)?"work":F.choice.includes(p)?"choice":F.pet.includes(p)?"pet":"life";
    return {...p,theme:rt,id:p.n+"-"+Date.now()};
  }
  pool=(F[theme]||[]).filter(p=>!sub||p.sub===sub);
  if(!pool.length) throw new Error(`找不到「${TL[theme]||theme} / ${sub||"未分類"}」的籤詩資料`);
  const p=pool[Math.floor(Math.random()*pool.length)];
  return {...p,theme:rt,id:p.n+"-"+Date.now()};
}

localStorage.removeItem("magic_oracle_free_draw_used");return true;}if(oracleHasPaidDraw()){sessionStorage.removeItem("magic_oracle_paid_draw");return true;}return false;}function weeklyKey(){const d=new Date();const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;}function weeklyHasDrawn(){return !!localStorage.getItem("magic_oracle_weekly_"+weeklyKey());}function weeklyGet(){const raw=localStorage.getItem("magic_oracle_weekly_"+weeklyKey());if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}function weeklyPick(){const old=weeklyGet();if(old)return old;const f={...WEEKLY_ORACLES[Math.floor(Math.random()*WEEKLY_ORACLES.length)]};localStorage.setItem("magic_oracle_weekly_"+weeklyKey(),JSON.stringify(f));trackOracleEvent("weekly_oracle_complete",{fortune_number:f.n,fortune_title:f.t,week:weeklyKey()});return f;}const GUANYIN_TIPS=[{"t":"雲開見月","b":"籤級｜上吉\n\n籤詩\n雲散長空月漸明，前途莫向暗中尋。\n舊疑若解心先定，自有清光照此行。\n\n籤意\n眼前的混亂正在慢慢散去。近期先不要因為過去的失望，預設新的事情也會失敗。若有新的消息、邀請或重新啟動的機會出現，可以多看一步再決定。\n\n近期可能對應\n這支籤不限定感情、工作或人際；請對照你此刻最掛念的那件事，看『現在該進、該等、該放，還是該看清』。不要為了套中籤意而勉強解讀。\n\n觀音提點\n昨日的雨，不必帶到今日。","grade":"上吉"},{"t":"水到渠成","b":"籤級｜上吉\n\n籤詩\n細水長流入遠川，功成不在一朝間。\n莫嫌今日花開晚，時至自然果滿園。\n\n籤意\n有件事其實已經累積了一段時間，近期比過去更接近成熟。不要在最後一段路因焦慮而突然改變原本有效的方法。\n\n近期可能對應\n這支籤不限定感情、工作或人際；請對照你此刻最掛念的那件事，看『現在該進、該等、該放，還是該看清』。不要為了套中籤意而勉強解讀。\n\n觀音提點\n該做的持續做，成熟的果自然會落下。","grade":"上吉"},{"t":"所求有望","b":"籤級｜上吉\n\n籤詩\n心有所求路未窮，微光已在遠山中。\n若將今日當行處，自有因緣漸相逢。\n\n籤意\n你心裡所求的事情仍有發展空間，但結果需要你的配合，不是只靠等待。把能做的部分做好，剩下的讓時間回答。\n\n近期可能對應\n這支籤不限定感情、工作或人際；請對照你此刻最掛念的那件事，看『現在該進、該等、該放，還是該看清』。不要為了套中籤意而勉強解讀。\n\n觀音提點\n有望，不等於坐等；盡人事後才好安心。","grade":"上吉"},{"t":"善緣將聚","b":"籤級｜上吉\n\n籤詩\n清風入戶客相逢，一盞微燈照路通。\n莫問貴人居何處，真心常在尋常中。\n\n籤意\n近期適合多與讓你感到踏實的人往來。好的關係會帶來資訊、支持與新的可能，也會讓你更容易離開消耗你的圈子。\n\n近期可能對應\n這支籤不限定感情、工作或人際；請對照你此刻最掛念的那件事，看『現在該進、該等、該放，還是該看清』。不要為了套中籤意而勉強解讀。\n\n觀音提點\n靠近善意，運也會跟著轉向。","grade":"上吉"},{"t" 。"},{"t":"他有好感，但還沒準備好進入關係","b":"對方可能真的喜歡你，也享受靠近你的感覺，只是現階段對承諾仍有顧慮。原因可能來自上一段關係、生活壓力，或單純還沒確定自己想要什麼。\n\n所以你會同時收到靠近與退縮兩種訊號；這兩件事目前可能都是真的。"},{"t":"你比他更早走進這段關係","b":"目前你對關係的期待已經比對方更明確。你開始在意回覆速度、稱呼與未來可能性，而對方仍比較像在認識、觀察，甚至只是順著舒服的互動往前。\n\n不是完全沒有機會，但此刻兩人的投入程度並不對等。"},{"t":"他享受曖昧，卻未必想定下來","b":"對方可能喜歡你的陪伴、關心與特殊感，也願意維持親密互動，但目前看不到相同程度的承諾意願。\n\n這種狀態最容易把『有感覺』和『想交往』混在一起；現在比較明確的是前者，後者仍沒有足夠證據。"},{"t":"曖昧正在降溫","b":"曾經有過熱度，但近期的主動、回覆品質或見面意願正在下降。你可能還在延續原本的節奏，對方卻開始把注意力移回自己的生活。\n\n這不一定代表感情完全消失，但目前確實缺少繼續升溫的動力。"},{"t":"關係停在原地很久了","b":"你們可能已經維持曖昧一段時間，互動模式卻始終沒有新的變化。甜的時候很甜，但每次快要談到定位，就又回到原點。\n\n目前最大的訊號不是好或壞，而是『沒有進展』本身；這段關係暫時更像被維持，而不是被推進。"},{"t":"比較像朋友，只是偶爾讓人誤會","b":"你們之間有親近、有默契，甚至偶爾會出現帶點曖昧的玩笑，但整體互動仍比較接近舒服的朋友關係。\n\n如果只有你在放大那些特殊時刻，而對方對其他朋友也有類似互動，就要保留『訊號被誤讀』的可能。"},{"t":"網路很靠近，現實還沒跟上","b":"訊息裡的你們可能很有火花，會聊很深、聊很久，甚至產生很強的熟悉感；但真正的相處、見面與生活交集仍不足。\n\n這段關係目前的情感連結可能是真的，只是還沒有經過現實相處的驗證。"},{"t":"吸引力很強，但感情基礎還薄","b":"你們之間可能有明顯化學反應，見面時容易靠近，也很在意彼此的外表或身體距離；可是談到價值觀、生活安排與長期認識，內容仍偏少。\n\n現在比較確定的是吸引，而不是關係已經成熟。"},{"t":"對方最近真的沒有太多心力","b":"近期的冷淡未必全部指向感情。工作、家庭、考試或生活壓力可能讓對方暫時把關係放到後面，因此互動變少，卻沒有明顯切斷你的跡象。\n\n這種狀態通常會呈現『少，但沒有消失』，而不是只在需要你時才突然出現。"},{"t":"斷聯後重新靠近，但動機還看不清","b":"對方重新出現可能代表想念、好奇、寂寞，也可能只是想確認你是否還在。單靠一次主動或一句『最近好嗎』，還無法判斷是不是準備重新發展。\n\n真正值得觀察的是回來之後有沒有持續投入，而不是回來這件事本身。"},{"t":"關係裡可能還有其他選項","b":"你可能感覺到對方並沒有把全部注意力放在這段曖昧上：行程模糊、熱度忽高忽低，或對關係定位特別迴避。\n\n這不等於能直接判定有第三者，但目前確實存在『對方仍在認識其他人或保留其他選擇』的可能。"},{"t":"上一段感情還沒有真正退場","b":"對方可能對你有好感，但某些反應仍被過去牽動：談到承諾就退縮、偶爾提起前任，或明明靠近了又突然需要距離。\n\n現在卡住你們的，不一定是你不夠重要，而可能是他還沒有完全整理好上一段關係留下的東西。"},{"t":"兩個人都在享受當下，還沒有人想定義","b":"這段曖昧目前可能是雙方都覺得舒服：會聊天、會見面、會想念，但誰也沒有真的把『交往』當成迫切目標。\n\n它不一定是壞狀態，只是現階段比較像共享一段親密，而不是正在等待某個人開口告白。"},{"t":"他對你的態度正在變得更認真","b":"如果以前的互動比較隨性，近期卻開始出現固定聯絡、提前約時間、記得你的重要事情，甚至願意談自己的脆弱面，這通常代表關係正在從好感往更深的位置移動。\n\n這支結果偏正向，重點在於『穩定增加的投入』，而不是單次浪漫。"},{"t":"忽冷忽熱，是這段關係目前的主旋律","b":"你們可能常在很靠近之後突然安靜，等你快要放下時，對方又重新出現。這種反覆不一定是故意操控，也可能是對方自己對親密關係就很矛盾。\n\n但無論原因是什麼，目前可以確定的是：這段關係還沒有形成穩定節奏。"},{"t":"這段曖昧可能正在走向結束","b":"近期如果主動幾乎只剩單方面、話題難以延續、邀約總被推遲，也沒有新的靠近訊號，那麼關係可能不是暫時停頓，而是在慢慢退出彼此生活。\n\n曾經有過感覺不代表一定會走到交往；有些曖昧的結局，就是沒有再往下一步。"},{"t":"現在還太早，訊號彼此矛盾","b":"你們之間同時存在靠近與保留：有時很熱絡，有時又像普通朋友；有好感的跡象，卻沒有足夠行動可以定義。\n\n這不是『答案藏得很深』，而是關係本身可能真的還沒有形成答案。現在最符合的狀態就是：仍在發展中。"}];
const LOVE_LETTERS=["我其實一直有想過你。\n\n不是每天，也不是每一個晚上。但總有一些很普通的瞬間，會突然讓我想起以前的我們。\n\n我不是沒有打開過你的對話框，只是時間隔得越久，我越不知道該用什麼身份重新出現。我怕一句想念會讓你以為我要回來，也怕我什麼都不說，你就真的把我忘了。\n\n所以到最後，我還是把那些話留在沒有送出去的地方。","我知道我的沉默讓你猜了很久。\n\n如果你曾經覺得我忽冷忽熱，那不是你的錯覺。我確實一邊想靠近你，一邊又在害怕事情變得太認真。\n\n我喜歡你在我身邊的感覺，也喜歡被你在意。可每當我想到『我們到底算什麼』，我就會下意識退一步。\n\n不是因為你不夠好。是那時候的我，連自己想要什麼都說不清楚。","好久沒有聯絡了。\n\n我以為時間久了，那些沒說完的事就會自己消失。可是偶爾經過熟悉的地方、聽見某首歌，我還是會想到你。\n\n我不知道現在的你還願不願意收到我的消息，也不知道重新出現究竟是想念，還是我的自私。\n\n所以我沒有聯絡。只是想讓你知道，在我們沒有說話的這段時間裡，我不是一次都沒有想起你。","我曾經是真的喜歡你。\n\n如果你後來懷疑那些靠近是不是假的，我想告訴你，不是。只是喜歡一個人，和有能力好好留在一段關係裡，好像是兩回事。\n\n那時候的我以為不說清楚就不會傷害誰，最後卻讓你一個人猜了很久。\n\n我很抱歉，我沒有把那份喜歡變成一個你能安心站著的位置。","有一句話我一直沒有說：我那時候其實很怕失去你。\n\n所以我裝得不在乎，裝得好像誰先離開都無所謂。我以為只要先把心藏好，就不會成為比較受傷的那個人。\n\n可是我後來才發現，我保護自己的方式，也剛好把你推遠了。\n\n如果你曾經以為自己對我不重要，那是我最不會表達的一件事。你其實很重要。","我沒有回來，不代表我從來沒有想過回來。\n\n我打開過你的對話框，也想過很多種開場。可是每一句『最近好嗎』後面，好像都藏著太多我們沒有處理完的東西。\n\n我怕重新聯絡之後，我還是給不起你真正想要的答案。\n\n所以那句遲到的想念，我最後還是沒有寄出去。","我想跟你說一件可能不太好聽的事。\n\n有些時候我想找你，不是真的因為我準備好重新愛你，而是因為我寂寞了。我懷念你熟悉的語氣，懷念有人懂我的感覺。\n\n可我知道，想念一個人帶來的安慰，和想重新走進一段關係，不是同一件事。\n\n我不想再用我的孤單，讓你誤以為那是一個承諾。","我知道你可能一直在等一句比較明確的話。\n\n所以我想承認：我喜歡你，但我沒有想好要不要交往。\n\n我喜歡我們聊天的感覺，喜歡見到你，也會在你突然安靜時想知道你在做什麼。可是如果現在要我答應一段關係，我沒有辦法很肯定地說我準備好了。\n\n我知道這樣很矛盾，可這就是我一直沒說出口的部分。","我以為分開之後，我會輕鬆很多。\n\n剛開始確實是。沒有爭執，沒有猜測，也不用再面對那些我們一直解不開的問題。\n\n可是生活慢慢安靜下來之後，我才發現有些習慣不是說停就停。有時候我還是會下意識想把某件事告訴你。\n\n我不知道那是不是代表我想回去。我只知道，我比自己預想的更久才習慣沒有你。","我現在過得還不錯。\n\n這句話也許會讓你難過，但我不想假裝我一直停在原地。我有新的生活、新的事情，也慢慢學會不再每天回頭看我們。\n\n只是偶爾，我還是會想起你。那種想起已經不像以前那麼痛，更像是在想一個曾經非常熟悉的人。\n\n你沒有被我抹掉。只是我們真的走到了不同的地方。","如果你還在等我，我其實很想跟你說：不要再等了。\n\n不是因為你不值得，也不是因為我們之間從來沒有感情。恰恰是因為我知道你有多認真，我才不想再用沉默替自己保留一個位置。\n\n我現在沒有要回到那段關係裡。\n\n這句話很難說出口，可比起讓你一直猜，我寧願承認我已經做了選擇。","我身邊出現了另一個人。\n\n我不知道該怎麼告訴你，因為我們從來沒有真正把關係說清楚，可我也知道你可能一直把我們之間的那些靠近放在心上。\n\n這不是要否定以前的感覺。只是我們停在原地的時候，生活沒有跟著停。\n\n我很抱歉，這件事如果由你自己發現，一定比我親口說更難受。","我其實一直在等你先開口。\n\n很可笑吧。我明明也有很多次可以說，卻總覺得如果是我先承認，就好像把自己放在一個比較沒有退路的位置。\n\n所以我們兩個就這樣一直試探。你退一步，我也退一步；你靠近一點，我才敢再靠近一點。\n\n有時候我會想，如果當時有一個人勇敢一點，我們會不會已經不一樣了。","我對你有過心動，但可能沒有你想像得那麼深。\n\n我喜歡和你聊天，也期待過你的訊息。那些都是真的。只是當你開始把我們想得更遠時，我才發現自己沒有走到同樣的位置。\n\n我一直不知道怎麼說，因為我怕一說出口，就連原本舒服的關係都保不住。\n\n對不起，我的猶豫可能讓你把一些希望留得太久。","我不是故意消失的。至少一開始不是。\n\n那時候我只是覺得自己需要幾天安靜，後來拖得越久，就越不知道該怎麼解釋。最後連一句道歉都變得很難開口。\n\n我知道沉默本身也是一種回答，而且可能是最傷人的那種。\n\n我只是一直沒有勇氣承認，我處理感情的方式真的很糟。","我其實很想見你。\n\n不是隔著手機，不是偶爾回幾句訊息，而是真的坐在你面前，看你現在變成什麼樣子。\n\n可我也害怕那一面見下去，所有我以為已經整理好的東西又回來。\n\n所以我一直停在想像裡。想見你，卻沒有真的約你。","有時候我故意晚一點回你。\n\n不是因為我真的忙到沒有時間，而是因為我太在意自己看起來是不是也同樣喜歡你。我怕回得太快、問得太多，就會被你看見我的期待。\n\n現在想想很幼稚。\n\n我把喜歡藏成冷淡，再偷偷期待你能看懂。","我知道我們之間有吸引力。\n\n每次靠近你的時候，我都能感覺到那種很明顯的心動。可是如果你問我是不是已經了解你、是不是準備好把你放進我的未來，我其實還答不出來。\n\n我不想把強烈的喜歡說成永遠。\n\n至少現在，我能承認的是：我被你吸引，但我還在認識你。","我最近真的沒有太多力氣談感情。\n\n不是你哪裡做錯了，也不是我突然完全沒有感覺。只是我的生活有太多事情一起發生，我連自己的情緒都常常來不及整理。\n\n我知道從你的角度看，這很像冷淡。\n\n我只是沒有告訴你，我現在連靠近一個喜歡的人，都覺得需要很多力氣。","我還沒有完全放下上一個人。\n\n這不是一句很公平的話，尤其當我已經讓你靠近。你帶給我的好是真的，我對你的好感也是真的，可有些舊的情緒還會在我沒準備好的時候跑出來。\n\n所以我才會一下靠近、一下又退回去。\n\n你沒有輸給誰。只是我還沒有把過去真正收好。","我有想過和你認真試試看。\n\n不是那種一時心動的想法，而是真的想像過，如果我們不再只是曖昧，生活會變成什麼樣子。\n\n我還有一些害怕，也還沒把所有問題想清楚。\n\n可是至少有一件事是真的：你已經不是一個我可以很輕易帶過的人了。","我可能比你以為的更在意你。\n\n你隨口說過的事情，我其實記得。你哪一天特別安靜，我也會發現。只是我很少把這些表現出來，因為我一直覺得在感情裡先露出底牌的人比較容易受傷。\n\n所以你看到的我總是淡淡的。\n\n但那不代表我的心也一樣平靜。","我知道自己讓你失望了。\n\n你不是沒有給過我機會。很多次你其實已經把話說到那裡，只差我往前一步，可我總是在最後關頭退回去。\n\n我那時候一直以為還有下一次。\n\n直到你真的不再等，我才明白有些人的耐心，不是永遠都會留在原地。","我重新聯絡你，不是因為我已經想清楚所有事情。\n\n我只是某一天突然很想知道你過得好不好，也想確認我們之間是不是還留著一點什麼。\n\n我知道這樣可能很自私。\n\n如果我的出現又讓你的心亂了，我很抱歉。因為連我自己都還不知道，我回來究竟想走多遠。","我沒有討厭你。\n\n我們不再聯絡之後，我想過你是不是會把我的離開理解成厭倦或否定。其實不是。只是那時候的我們繼續靠近，已經比離開更讓我疲憊。\n\n有些感情不是因為恨才結束。\n\n有時候只是兩個人真的不知道怎麼再走下去了。","我曾經把你當成一個很安全的人。\n\n難過時想找你，開心時也想第一個告訴你。久了以後，我自己都分不清那是愛、依賴，還是習慣。\n\n我知道這對你不公平。\n\n因為你可能在等一個答案，而我只是捨不得失去一個總是在那裡的人。","我其實吃過你的醋。\n\n看到你跟別人靠近時，我會不舒服；你突然沒有找我，我也會想很多。可我又沒有立場問你，因為我們從來沒有真正說好彼此是什麼。\n\n所以我只能裝作沒事。\n\n那大概就是曖昧最折磨人的地方：明明在意，卻連吃醋都要假裝只是玩笑。","我不知道自己還愛不愛你。\n\n我知道這不是你想聽的答案，可它可能是最接近真實的。我還會想你，也還會在意你的消息；但如果要我說那是不是足以讓我們重新開始的愛，我沒有把握。\n\n我不是故意把答案藏起來。\n\n有時候連我自己，也真的不知道答案在哪裡。","我已經往前走了。\n\n這不代表以前的一切都不重要，也不代表我從來沒有愛過你。只是現在的我，已經不再把回到你身邊當成未來的一部分。\n\n我一直沒有說，是因為我知道這句話會很痛。\n\n可是如果有一天你終於不再等我，我希望你知道，那不是你放棄了我們，而是你終於把自己帶回去了。","如果現在真的站在你面前，我想我第一句會先說對不起。\n\n不是為了求你原諒，也不是為了重新開始。只是我後來才明白，當時有很多事情我明明可以說清楚，卻選擇讓你從沉默裡自己找答案。\n\n你承受了很多本來不該由你猜的東西。\n\n這句道歉來得太晚，但我一直欠你。"];

<script>
/* 分類興趣與延伸解籤需求追蹤 v1 */
(function(){
  const themeByLabel={"愛情":"love","工作":"work","選擇":"choice","生活":"life","毛孩心語":"pet","本月主題籤":"monthly","隨機一籤":"random"};
  const themeLabels={love:"愛情",work:"工作",choice:"選擇",life:"生活",pet:"毛孩心語",monthly:"本月主題籤",random:"隨機一籤"};
  const situationSlugs={
    "失戀中":"breakup","曖昧中":"ambiguous","關係中":"relationship","單身中":"single","桃花運勢":"peach_blossom",
    "迷惘中":"confused","求職中":"job_search","轉職中":"career_change","職場中":"workplace","創業中":"business",
    "兩難中":"dilemma","決定中":"decision","方向中":"direction","迷茫中":"lost","家庭中":"family","夢想中":"dream","日常中":"daily",
    "陪伴中":"together","擔心中":"worried","思念中":"missing","離別中":"passed_away","我該不該告白":"confess","需要繼續等他嗎":"wait-for-him","我該轉換跑道嗎":"career-switch","隨機訊息":"random_message"
  };
  const situationThemes={
    breakup:"love",ambiguous:"love",relationship:"love",single:"love",peach_blossom:"love",
    confused:"work",job_search:"work",career_change:"work",workplace:"work",business:"work",
    dilemma:"choice",decision:"choice",direction:"choice",lost:"life",family:"life",dream:"life",daily:"life",
    together:"pet",worried:"pet",missing:"pet",passed_away:"pet",confess:"monthly","wait-for-him":"monthly","career-switch":"monthly",random_message:"random"
  };
  function send(name,params){if(typeof trackOracleEvent==="function")trackOracleEvent(name,params||{});}
  function rememberTheme(theme){if(theme)sessionStorage.setItem("oracle_selected_theme",theme);}
  function currentTheme(situation){
    const slug=situationSlugs[situation]||"";
    return sessionStorage.getItem("oracle_selected_theme")||situationThemes[slug]||"unknown";
  }
  document.addEventListener("click",function(event){
    const card=event.target.closest(".theme-card");
    if(!card)return;
    const screenTitle=(card.closest(".device")?.querySelector(".topbar .ttl")?.textContent||"").trim();
    const label=(card.querySelector(".theme-name")?.textContent||"").trim();

      const theme=themeByLabel[label]||"unknown";
      rememberTheme(theme);
      const params={theme:theme,theme_label:label,selection_level:"category"};
      send("select_theme",params);
      if(theme!=="unknown")send("category_interest_"+theme,params);
    }else if(screenTitle==="選擇情境"){
      const theme=currentTheme(label);
      const slug=situationSlugs[label]||"unknown";
      const params={theme:theme,theme_label:themeLabels[theme]||theme,subtheme:label,situation_key:slug,selection_level:"situation"};

      if(theme!=="unknown"&&slug!=="unknown")send("situation_interest_"+theme+"_"+slug,params);
    }
  },true);

  const initialQuery=new URLSearchParams(location.search);
  const entryTheme=initialQuery.get("theme");
  const entrySubtheme=initialQuery.get("sub");
  if(entryTheme&&themeLabels[entryTheme]){
    rememberTheme(entryTheme);
    send("category_entry_"+entryTheme,{theme:entryTheme,theme_label:themeLabels[entryTheme],subtheme:entrySubtheme||"",entry_source:"direct_link"});
  }

  document.addEventListener("input",function(e){
    if(e.target&&e.target.tagName==="TEXTAREA"){
      try{sessionStorage.setItem("oracle.question",String(e.target.value||"").slice(0,500));}catch(_){}
    }
  },true);
  function addExtendedPreview(){
    const frame=document.querySelector(".device > .scroll > .frame");
    const resultScroll=frame?.parentElement;
    if(!frame||!resultScroll||resultScroll.querySelector(".extended-preview"))return;
    const actionText=Array.from(resultScroll.querySelectorAll(".actions .act span")).map(el=>el.textContent.trim());
    if(actionText.includes("回到首頁"))return;
    const titleNode=frame.querySelector(".brand-cn");
    const subtheme=(titleNode?.querySelector(".faint")?.textContent||"").trim();
    const title=titleNode?Array.from(titleNode.childNodes).filter(node=>node.nodeType===Node.TEXT_NODE).map(node=>node.textContent).join("").trim():"";
    const numberText=(frame.querySelector(".gold-label")?.textContent||"").trim();
    const fortuneNumber=(numberText.match(/\d+/)||[])[0]||"";
    const theme=currentTheme(subtheme);
    const storageKey="extended_reading_interest:"+[fortuneNumber,title,subtheme].join("|");
    const section=document.createElement("section");
    section.className="extended-preview";
    section.setAttribute("aria-label","完整延伸解籤預告");
    // ── 愛情類已經可以購買，其他主題維持預告 ──
    const EXT_SLUG={"失戀中":"breakup","曖昧中":"flirting","關係中":"relationship","單身中":"single","桃花運勢":"fortune"};
    const extSlug=EXT_SLUG[subtheme]||"";
    const extNo=parseInt(fortuneNumber,10);
    const slipId=(theme==="love"&&extSlug&&extNo>0)?("love_"+extSlug+"_"+String(extNo).padStart(3,"0")):"";

    if(slipId){
      section.innerHTML='<div class="extended-preview-kicker">完整解籤 · NT$ 99</div>'
        +'<div class="extended-preview-title">想知道這支籤，如何對應你現在的處境？</div>'
        +'<div class="extended-preview-copy">為這一支籤寫的完整解讀：情境解析、對方或環境的可能反應、後續走向，以及你現在能採取的具體行動。約 1300 字，另附一份 PDF 寄到你信箱。</div>'
        +'<button type="button" class="extended-preview-btn">閱讀完整解籤　NT$ 99</button>';
      const buy=section.querySelector(".extended-preview-btn");
      try{sessionStorage.setItem("oracle.drawnAt",new Date().toISOString());}catch(e){}
      buy.addEventListener("click",function(){
        send("extended_checkout_click",{theme:theme,theme_label:themeLabels[theme]||theme,subtheme:subtheme,
          fortune_number:fortuneNumber,fortune_title:title,slip_id:slipId,button_location:"result_after_fortune"});
        location.href="/checkout/?id="+encodeURIComponent(slipId);
      });
    }else{
      section.innerHTML='<div class="extended-preview-kicker">COMING SOON · 即將開放</div><div class="extended-preview-title">想知道這支籤，如何對應你現在的處境？</div><div class="extended-preview-copy">完整延伸解籤將包含情境解析、對方或環境的可能反應、後續走向，以及你現在能採取的具體行動。</div><button type="button" class="extended-preview-btn">我想看完整延伸解籤</button><div class="extended-preview-thanks" role="status" hidden>已記下你的期待，正式開放時會在這裡出現。</div>';
      const button=section.querySelector(".extended-preview-btn");
      const thanks=section.querySelector(".extended-preview-thanks");
      function showSent(){button.textContent="✓ 已記下，我想看完整解析";button.disabled=true;thanks.hidden=false;}
      if(sessionStorage.getItem(storageKey)==="1")showSent();
      button.addEventListener("click",function(){
        if(sessionStorage.getItem(storageKey)==="1"){showSent();return;}
        sessionStorage.setItem(storageKey,"1");
        const params={theme:theme,theme_label:themeLabels[theme]||theme,subtheme:subtheme,fortune_number:fortuneNumber,fortune_title:title,button_location:"result_after_fortune",interest_version:"preview_v1"};
        send("extended_reading_interest",params);
        if(theme!=="unknown")send("extended_interest_"+theme,params);
        showSent();
      });
    }
    // 付費區插在「具體建議」之後、「分享／再抽一次」之前。
    // 那兩顆是結束動作，使用者看到就認為讀完了 —— 原本放在它們下面，
    // 導致只有 27.5% 的人滑到付費區。移上來後，讀完解籤情緒還在時就會看到。
    const actionsRow=frame.querySelector(".actions");
    if(actionsRow){ actionsRow.insertAdjacentElement("beforebegin",section); }
    else { frame.insertAdjacentElement("afterend",section); }

    // 真人占卜入口原本在這裡再插一個 .talk-band，與下方 React 的
    // .oracle-service-band 重複賣同一個服務（FIX-02）。已移除，
    // 「三位合作占卜師」與「限時優惠價 NT$399」搬進 OracleServiceBand 的 compact 版。

    // 解籤最後一頁：延伸預告下方補一個 LINE 入口
    if(!resultScroll.querySelector(".line-band")){
      const lineBox=document.createElement("section");
      lineBox.className="line-band compact";
      lineBox.setAttribute("aria-label","加入 LINE 抽籤");
      lineBox.innerHTML='<img class="line-band-icon" src="/assets/line/line-icon.png" alt="LINE" loading="lazy">'+
        '<div class="line-band-kicker">LINE OFFICIAL</div>'+
        '<div class="line-band-title">下次想抽籤，在 LINE 裡就好</div>'+
        '<div class="line-band-copy">加入好友後直接在對話中抽籤，不用再開網站。</div>'+

        '<a class="line-band-btn" href="https://line.me/R/ti/p/@017vwhwj?utm_source=web&utm_medium=result_page&utm_campaign=line_add">'+
        '<img src="/assets/line/line-icon.png" alt="" loading="lazy">加入 LINE 好友</a>';
      lineBox.querySelector(".line-band-btn").addEventListener("click",function(){
        send("line_add_click",{theme:theme,theme_label:themeLabels[theme]||theme,subtheme:subtheme,
          fortune_number:fortuneNumber,fortune_title:title,button_location:"result_after_fortune"});
      });
      frame.insertAdjacentElement("afterend",lineBox);
    }
      // 看到解鎖頁（延伸預告出現）→ 送付款漏斗第一層，每支籤每階段只送一次
      try{
        var pvKey="paywall_view:"+[fortuneNumber,title,subtheme].join("|");
        if(window.OracleCommerce&&sessionStorage.getItem(pvKey)!=="1"){
          sessionStorage.setItem(pvKey,"1");
          window.OracleCommerce.viewPaywall({theme:theme,theme_label:themeLabels[theme]||theme,subtheme:subtheme,fortune_number:fortuneNumber,fortune_title:title});
        }
      }catch(e){}
  }
  const observer=new MutationObserver(addExtendedPreview);
  observer.observe(document.getElementById("root"),{childList:true,subtree:true});
  addExtendedPreview();
})();
</script>

<!-- 未完籤所・付款漏斗追蹤模組 已整合 -->
<!-- ===================================================================
  未完籤所・付款漏斗追蹤模組  (GA4 · G-71RMD00WPJ)
  貼在 index.html 的 body 結束前，或現有追蹤區塊後方即可。
  依現有風格：每個動作送「GA4 標準電商事件」＋「分類事件」各一。
  漏斗：view_item(看到解鎖頁) → begin_checkout(點付款) → purchase(付款成功)
==================================================================== -->
<script>
(function () {
  var PRICE = 99;
  var CURRENCY = "TWD";

  // 與站上其他事件共用同一個送出管道
  function fire(name, params) {
    try {
      if (typeof trackOracleEvent === "function") return trackOracleEvent(name, params || {});
      if (typeof window.gtag === "function") return window.gtag("event", name, params || {});
    } catch (e) { console.warn("GA4 commerce event failed", name, e); }
  }

  // ctx = { theme, theme_label, subtheme, fortune_number, fortune_title }
  function item(ctx) {
    return {
      item_id: "extended_" + (ctx.theme || "unknown") + "_" + (ctx.fortune_number || ""),
      item_name: "延伸解籤・" + (ctx.subtheme || ctx.theme || ""),
      item_category: ctx.theme || "unknown",        // ← 用主題當品類，之後可按主題切分收入
      item_category2: ctx.subtheme || "",           // ← 細情境
      price: PRICE,
      quantity: 1
    };
  }
  function base(ctx) {
    return {
      theme: ctx.theme || "",
      theme_label: ctx.theme_label || "",
      subtheme: ctx.subtheme || "",
      fortune_number: ctx.fortune_number || "",
      fortune_title: ctx.fortune_title || ""
    };
  }

  // 1) 看到解鎖頁（付費預覽真正出現在畫面上時呼叫）
  function viewPaywall(ctx) {
    var p = Object.assign(base(ctx), { currency: CURRENCY, value: PRICE, items: [item(ctx)] });
    fire("view_item", p);                                    // GA4 標準：進「營利」報表
    if (ctx.theme) fire("paywall_view_" + ctx.theme, base(ctx)); // 分類版：好切分
  }

  // 2) 點「解鎖 / 付款」按鈕，準備進金流時呼叫
  function beginCheckout(ctx) {
    var p = Object.assign(base(ctx), { currency: CURRENCY, value: PRICE, items: [item(ctx)] });
    fire("begin_checkout", p);                               // GA4 標準
    if (ctx.theme) fire("checkout_" + ctx.theme, base(ctx));
  }

  // 3) 付款成功——★只能在「後端確認 ECPay ReturnURL」之後呼叫，不可在前端跳轉時就送★
  //    transactionId 必填、且要去重（同一筆訂單只送一次），否則收入會灌水。
  function purchase(ctx, transactionId) {
    if (!transactionId) { console.warn("purchase() 需要 transactionId，已略過"); return; }
    var dedupeKey = "oracle_purchased:" + transactionId;
    try { if (sessionStorage.getItem(dedupeKey) === "1") return; } catch (e) {}
    var p = Object.assign(base(ctx), {
      transaction_id: transactionId,
      currency: CURRENCY,
      value: PRICE,
      items: [item(ctx)]
    });
    fire("purchase", p);                                     // GA4 標準：算營收
    if (ctx.theme) fire("purchase_" + ctx.theme, base(ctx)); // 分類版：哪一類的人真的付錢
    try { sessionStorage.setItem(dedupeKey, "1"); } catch (e) {}
  }

  window.OracleCommerce = { viewPaywall: viewPaywall, beginCheckout: beginCheckout, purchase: purchase };
})();
</script>
