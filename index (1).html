<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>未完籤所 · MAGIC ORACLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#0e0a22; --bg-mid:#1a1338; --bg-bot:#271b47;
  --gold:#d9bd82; --gold-soft:#c3a874; --gold-line:rgba(206,176,112,.38);
  --text:#ece4f5; --text-soft:#b6a6cf; --text-faint:#8b7bab;
  --btn-a:#7a67ac; --btn-b:#4c3c7e; --cream:#f2ead8; --cream-text:#4c4160;
  --serif:'Noto Serif TC','Songti TC','Songti SC','SimSun',serif;
  --cinzel:'Cinzel',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--text);
  background:radial-gradient(150% 100% at 50% 0%, var(--bg-bot), var(--bg-mid) 45%, var(--bg-top));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0}
button{font-family:var(--serif);cursor:pointer}
.starfield{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#f4ecd0;box-shadow:0 0 4px #e9d9a8}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spinAura{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes auraPulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes shakeCyl{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-1.6deg)}35%{transform:translateX(7px) rotate(1.6deg)}55%{transform:translateX(-6px) rotate(-1.2deg)}75%{transform:translateX(6px) rotate(1.2deg)}90%{transform:translateX(-3px) rotate(-.6deg)}}
@keyframes stickRise{0%{transform:translateY(200px);opacity:0}22%{opacity:1}100%{transform:translateY(6px);opacity:1}}
@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@keyframes tapRing{0%{transform:translate(-50%,-50%) scale(.85);opacity:.55}100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}

#root{position:relative;z-index:2}

.brand-cn{font-family:var(--serif);color:var(--gold);letter-spacing:.28em;text-shadow:0 0 20px rgba(217,189,130,.45)}
.brand-en{font-family:var(--cinzel);color:var(--gold-soft);letter-spacing:.5em}
.gold-label{color:var(--gold);letter-spacing:.35em;font-size:14px}
.faint{color:var(--text-faint)} .soft{color:var(--text-soft)}

.btn{border:1px solid rgba(217,189,130,.5);border-radius:30px;color:var(--text);font-size:17px;letter-spacing:.15em;padding:15px 40px;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:0 0 22px rgba(122,103,172,.5), inset 0 1px 0 rgba(255,255,255,.15);transition:transform .15s, box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(122,103,172,.75), inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{background:rgba(43,32,74,.55);border-color:var(--gold-line)}

.frame{position:relative;border-radius:18px;border:1px solid var(--gold-line);background:linear-gradient(180deg,rgba(52,38,86,.6),rgba(30,22,58,.6));box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.frame .corner{position:absolute;width:12px;height:12px;border:0 solid var(--gold);opacity:.6}
.corner.tl{top:8px;left:8px;border-top-width:1px;border-left-width:1px}
.corner.tr{top:8px;right:8px;border-top-width:1px;border-right-width:1px}
.corner.bl{bottom:8px;left:8px;border-bottom-width:1px;border-left-width:1px}
.corner.br{bottom:8px;right:8px;border-bottom-width:1px;border-right-width:1px}

.topbar{display:flex;align-items:center;padding:16px 18px 6px;min-height:34px}
.topbar .ttl{flex:1;text-align:center;font-size:17px;letter-spacing:.2em;color:var(--text)}
.iconbtn{background:none;border:none;color:var(--gold);display:flex;padding:4px}

.app{min-height:100vh;display:flex;flex-direction:column}
.device{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:100vh;animation:fade .4s ease}
.scroll{flex:1;overflow-y:auto;padding-bottom:12px}

.nav{display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--gold-line);background:linear-gradient(180deg,rgba(20,14,40,0),rgba(14,10,34,.92));position:relative;z-index:10}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-faint)}
.nav button.on{color:var(--gold)}
.nav .lbl{font-size:10.5px;letter-spacing:.08em}
.nav .center{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(122,103,172,.7);color:var(--text)}

/* HOME */
.home{min-height:100vh;display:flex;flex-direction:column;animation:fade .5s ease}
.home .topbar{width:100%;margin:0 auto}
.home-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;padding:10px 28px 20px;width:100%;margin:0 auto}
.home-brand{display:flex;flex-direction:column;align-items:center}
.home .brand-cn{font-size:64px}
.home .brand-en{font-size:13px;margin-top:10px;letter-spacing:.5em}
.home .tagline{color:var(--text-soft);font-size:17px;line-height:2.2;margin-top:24px}
.home .cta{margin-top:28px}
.home .cta .btn{font-size:18px;padding:16px 48px}

.art{position:relative;height:260px;display:flex;align-items:center;justify-content:center;margin:16px 0 4px}
.cyl-hero{height:100%;object-fit:contain;filter:drop-shadow(0 0 26px rgba(217,189,130,.3));animation:floaty 5s ease-in-out infinite}

@media(min-width:900px){
  .app{justify-content:center;padding:24px}
  .device{min-height:0;max-height:92vh;border:1px solid var(--gold-line);border-radius:30px;overflow:hidden;background:linear-gradient(180deg,rgba(26,19,56,.55),rgba(39,27,71,.55));box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(120,90,170,.15)}
  .home .brand-cn{font-size:72px}
  .home .brand-en{font-size:14px}
  .home .tagline{font-size:18px}
  .art{height:300px}
}

.center-col{padding:14px 26px;text-align:center}
.theme-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;margin-bottom:12px;border-radius:14px;border:1px solid var(--gold-line);background:linear-gradient(180deg,rgba(52,38,86,.5),rgba(30,22,58,.5));transition:transform .15s,border-color .2s}
.theme-card:hover{transform:translateY(-2px);border-color:rgba(217,189,130,.6)}
.theme-ico{width:38px;height:38px;border-radius:50%;flex-shrink:0;border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(20,14,42,.5)}
.theme-name{font-size:16px;letter-spacing:.15em}
.theme-sub{color:var(--text-faint);font-size:11px;margin-top:3px;letter-spacing:.08em}

textarea{width:100%;min-height:88px;resize:none;border-radius:12px;border:1px solid var(--gold-line);background:rgba(20,14,42,.5);color:var(--text);font-family:var(--serif);font-size:14px;padding:14px;outline:none}
textarea::placeholder{color:var(--text-faint)}

/* DRAWING stage */
.draw-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cap{font-size:14px;line-height:2;margin-bottom:2px;min-height:56px;display:flex;align-items:center}
.cyl-stage{position:relative;width:260px;height:340px;margin:6px auto;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.aura{position:absolute;left:50%;top:48%;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle, rgba(217,189,130,.22), transparent 62%);animation:spinAura 20s linear infinite, auraPulse 3.5s ease-in-out infinite;pointer-events:none}
.aura.hot{background:radial-gradient(circle, rgba(255,220,150,.4), transparent 62%);animation:spinAura 6s linear infinite, auraPulse 1.4s ease-in-out infinite}
.cyl-img{height:100%;position:relative;z-index:3;filter:drop-shadow(0 0 22px rgba(217,189,130,.35))}
.cyl-img.floaty{animation:floaty 4s ease-in-out infinite}
.cyl-img.shaking{animation:shakeCyl .55s ease-in-out 3}
.tap-ring{position:absolute;left:50%;top:48%;width:200px;height:200px;border-radius:50%;border:1px solid var(--gold);animation:tapRing 2.1s ease-out infinite;pointer-events:none;z-index:2}
.stick-clip{position:absolute;left:0;right:0;top:-70px;height:calc(36% + 70px);overflow:hidden;z-index:4;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.rising-stick{animation:stickRise 2.0s cubic-bezier(.2,.7,.25,1) .45s both;filter:drop-shadow(0 0 15px rgba(255,222,150,.9))}
.rim-glow{position:absolute;left:50%;top:36%;width:140px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, rgba(255,236,175,.95), transparent);opacity:0;animation:flash 1.6s ease-out .5s forwards;pointer-events:none;z-index:5;filter:blur(2px)}
.flash{position:absolute;left:50%;top:30%;width:210px;height:210px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(255,242,205,.9), transparent 60%);opacity:0;animation:flash 1.1s ease-out 1.7s forwards;pointer-events:none;z-index:6}
.tap-pill{margin-top:10px;font-size:12.5px;letter-spacing:.18em;color:var(--gold-soft)}

.sect-label{color:var(--gold);letter-spacing:.35em;font-size:14px;margin-top:22px}
.actions{display:flex;justify-content:space-around;margin-top:26px;padding-top:18px;border-top:1px solid var(--gold-line)}
.act{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-soft);font-size:11px}
.act.on{color:var(--gold)}
.tip-row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.tip{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--gold-line);color:var(--text-soft);font-size:13px;text-align:center}

.tabs{display:flex;gap:16px;padding:4px 20px 10px;justify-content:center;flex-wrap:wrap}
.tab{background:none;border:none;font-size:13px;color:var(--text-faint);border-bottom:1px solid transparent;padding-bottom:4px}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.ticket{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:12px;border-radius:10px;background:var(--cream);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.ticket .thumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#3a2c5e,#1a1030);display:flex;align-items:center;justify-content:center}
.ticket .num{color:#8a7a5c;font-size:10.5px}
.ticket .name{color:var(--cream-text);font-size:16px;letter-spacing:.06em;margin-top:1px}
.ticket .thm{color:#a89a80;font-size:10.5px;margin-top:3px}
.empty{text-align:center;margin-top:70px;color:var(--text-faint);font-size:13.5px;line-height:2}

.modal{position:fixed;inset:0;background:rgba(6,4,16,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px;animation:fade .25s ease}
.share-card{width:100%;max-width:320px;position:relative}
.share-close{position:absolute;top:-36px;right:0;background:none;border:none;color:var(--text-soft)}
.qr{width:48px;height:48px;border-radius:6px;background:repeating-conic-gradient(#1a1030 0 25%, #f0e8d8 0 50%) 50%/8px 8px}

.logo-img{display:block;max-width:min(560px,88vw);width:100%;height:auto;margin:0 auto 8px;filter:drop-shadow(0 0 18px rgba(217,189,130,.35));}
@media(min-width:900px){.logo-img{max-width:640px;margin-left:0}}

.home .brand-cn,.home .brand-en{display:none}

/* ── 側邊選單 ── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;opacity:0;pointer-events:none;transition:opacity .28s}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;height:100%;width:272px;background:linear-gradient(180deg,rgba(22,15,48,.98),rgba(14,10,34,.98));border-right:1px solid var(--gold-line);z-index:101;transform:translateX(-100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:28px 22px 18px;border-bottom:1px solid var(--gold-line)}
.sidebar-logo{color:var(--gold);font-size:20px;letter-spacing:.28em;text-shadow:0 0 16px rgba(217,189,130,.4)}
.sidebar-en{font-family:var(--cinzel);font-size:9px;letter-spacing:.5em;color:var(--text-faint);margin-top:4px}
.sidebar-nav{flex:1;padding:14px 0}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:15px 24px;color:var(--text-soft);font-size:15px;letter-spacing:.1em;background:none;border:none;width:100%;text-align:left;cursor:pointer;transition:color .15s,background .15s;font-family:var(--serif)}
.sidebar-item:hover{color:var(--gold);background:rgba(217,189,130,.06)}
.sidebar-item.active{color:var(--gold)}
.sidebar-item-icon{opacity:.7;display:flex;align-items:center}
.sidebar-divider{height:1px;background:var(--gold-line);margin:8px 24px}
.sidebar-footer{padding:18px 24px;color:var(--text-faint);font-size:11px;letter-spacing:.1em;border-top:1px solid var(--gold-line)}

/* ── 斗內頁面 ── */
.donate-page{display:flex;flex-direction:column;min-height:100vh;animation:fade .5s ease}
.donate-scroll{flex:1;overflow-y:auto;padding:10px 22px 30px}
.donate-hero{text-align:center;padding:30px 0 20px}
.donate-star{font-size:32px;display:block;margin-bottom:10px}
.donate-page-title{color:var(--gold);font-size:20px;letter-spacing:.28em;text-shadow:0 0 16px rgba(217,189,130,.4);margin-bottom:6px}
.donate-page-sub{color:var(--text-faint);font-size:11px;letter-spacing:.2em;font-family:var(--cinzel)}
.donate-msg-box{border:1px solid var(--gold-line);border-radius:16px;background:linear-gradient(160deg,rgba(34,26,69,.6),rgba(18,12,38,.6));padding:24px 22px;margin:18px 0;color:var(--text-soft);font-size:14px;line-height:2.3;letter-spacing:.06em;text-align:center}
.donate-page-btn{display:block;width:100%;padding:15px 0;border-radius:12px;background:linear-gradient(135deg,#e06452,#d4486e);border:none;color:#fff;font-size:16px;font-family:var(--serif);letter-spacing:.2em;cursor:pointer;box-shadow:0 0 24px rgba(208,80,100,.4);transition:box-shadow .2s,transform .15s;margin-top:8px}
.donate-page-btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(208,80,100,.6)}
.donate-note{text-align:center;color:var(--text-faint);font-size:11.5px;letter-spacing:.1em;margin-top:14px;line-height:2}
</style>

<style>
/* User-selected magical background */
body{
  background-image:
    linear-gradient(rgba(7,4,24,.12), rgba(7,4,24,.28)),
    url("assets/embedded-e835126a3265.png") !important;

  ) !important;

<style>

  min-height: 100%;
}
body {
  background-image:
    linear-gradient(rgba(7,4,24,.10), rgba(7,4,24,.24)),
    url("assets/embedded-e835126a3265.png") !important;

}

<style>
/* Crystal-ball magical animation */
.crystal-magic-wrap{
  position:relative;
  width:250px;
  height:250px;
  margin:0 auto 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
  overflow:visible;
}

.crystal-ball-animated{
  position:relative;
  z-index:6;
  width:190px;
  height:190px;
  object-fit:contain;
  display:block;
  animation:crystalFloat 4.2s ease-in-out infinite;
  filter:
    drop-shadow(0 0 14px rgba(255,216,148,.46))
    drop-shadow(0 0 28px rgba(196,103,255,.48))
    drop-shadow(0 0 48px rgba(245,72,220,.20));
  transform-origin:50% 62%;
}

.crystal-magic-wrap::before{
  content:"";
  position:absolute;
  z-index:1;
  left:50%;
  top:53%;
  width:190px;
  height:190px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(255,221,162,.22) 0 12%,
      rgba(194,105,255,.18) 34%,
      rgba(244,75,213,.10) 54%,
      transparent 72%);
  filter:blur(8px);
  animation:auraBreath 3.6s ease-in-out infinite;
}

.orbit-glow{
  position:absolute;
  z-index:3;
  left:50%;
  top:52%;
  width:215px;
  height:72px;
  transform:translate(-50%,-50%) rotate(-14deg);
  border:1px solid rgba(233,191,113,.32);
  border-radius:50%;
  box-shadow:
    0 0 12px rgba(226,178,102,.28),
    inset 0 0 10px rgba(208,125,255,.15);
  animation:orbitTilt 9s linear infinite;
}

.mist{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  border-radius:50%;
  pointer-events:none;
  mix-blend-mode:screen;
  filter:blur(16px);
  opacity:.7;
  transform-origin:center;
}

.mist::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    radial-gradient(circle at 25% 50%, rgba(239,148,255,.72), transparent 34%),
    radial-gradient(circle at 66% 28%, rgba(146,112,255,.58), transparent 30%),
    radial-gradient(circle at 75% 70%, rgba(255,102,220,.54), transparent 32%),
    radial-gradient(circle at 40% 80%, rgba(111,129,255,.35), transparent 28%);
}

.mist-a{
  width:255px;
  height:112px;
  margin-left:-128px;
  margin-top:-54px;
  animation:mistOrbitA 8.5s ease-in-out infinite;
}
.mist-b{
  width:230px;
  height:96px;
  margin-left:-115px;
  margin-top:-48px;
  opacity:.48;
  filter:blur(20px);
  animation:mistOrbitB 11s ease-in-out infinite reverse;
}
.mist-c{
  width:185px;
  height:72px;
  margin-left:-92px;
  margin-top:-30px;
  opacity:.36;
  filter:blur(22px);
  animation:mistPulse 5.6s ease-in-out infinite;
}

.spark-orbit{
  position:absolute;
  z-index:7;
  color:#f2d49c;
  text-shadow:
    0 0 7px rgba(255,230,174,.95),
    0 0 16px rgba(220,123,255,.62);
  pointer-events:none;
}
.spark-1{left:18px;top:76px;font-size:17px;animation:sparkBlink 2.1s ease-in-out infinite;}
.spark-2{right:17px;top:112px;font-size:14px;animation:sparkBlink 2.8s ease-in-out .7s infinite;}
.spark-3{right:52px;top:24px;font-size:11px;animation:sparkBlink 2.4s ease-in-out 1.2s infinite;}

.crystal-title{
  font-size:21px;
  line-height:1.8;
  margin-top:5px;
  color:var(--gold);
  letter-spacing:.10em;
  text-shadow:
    0 0 12px rgba(217,189,130,.28),
    0 0 24px rgba(159,97,215,.18);
}

.crystal-subtitle{
  margin-top:10px;
  font-size:13px;
  line-height:1.8;
  color:var(--text-soft);
}

@keyframes crystalFloat{
  0%,100%{
    transform:translateY(3px) scale(1);
  }
  48%{
    transform:translateY(-12px) scale(1.015);
  }

訊息試探，若你沒有積極回應，會迅速退回沉默。","fw":"若你們分開的核心原因沒有被處理，即使重新聯絡，很可能走到相同的終點。","sa":"如果一週內對方完全沒有任何訊號，就把等待的精力換成一件讓自己舒服的事。"},{"n":5,"t":"風向轉了","sub":"失戀中","yu":"風沒有背叛誰，它只是開始吹往新的方向。","jie":"「風向轉了」落在失戀中這個問題上，重點是：如果你感覺一段關係正在改變，不必立刻把改變解讀成自己的不足。有時兩個人的需求、步調與方向真的會不同。真正值得確認的是：現在的關係，還有沒有雙方共同前進的意願。 這一籤不主張追著答案跑。若對方沒有新的行動，先把沉默視為現況，而不是承諾；復合要看改變，不看想念。 給你的行動提示是：今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","adv":"今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","st":"正在讓自己相信分開是對的，但遇到某些歌或場景，防線還是會垮一下。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"若你下一步什麼都不做，對方也不主動，關係會自然淡化，這也是一種答案。","sa":"你能控制的只有自己的行動；先把對方的反應放下，問自己現在最需要什麼。"},{"n":6,"t":"燈還亮著","sub":"失戀中","yu":"遠處的燈仍亮著，但你不必整夜站在窗前等它為你閃爍。","jie":"若把「燈還亮著」放進你現在的失戀中處境，籤意會更直接：你心裡可能還留著希望。希望本身沒有錯，但若它讓你無法生活，就需要重新放回適當的位置。這支籤提醒你，可以保留可能性，同時繼續過自己的日子。 這段緣分仍有未說完的部分，但「未完」不等於一定重來。適合留一點空間，讓下一次聯繫由真實意願發生。 今天可以先做一件很具體的事：替等待設一個界線：今天有哪些時間，只屬於你自己？","adv":"替等待設一個界線：今天有哪些時間，只屬於你自己？","st":"還保留著你們的聊天記錄、照片，或留著某件東西，只是沒讓你知道。","rx":"透過共同朋友側面打聽你的狀況，或在社群上用小號、匿名方式偷看。","fw":"短期內若有聯繫，容易受情緒驅使而回到舊模式；建議先等一方有具體的改變再推進。","sa":"先記錄「你們分開後對方做了什麼」而不是猜；行動才是真正的答案。"},{"n":7,"t":"兩岸之間","sub":"失戀中","yu":"河流沒有問哪一岸更重要，只是不斷提醒彼此：靠近需要有人渡河。","jie":"你問的是失戀中，而「兩岸之間」先指出一件事：關係不能只靠一個人維持。你也許已經做了很多努力，現在適合看看另一方是否也願意跨出距離。愛不是計較誰付出更多，而是長期是否存在雙向靠近。 籤意偏向先止住反覆拉扯。現在重新靠近，容易把寂寞誤認成和好；等情緒退潮後，再判斷彼此是否真的適合。 若想讓局勢開始改變，先從這一步做起：列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","adv":"列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","st":"心裡對你還有感覺，但覺得如果先聯絡，會被當成軟弱或沒原則。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"這段分手比較像是暫停，而不是結束，但暫停能不能變成重來，需要雙方都有改變。","sa":"先問自己：如果對方今天回來，你們不一樣的地方是什麼？還是什麼都沒變？"},{"n":8,"t":"雲後有月","sub":"失戀中","yu":"你看不見月亮時，它沒有因此消失；但你也不必把每一片雲，都想像成月光。","jie":"在失戀中的脈絡裡，「雲後有月」不是抽象的安慰。目前的訊號可能很模糊。這支籤提醒你保留希望，也保留判斷。不要因為想得到某個答案，就替所有曖昧的細節加上你期待的意義。 這支籤比較像一個轉折：舊的相處方式已經走不下去。若還有第二次機會，也必須以新的界線與溝通開始。 比起繼續猜，這支籤更希望你實際做的是：今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","adv":"今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","st":"後悔的程度可能比你知道的多，但自尊讓他／她不打算主動開口。","rx":"透過共同朋友側面打聽你的狀況，或在社群上用小號、匿名方式偷看。","fw":"若三到六週內沒有對方主動的跡象，建議把注意力先拉回自己身上；時間差距太大，等待成本很高。","sa":"給自己一個時間界線：幾週後還沒訊號，就往前走；有了界線，等待才不會無止境。"},{"n":9,"t":"回聲","sub":"失戀中","yu":"你喊向山谷的話會回來，但回聲終究不是另一個人的回答。","jie":"這次以失戀中來讀「回聲」：你可能在自己的想像中反覆重播對方的言行。這支籤提醒你，內心推演再多次，都不能取代真實溝通。若一件事對你真的重要，適當的時候需要讓問題走到現實裡。 若你問「他會不會回來」，答案不是單純的是或否；真正的關鍵是回來的人，是否願意處理當初離開的原因。 把答案帶回現實的方法是：挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","adv":"挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","st":"心裡對你還有感覺，但覺得如果先聯絡，會被當成軟弱或沒原則。","rx":"可能在某個紀念日或你們共同喜歡的日子，忽然發來不痛不癢的一句話。","fw":"你們的關係結束的方式，會影響未來重新開始的難度；若傷口太新，先讓它癒合。","sa":"把這段時間拿來完成一件你一直想做但對方不支持的事，不是為了報復，是為了自己。"},{"n":10,"t":"鬆開掌心","sub":"失戀中","yu":"掌心鬆開，不一定是失去；有時只是終於能看清，留下的是什麼。","jie":"「鬆開掌心」落在失戀中這個問題上，重點是：你也許很害怕一旦停止努力，關係就會消失。但真正有生命力的關係，不應完全依靠你的緊抓。稍微放鬆控制，可以讓你更清楚看見對方真正的選擇。 這一籤不主張追著答案跑。若對方沒有新的行動，先把沉默視為現況，而不是承諾；復合要看改變，不看想念。 給你的行動提示是：今天少做一件為了確認對方心意而做的事。","adv":"今天少做一件為了確認對方心意而做的事。","st":"可能仍時常查看你的動態，卻刻意不留痕跡，維持距離又割捨不下。","rx":"遇到任何和你們有關的事物，都下意識想到你，但不一定會說出口。","fw":"對方在意你的可能性仍然存在，但主動的時機取決於他們自己準備好了沒有。","sa":"不要從訊息語氣判斷感情，改從「他主動找你的頻率」計算；次數說的比語氣真。"},{"n":11,"t":"春信","sub":"失戀中","yu":"春天從不敲鑼打鼓，它只是讓枝頭某一天忽然有了新芽。","jie":"若把「春信」放進你現在的失戀中處境，籤意會更直接：新的關係或新的可能性，未必以戲劇性的方式出現。這支籤提醒你，不要只等待強烈的心動，也留意那些讓你感到安心、自然與被尊重的互動。 這段緣分仍有未說完的部分，但「未完」不等於一定重來。適合留一點空間，讓下一次聯繫由真實意願發生。 今天可以先做一件很具體的事：今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","adv":"今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","st":"還保留著你們的聊天記錄、照片，或留著某件東西，只是沒讓你知道。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"不要從訊息語氣判斷感情，改從「他主動找你的頻率」計算；次數說的比語氣真。"},{"n":12,"t":"舊夢醒時","sub":"失戀中","yu":"夢醒不是否定夢境，而是提醒你，天已經亮了。","jie":"你問的是失戀中，而「舊夢醒時」先指出一件事：有些回憶之所以難放下，是因為它曾經真的很好。這支籤允許你珍惜過去，同時提醒你不要讓過去成為衡量所有未來的唯一標準。 籤意偏向先止住反覆拉扯。現在重新靠近，容易把寂寞誤認成和好；等情緒退潮後，再判斷彼此是否真的適合。 若想讓局勢開始改變，先從這一步做起：收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","adv":"收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","st":"後悔的程度可能比你知道的多，但自尊讓他／她不打算主動開口。","rx":"看到你的笑容或你過得好的跡象，可能是他／她最難受的時刻之一。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"你能控制的只有自己的行動；先把對方的反應放下，問自己現在最需要什麼。"},{"n":13,"t":"心有歸處","sub":"失戀中","yu":"真正的歸處，不是讓你不停猜測自己能不能留下。","jie":"在失戀中的脈絡裡，「心有歸處」不是抽象的安慰。你正在尋找安全感。這支籤提醒你，關係中的安全感除了來自自己，也應該來自對方清楚、一致且尊重的回應。若你長期處於不確定，值得認真看待這份感受。 這支籤比較像一個轉折：舊的相處方式已經走不下去。若還有第二次機會，也必須以新的界線與溝通開始。 比起繼續猜，這支籤更希望你實際做的是：寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","adv":"寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","st":"可能仍時常查看你的動態，卻刻意不留痕跡，維持距離又割捨不下。","rx":"遇到任何和你們有關的事物，都下意識想到你，但不一定會說出口。","fw":"復合的可能性和雙方的成長速度有關；現在的距離是在確認誰改變了多少。","sa":"在決定要不要聯絡之前，先把你真正想要的結果寫下來，不要為了緩解焦慮而行動。"},{"n":51,"t":"晨霧散去","sub":"失戀中","yu":"晨霧會散，不是因為你追趕它，而是太陽終究升起。","jie":"若把「晨霧散去」放進你現在的失戀中處境，籤意會更直接：有些關係的真相需要時間，而不是更多試探。你現在可能很想立刻知道答案，但過度追問只會讓自己更疲憊。讓互動自然累積，你會更容易看見對方真正的態度。 這段緣分仍有未說完的部分，但「未完」不等於一定重來。適合留一點空間，讓下一次聯繫由真實意願發生。 今天可以先做一件很具體的事：今天不測試、不暗示，單純觀察一次對方自然的回應。","adv":"今天不測試、不暗示，單純觀察一次對方自然的回應。","st":"正在讓自己相信分開是對的，但遇到某些歌或場景，防線還是會垮一下。","rx":"可能會在你發了某個動態後，幾分鐘內就看，卻沒有任何回應。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"先記錄「你們分開後對方做了什麼」而不是猜；行動才是真正的答案。"},{"n":52,"t":"未寄的信","sub":"失戀中","yu":"有些話寫下來，是為了讓自己聽見，不一定非得送到誰手裡。","jie":"你問的是失戀中，而「未寄的信」先指出一件事：你心裡可能堆著很多想說的話。表達很重要，但不是每一份情緒都必須立刻交給對方承接。先理解自己真正想被看見的是什麼，再決定是否開口。 籤意偏向先止住反覆拉扯。現在重新靠近，容易把寂寞誤認成和好；等情緒退潮後，再判斷彼此是否真的適合。 若想讓局勢開始改變，先從這一步做起：寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","adv":"寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","st":"可能正在嘗試新的社交，想讓自己顯得過得很好，也希望你看見。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"不要從訊息語氣判斷感情，改從「他主動找你的頻率」計算；次數說的比語氣真。"},{"n":53,"t":"並肩的路","sub":"失戀中","yu":"真正同行的人，不只在終點等你，也願意調整腳步與你並肩。","jie":"在失戀中的脈絡裡，「並肩的路」不是抽象的安慰。你也許正在判斷一段關係是否值得繼續。比起甜言蜜語，更值得觀察的是雙方能否協調生活、處理差異，並在不舒服時仍願意溝通。 這支籤比較像一個轉折：舊的相處方式已經走不下去。若還有第二次機會，也必須以新的界線與溝通開始。 比起繼續猜，這支籤更希望你實際做的是：回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","adv":"回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","st":"對共同朋友打聽你的近況，但叮嚀對方不要讓你知道是他／她問的。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"對方目前的沉默更可能是在整理情緒，而不是已完全切斷；但這不代表一定會回來。","sa":"聯絡之前，先確認那是你真的想要，還是只是怕孤單；動機不同，結果也不同。"},{"n":54,"t":"蝶停掌心","sub":"失戀中","yu":"蝴蝶願意停留時，不需要用手把它困住。","jie":"這次以失戀中來讀「蝶停掌心」：喜歡容易帶來佔有與不安，但親密不是控制。這支籤提醒你，好的關係應該讓兩個人都有呼吸的空間。能自由留下的，比被勉強留下的更有意義。 若你問「他會不會回來」，答案不是單純的是或否；真正的關鍵是回來的人，是否願意處理當初離開的原因。 把答案帶回現實的方法是：今天給彼此一點空間，把注意力放回自己的生活。","adv":"今天給彼此一點空間，把注意力放回自己的生活。","st":"對你的新動態敏感，看到你開心有混雜感受：既希望你好，又有一絲吃味。","rx":"可能在深夜特別想聯絡你，但最終打開又關上對話框，什麼都沒發。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"如果一週內對方完全沒有任何訊號，就把等待的精力換成一件讓自己舒服的事。"},{"n":55,"t":"雨中共傘","sub":"失戀中","yu":"一把傘不必遮住整場雨，只要兩個人都願意往中間靠。","jie":"「雨中共傘」落在失戀中這個問題上，重點是：關係遇到困難並不可怕，重要的是雙方是否願意一起承擔。你不需要一個永遠不出問題的人，而是一個問題出現時仍願意和你站在同一邊的人。 這一籤不主張追著答案跑。若對方沒有新的行動，先把沉默視為現況，而不是承諾；復合要看改變，不看想念。 給你的行動提示是：想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","adv":"想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","st":"後悔的程度可能比你知道的多，但自尊讓他／她不打算主動開口。","rx":"遇到任何和你們有關的事物，都下意識想到你，但不一定會說出口。","fw":"對方在意你的可能性仍然存在，但主動的時機取決於他們自己準備好了沒有。","sa":"若你準備好聯絡，第一句話不要是解釋或道歉，而是問一件具體的事，看對方怎麼回應。"},{"n":56,"t":"紅線鬆結","sub":"失戀中","yu":"緣分不是繩索；真正相連的兩端，不需要勒痛彼此。","jie":"若把「紅線鬆結」放進你現在的失戀中處境，籤意會更直接：你可能把堅持視為深情，但如果一段關係長期讓你縮小自己、害怕表達或反覆受傷，就值得重新檢視。愛可以需要磨合，卻不應以失去自己為代價。 這段緣分仍有未說完的部分，但「未完」不等於一定重來。適合留一點空間，讓下一次聯繫由真實意願發生。 今天可以先做一件很具體的事：寫下一個你不願再為任何關係犧牲的界線。","adv":"寫下一個你不願再為任何關係犧牲的界線。","st":"可能仍時常查看你的動態，卻刻意不留痕跡，維持距離又割捨不下。","rx":"看到你的笑容或你過得好的跡象，可能是他／她最難受的時刻之一。","fw":"外部壓力（家人、工作、朋友）曾在你們的關係中扮演角色，這些變數現在仍在。","sa":"先記錄「你們分開後對方做了什麼」而不是猜；行動才是真正的答案。"},{"n":57,"t":"月下來客","sub":"失戀中","yu":"有人走進你的夜色，不一定為了帶走孤單，也可能只是提醒你仍能心動。","jie":"你問的是失戀中，而「月下來客」先指出一件事：新的相遇正在提醒你：你仍有感受、靠近與被理解的能力。不必急著判斷這是不是命定關係，先允許一段互動保持輕盈。 籤意偏向先止住反覆拉扯。現在重新靠近，容易把寂寞誤認成和好；等情緒退潮後，再判斷彼此是否真的適合。 若想讓局勢開始改變，先從這一步做起：今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","adv":"今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","st":"正在用忙碌填滿時間，但空下來時第一個想的還是與你有關的事。","rx":"在你狀態明顯低落的時候，可能忍不住傳訊息問你還好不好。","fw":"你們的關係結束的方式，會影響未來重新開始的難度；若傷口太新，先讓它癒合。","sa":"先問自己：如果對方今天回來，你們不一樣的地方是什麼？還是什麼都沒變？"},{"n":58,"t":"潮汐相認","sub":"失戀中","yu":"海岸不追逐潮水，潮水也知道何時回來。","jie":"在失戀中的脈絡裡，「潮汐相認」不是抽象的安慰。穩定的關係不需要靠不停確認維持。如果一個人只有在你追趕時才靠近，你需要看的不是自己還能多努力，而是這份互動本身是否平衡。 這支籤比較像一個轉折：舊的相處方式已經走不下去。若還有第二次機會，也必須以新的界線與溝通開始。 比起繼續猜，這支籤更希望你實際做的是：今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","adv":"今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","st":"對方可能已把你屏蔽或靜音，不是因為不在乎，而是太在乎才需要隔絕。","rx":"可能會在你發了某個動態後，幾分鐘內就看，卻沒有任何回應。","fw":"對方目前的沉默更可能是在整理情緒，而不是已完全切斷；但這不代表一定會回來。","sa":"在決定要不要聯絡之前，先把你真正想要的結果寫下來，不要為了緩解焦慮而行動。"},{"n":59,"t":"鏡中花","sub":"失戀中","yu":"你愛上的若只是想像，再美的花也無法真正被觸碰。","jie":"這次以失戀中來讀「鏡中花」：你可能把期待、潛力或過去的美好投射在一個人身上。這支籤提醒你，把「他可能成為誰」與「他現在是誰」分開，會更接近真實。 若你問「他會不會回來」，答案不是單純的是或否；真正的關鍵是回來的人，是否願意處理當初離開的原因。 把答案帶回現實的方法是：列出對方現在實際具備的三個特質，不寫「也許以後」。","adv":"列出對方現在實際具備的三個特質，不寫「也許以後」。","st":"正在讓自己相信分開是對的，但遇到某些歌或場景，防線還是會垮一下。","rx":"可能會在你發了某個動態後，幾分鐘內就看，卻沒有任何回應。","fw":"若你們分開的核心原因沒有被處理，即使重新聯絡，很可能走到相同的終點。","sa":"如果一週內對方完全沒有任何訊號，就把等待的精力換成一件讓自己舒服的事。"},{"n":60,"t":"暖燈","sub":"失戀中","yu":"真正的靠近，不一定耀眼；有時只是你回頭時，那盞燈一直都在。","jie":"「暖燈」落在失戀中這個問題上，重點是：你可能習慣被強烈情緒吸引，卻忽略穩定的善意。長久關係往往藏在一致、可靠與願意回應的細節裡。平靜不一定代表無聊，也可能代表安全。 這一籤不主張追著答案跑。若對方沒有新的行動，先把沉默視為現況，而不是承諾；復合要看改變，不看想念。 給你的行動提示是：留意今天誰用一個小行動讓你感到被照顧。","adv":"留意今天誰用一個小行動讓你感到被照顧。","st":"正在讓自己相信分開是對的，但遇到某些歌或場景，防線還是會垮一下。","rx":"看到你的笑容或你過得好的跡象，可能是他／她最難受的時刻之一。","fw":"對方目前的沉默更可能是在整理情緒，而不是已完全切斷；但這不代表一定會回來。","sa":"先問自己：如果對方今天回來，你們不一樣的地方是什麼？還是什麼都沒變？"},{"n":61,"t":"花開兩處","sub":"失戀中","yu":"兩朵花可以彼此喜歡，也仍需要各自的土壤與陽光。","jie":"若把「花開兩處」放進你現在的失戀中處境，籤意會更直接：親密並不要求兩個人變成同一個人。保有朋友、興趣、目標與獨處空間，反而能讓關係更有生命力。這支籤提醒你，不要把全部的自己交給一段關係定義。 這段緣分仍有未說完的部分，但「未完」不等於一定重來。適合留一點空間，讓下一次聯繫由真實意願發生。 今天可以先做一件很具體的事：今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","adv":"今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","st":"可能正在嘗試新的社交，想讓自己顯得過得很好，也希望你看見。","rx":"可能在深夜特別想聯絡你，但最終打開又關上對話框，什麼都沒發。","fw":"對方在意你的可能性仍然存在，但主動的時機取決於他們自己準備好了沒有。","sa":"先記錄「你們分開後對方做了什麼」而不是猜；行動才是真正的答案。"},{"n":62,"t":"星光有期","sub":"失戀中","yu":"不是所有錯過都叫遺憾，有些只是彼此抵達的時間不同。","jie":"你問的是失戀中，而「星光有期」先指出一件事：你可能在想「如果早一點、晚一點會不會不同」。但關係除了感情，也需要時機與現實條件。接受當下的限制，不代表否定曾經的心意。 籤意偏向先止住反覆拉扯。現在重新靠近，容易把寂寞誤認成和好；等情緒退潮後，再判斷彼此是否真的適合。 若想讓局勢開始改變，先從這一步做起：把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","adv":"把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","st":"對共同朋友打聽你的近況，但叮嚀對方不要讓你知道是他／她問的。","rx":"可能在某個下午，突然把你當時送的東西放回桌上，然後又移走。","fw":"對方在意你的可能性仍然存在，但主動的時機取決於他們自己準備好了沒有。","sa":"若你準備好聯絡，第一句話不要是解釋或道歉，而是問一件具體的事，看對方怎麼回應。"},{"n":1,"t":"月影未央","sub":"曖昧中","yu":"月還未落，故事也還沒有走到最後；只是今夜的你，不必替明天先寫結局。","jie":"你問的是曖昧中，而「月影未央」先指出一件事：你可能正因一段關係尚未明朗而反覆猜測。這支籤提醒你，未知並不等於失去，也不代表一定會得到。比起急著確認對方的答案，更重要的是先確認自己是否在這段等待裡被好好對待。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","adv":"今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","st":"反覆確認你對他／她的行為有沒有不同，藉此判斷自己是否被特別對待。","rx":"對你說的話有更強的記憶，隔很久之後冒出來說「你之前說過⋯⋯」。","fw":"這段關係正在走向一個轉折點，接下來一兩次的互動品質，會決定走向哪一邊。","sa":"下一次對話結束時，你是先說再見，還是對方先說？觀察這個小細節兩三次。"},{"n":2,"t":"花未眠","sub":"曖昧中","yu":"有些花不是不開，只是你守得太久，忘了自己的季節也正在經過。","jie":"在曖昧中的脈絡裡，「花未眠」不是抽象的安慰。等待一個人久了，很容易把希望變成生活的中心。這支籤不是催你離開，而是提醒你：喜歡一個人的同時，也別讓自己的時間停止。真正適合你的關係，不會只剩等待。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：今天安排一件完全與對方無關、但會讓你開心的小事。","adv":"今天安排一件完全與對方無關、但會讓你開心的小事。","st":"在等你先給出一個更明確的訊號，自己的感覺已佔七分，差的是你的那三分。","rx":"主動傳訊息，但內容刻意保持輕鬆，不讓自己看起來太積極。","fw":"有升溫跡象，但若其中一方開始在感情或事業上有壓力，另一方很容易被暫時擱置。","sa":"給自己設一個觀察期限（例如三週），超過了就主動一次；不然可能會等很久。"},{"n":3,"t":"潮聲未止","sub":"曖昧中","yu":"潮水來去都有時候，心意也是；握得太緊，反而聽不見真正的聲音。","jie":"這次以曖昧中來讀「潮聲未止」：你可能正在試圖從訊息、語氣或細節裡找答案。這支籤提醒你，關係裡有些變化需要時間顯現。與其不斷解讀，不如觀察對方是否有穩定而實際的行動。 這支籤的曖昧訊號偏向「有感覺，但尚未定形」。可以靠近一步，不必一次攤牌；看對方是否也會主動補上另一半距離。 今天可以先做一件很具體的事：今天少做一次猜測，多記錄一次事實：他實際做了什麼？","adv":"今天少做一次猜測，多記錄一次事實：他實際做了什麼？","st":"正在觀察你對他人的邊界在哪，確認如果主動會不會是一個錯誤。","rx":"會幫你記住你說過但沒放在心上的事，在適當時機提出來，讓你覺得被在乎。","fw":"對方對你的印象在正向累積，但還在確認「你也有感覺」這件事。","sa":"下次見面時，找一個只有兩個人知道的小事，看看對方的反應；這比分析訊息更準。"},{"n":4,"t":"星落於你","sub":"曖昧中","yu":"有些相遇，是宇宙借來的一束光；它照亮過你，就已經留下意義。","jie":"「星落於你」落在曖昧中這個問題上，重點是：不是每段重要的關係都一定要以永遠作為證明。這支籤提醒你，把一段關係的價值與它最後是否留下分開來看。你曾經感受到的真實，不會因為結果改變而完全消失。 目前最值得看的不是聊天熱度，而是穩定度。若他只在方便時出現，這份心動還不足以支撐一段真正的關係。 若想讓局勢開始改變，先從這一步做起：寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","adv":"寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","st":"正在觀察你對他人的邊界在哪，確認如果主動會不會是一個錯誤。","rx":"會對你說的笑話給出真實的笑，而不是客套式的「哈哈」。","fw":"這段關係正在走向一個轉折點，接下來一兩次的互動品質，會決定走向哪一邊。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":5,"t":"風向轉了","sub":"曖昧中","yu":"風沒有背叛誰，它只是開始吹往新的方向。","jie":"若把「風向轉了」放進你現在的曖昧中處境，籤意會更直接：如果你感覺一段關係正在改變，不必立刻把改變解讀成自己的不足。有時兩個人的需求、步調與方向真的會不同。真正值得確認的是：現在的關係，還有沒有雙方共同前進的意願。 籤意鼓勵一次小而清楚的試探。給出邀約、表達好感或提出下一步，然後把答案交給對方的行動。 比起繼續猜，這支籤更希望你實際做的是：今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","adv":"今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","st":"已把你放進「如果要在一起的人」名單，但還沒決定要不要推進。","rx":"在群體中時常往你的方向看，但你直視時會先轉移目光。","fw":"有升溫跡象，但若其中一方開始在感情或事業上有壓力，另一方很容易被暫時擱置。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":6,"t":"燈還亮著","sub":"曖昧中","yu":"遠處的燈仍亮著，但你不必整夜站在窗前等它為你閃爍。","jie":"你問的是曖昧中，而「燈還亮著」先指出一件事：你心裡可能還留著希望。希望本身沒有錯，但若它讓你無法生活，就需要重新放回適當的位置。這支籤提醒你，可以保留可能性，同時繼續過自己的日子。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：替等待設一個界線：今天有哪些時間，只屬於你自己？","adv":"替等待設一個界線：今天有哪些時間，只屬於你自己？","st":"喜歡你的感覺在增加，但同時也在評估這段關係是否現實層面走得下去。","rx":"主動傳訊息，但內容刻意保持輕鬆，不讓自己看起來太積極。","fw":"外部因素（忙碌、朋友圈、過去的感情）正在影響對方的節奏，不完全是你的問題。","sa":"給自己設一個觀察期限（例如三週），超過了就主動一次；不然可能會等很久。"},{"n":7,"t":"兩岸之間","sub":"曖昧中","yu":"河流沒有問哪一岸更重要，只是不斷提醒彼此：靠近需要有人渡河。","jie":"在曖昧中的脈絡裡，「兩岸之間」不是抽象的安慰。關係不能只靠一個人維持。你也許已經做了很多努力，現在適合看看另一方是否也願意跨出距離。愛不是計較誰付出更多，而是長期是否存在雙向靠近。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","adv":"列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","st":"比較在乎你對他／她的評價，甚至會在對話之後反覆回想你說的話是什麼意思。","rx":"主動傳訊息，但內容刻意保持輕鬆，不讓自己看起來太積極。","fw":"若能找一個自然的機會單獨相處，比持續在線上曖昧更有效。","sa":"不需要表白，但可以製造一次「有點特別」的共同記憶；回憶是曖昧最好的推進劑。"},{"n":8,"t":"雲後有月","sub":"曖昧中","yu":"你看不見月亮時，它沒有因此消失；但你也不必把每一片雲，都想像成月光。","jie":"這次以曖昧中來讀「雲後有月」：目前的訊號可能很模糊。這支籤提醒你保留希望，也保留判斷。不要因為想得到某個答案，就替所有曖昧的細節加上你期待的意義。 這支籤的曖昧訊號偏向「有感覺，但尚未定形」。可以靠近一步，不必一次攤牌；看對方是否也會主動補上另一半距離。 今天可以先做一件很具體的事：今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","adv":"今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","st":"可能正在喜歡又不確定，試著透過小事測試你的反應，卻不敢先跨出那一步。","rx":"試圖確認你是否單身，但透過第三方或迂迴方式，而不是直接問。","fw":"有升溫跡象，但若其中一方開始在感情或事業上有壓力，另一方很容易被暫時擱置。","sa":"先確認自己是否真的想進一步，因為曖昧的下一步是改變，而改變有時候比等待還難。"},{"n":9,"t":"回聲","sub":"曖昧中","yu":"你喊向山谷的話會回來，但回聲終究不是另一個人的回答。","jie":"「回聲」落在曖昧中這個問題上，重點是：你可能在自己的想像中反覆重播對方的言行。這支籤提醒你，內心推演再多次，都不能取代真實溝通。若一件事對你真的重要，適當的時候需要讓問題走到現實裡。 目前最值得看的不是聊天熱度，而是穩定度。若他只在方便時出現，這份心動還不足以支撐一段真正的關係。 若想讓局勢開始改變，先從這一步做起：挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","adv":"挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","st":"心裡有你，但害怕開口之後被改變的關係；選擇先觀察你對別人的態度。","rx":"找各種理由問你的狀況：「最近怎樣」「今天有沒有事」，但問完不主動推進話題。","fw":"若你稍微給出一個更明確的邀請，對方很可能推進；繼續等待可能維持現狀超過一個月。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":10,"t":"鬆開掌心","sub":"曖昧中","yu":"掌心鬆開，不一定是失去；有時只是終於能看清，留下的是什麼。","jie":"若把「鬆開掌心」放進你現在的曖昧中處境，籤意會更直接：你也許很害怕一旦停止努力，關係就會消失。但真正有生命力的關係，不應完全依靠你的緊抓。稍微放鬆控制，可以讓你更清楚看見對方真正的選擇。 籤意鼓勵一次小而清楚的試探。給出邀約、表達好感或提出下一步，然後把答案交給對方的行動。 比起繼續猜，這支籤更希望你實際做的是：今天少做一件為了確認對方心意而做的事。","adv":"今天少做一件為了確認對方心意而做的事。","st":"刷你的限動、看你的貼文，停很久，卻沒有點讚，因為不想留下太明顯的痕跡。","rx":"刻意不回太快，想製造「剛好看到」的感覺，卻其實一直拿著手機。","fw":"若能找一個自然的機會單獨相處，比持續在線上曖昧更有效。","sa":"不要靠解讀訊息速度或表情貼圖判斷，改用「他主動約我幾次」來計算。"},{"n":11,"t":"春信","sub":"曖昧中","yu":"春天從不敲鑼打鼓，它只是讓枝頭某一天忽然有了新芽。","jie":"你問的是曖昧中，而「春信」先指出一件事：新的關係或新的可能性，未必以戲劇性的方式出現。這支籤提醒你，不要只等待強烈的心動，也留意那些讓你感到安心、自然與被尊重的互動。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","adv":"今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","st":"比較在乎你對他／她的評價，甚至會在對話之後反覆回想你說的話是什麼意思。","rx":"找各種理由問你的狀況：「最近怎樣」「今天有沒有事」，但問完不主動推進話題。","fw":"這段關係正在走向一個轉折點，接下來一兩次的互動品質，會決定走向哪一邊。","sa":"給自己設一個觀察期限（例如三週），超過了就主動一次；不然可能會等很久。"},{"n":12,"t":"舊夢醒時","sub":"曖昧中","yu":"夢醒不是否定夢境，而是提醒你，天已經亮了。","jie":"在曖昧中的脈絡裡，「舊夢醒時」不是抽象的安慰。有些回憶之所以難放下，是因為它曾經真的很好。這支籤允許你珍惜過去，同時提醒你不要讓過去成為衡量所有未來的唯一標準。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","adv":"收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","st":"對你的關心會特別在意，記住你說過的細節，私下提起你的頻率比自己意識到的更高。","rx":"會對你說的笑話給出真實的笑，而不是客套式的「哈哈」。","fw":"若能找一個自然的機會單獨相處，比持續在線上曖昧更有效。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":13,"t":"心有歸處","sub":"曖昧中","yu":"真正的歸處，不是讓你不停猜測自己能不能留下。","jie":"這次以曖昧中來讀「心有歸處」：你正在尋找安全感。這支籤提醒你，關係中的安全感除了來自自己，也應該來自對方清楚、一致且尊重的回應。若你長期處於不確定，值得認真看待這份感受。 這支籤的曖昧訊號偏向「有感覺，但尚未定形」。可以靠近一步，不必一次攤牌；看對方是否也會主動補上另一半距離。 今天可以先做一件很具體的事：寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","adv":"寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","st":"喜歡你的感覺在增加，但同時也在評估這段關係是否現實層面走得下去。","rx":"在你的社群活動上默默按讚，或只看不按，甚至截圖跟朋友討論。","fw":"對方目前猶豫的重點不在感情，而在現實條件是否配合；感情面已有好感。","sa":"把你覺得他對你「有感覺」的具體事件列出來，若超過五件，你的判斷很可能是對的。"},{"n":51,"t":"晨霧散去","sub":"曖昧中","yu":"晨霧會散，不是因為你追趕它，而是太陽終究升起。","jie":"你問的是曖昧中，而「晨霧散去」先指出一件事：有些關係的真相需要時間，而不是更多試探。你現在可能很想立刻知道答案，但過度追問只會讓自己更疲憊。讓互動自然累積，你會更容易看見對方真正的態度。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：今天不測試、不暗示，單純觀察一次對方自然的回應。","adv":"今天不測試、不暗示，單純觀察一次對方自然的回應。","st":"對你的關心會特別在意，記住你說過的細節，私下提起你的頻率比自己意識到的更高。","rx":"會幫你記住你說過但沒放在心上的事，在適當時機提出來，讓你覺得被在乎。","fw":"這段曖昧的對方比你更保守；若你主動一步，勝率比你想的高。","sa":"先確認自己是否真的想進一步，因為曖昧的下一步是改變，而改變有時候比等待還難。"},{"n":52,"t":"未寄的信","sub":"曖昧中","yu":"有些話寫下來，是為了讓自己聽見，不一定非得送到誰手裡。","jie":"在曖昧中的脈絡裡，「未寄的信」不是抽象的安慰。你心裡可能堆著很多想說的話。表達很重要，但不是每一份情緒都必須立刻交給對方承接。先理解自己真正想被看見的是什麼，再決定是否開口。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","adv":"寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","st":"心裡有你，但害怕開口之後被改變的關係；選擇先觀察你對別人的態度。","rx":"會對你說的笑話給出真實的笑，而不是客套式的「哈哈」。","fw":"如果兩週內沒有任何升溫行動，這段曖昧容易被其他事淡化，需要你製造一次近距離接觸。","sa":"先把對方「做過的事」和「說過的話」分開列出；如果行動多於語言，好感是真的。"},{"n":53,"t":"並肩的路","sub":"曖昧中","yu":"真正同行的人，不只在終點等你，也願意調整腳步與你並肩。","jie":"這次以曖昧中來讀「並肩的路」：你也許正在判斷一段關係是否值得繼續。比起甜言蜜語，更值得觀察的是雙方能否協調生活、處理差異，並在不舒服時仍願意溝通。 這支籤的曖昧訊號偏向「有感覺，但尚未定形」。可以靠近一步，不必一次攤牌；看對方是否也會主動補上另一半距離。 今天可以先做一件很具體的事：回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","adv":"回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","st":"可能正在喜歡又不確定，試著透過小事測試你的反應，卻不敢先跨出那一步。","rx":"找理由延長相處時間；聊天結束後可能會再補一句「對了」把話題拉回來。","fw":"對方目前猶豫的重點不在感情，而在現實條件是否配合；感情面已有好感。","sa":"不要靠解讀訊息速度或表情貼圖判斷，改用「他主動約我幾次」來計算。"},{"n":54,"t":"蝶停掌心","sub":"曖昧中","yu":"蝴蝶願意停留時，不需要用手把它困住。","jie":"「蝶停掌心」落在曖昧中這個問題上，重點是：喜歡容易帶來佔有與不安，但親密不是控制。這支籤提醒你，好的關係應該讓兩個人都有呼吸的空間。能自由留下的，比被勉強留下的更有意義。 目前最值得看的不是聊天熱度，而是穩定度。若他只在方便時出現，這份心動還不足以支撐一段真正的關係。 若想讓局勢開始改變，先從這一步做起：今天給彼此一點空間，把注意力放回自己的生活。","adv":"今天給彼此一點空間，把注意力放回自己的生活。","st":"已把你放進「如果要在一起的人」名單，但還沒決定要不要推進。","rx":"試圖確認你是否單身，但透過第三方或迂迴方式，而不是直接問。","fw":"現在的好感是真的，但雙方都在等對方先動。誰先動，誰比較主動。","sa":"先把對方「做過的事」和「說過的話」分開列出；如果行動多於語言，好感是真的。"},{"n":55,"t":"雨中共傘","sub":"曖昧中","yu":"一把傘不必遮住整場雨，只要兩個人都願意往中間靠。","jie":"若把「雨中共傘」放進你現在的曖昧中處境，籤意會更直接：關係遇到困難並不可怕，重要的是雙方是否願意一起承擔。你不需要一個永遠不出問題的人，而是一個問題出現時仍願意和你站在同一邊的人。 籤意鼓勵一次小而清楚的試探。給出邀約、表達好感或提出下一步，然後把答案交給對方的行動。 比起繼續猜，這支籤更希望你實際做的是：想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","adv":"想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","st":"刷你的限動、看你的貼文，停很久，卻沒有點讚，因為不想留下太明顯的痕跡。","rx":"見面時特別在意自己的狀態，比平時更注意外表或說話方式。","fw":"如果兩週內沒有任何升溫行動，這段曖昧容易被其他事淡化，需要你製造一次近距離接觸。","sa":"把你覺得他對你「有感覺」的具體事件列出來，若超過五件，你的判斷很可能是對的。"},{"n":56,"t":"紅線鬆結","sub":"曖昧中","yu":"緣分不是繩索；真正相連的兩端，不需要勒痛彼此。","jie":"你問的是曖昧中，而「紅線鬆結」先指出一件事：你可能把堅持視為深情，但如果一段關係長期讓你縮小自己、害怕表達或反覆受傷，就值得重新檢視。愛可以需要磨合，卻不應以失去自己為代價。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：寫下一個你不願再為任何關係犧牲的界線。","adv":"寫下一個你不願再為任何關係犧牲的界線。","st":"反覆確認你對他／她的行為有沒有不同，藉此判斷自己是否被特別對待。","rx":"會對你說的笑話給出真實的笑，而不是客套式的「哈哈」。","fw":"這段曖昧的對方比你更保守；若你主動一步，勝率比你想的高。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":57,"t":"月下來客","sub":"曖昧中","yu":"有人走進你的夜色，不一定為了帶走孤單，也可能只是提醒你仍能心動。","jie":"在曖昧中的脈絡裡，「月下來客」不是抽象的安慰。新的相遇正在提醒你：你仍有感受、靠近與被理解的能力。不必急著判斷這是不是命定關係，先允許一段互動保持輕盈。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","adv":"今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","st":"喜歡你的感覺在增加，但同時也在評估這段關係是否現實層面走得下去。","rx":"在你的社群活動上默默按讚，或只看不按，甚至截圖跟朋友討論。","fw":"外部因素（忙碌、朋友圈、過去的感情）正在影響對方的節奏，不完全是你的問題。","sa":"下次見面時，找一個只有兩個人知道的小事，看看對方的反應；這比分析訊息更準。"},{"n":58,"t":"潮汐相認","sub":"曖昧中","yu":"海岸不追逐潮水，潮水也知道何時回來。","jie":"這次以曖昧中來讀「潮汐相認」：穩定的關係不需要靠不停確認維持。如果一個人只有在你追趕時才靠近，你需要看的不是自己還能多努力，而是這份互動本身是否平衡。 這支籤的曖昧訊號偏向「有感覺，但尚未定形」。可以靠近一步，不必一次攤牌；看對方是否也會主動補上另一半距離。 今天可以先做一件很具體的事：今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","adv":"今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","st":"已把你放進「如果要在一起的人」名單，但還沒決定要不要推進。","rx":"試圖確認你是否單身，但透過第三方或迂迴方式，而不是直接問。","fw":"這段曖昧的對方比你更保守；若你主動一步，勝率比你想的高。","sa":"停止解讀對方每一則訊息的語氣，改成觀察他主動聯絡你的頻率是否在上升。"},{"n":59,"t":"鏡中花","sub":"曖昧中","yu":"你愛上的若只是想像，再美的花也無法真正被觸碰。","jie":"「鏡中花」落在曖昧中這個問題上，重點是：你可能把期待、潛力或過去的美好投射在一個人身上。這支籤提醒你，把「他可能成為誰」與「他現在是誰」分開，會更接近真實。 目前最值得看的不是聊天熱度，而是穩定度。若他只在方便時出現，這份心動還不足以支撐一段真正的關係。 若想讓局勢開始改變，先從這一步做起：列出對方現在實際具備的三個特質，不寫「也許以後」。","adv":"列出對方現在實際具備的三個特質，不寫「也許以後」。","st":"在等你先給出一個更明確的訊號，自己的感覺已佔七分，差的是你的那三分。","rx":"在群體中時常往你的方向看，但你直視時會先轉移目光。","fw":"有升溫跡象，但若其中一方開始在感情或事業上有壓力，另一方很容易被暫時擱置。","sa":"聊天時試著說一句「你這個人還蠻特別的」，觀察對方怎麼接；反應會透露很多。"},{"n":60,"t":"暖燈","sub":"曖昧中","yu":"真正的靠近，不一定耀眼；有時只是你回頭時，那盞燈一直都在。","jie":"若把「暖燈」放進你現在的曖昧中處境，籤意會更直接：你可能習慣被強烈情緒吸引，卻忽略穩定的善意。長久關係往往藏在一致、可靠與願意回應的細節裡。平靜不一定代表無聊，也可能代表安全。 籤意鼓勵一次小而清楚的試探。給出邀約、表達好感或提出下一步，然後把答案交給對方的行動。 比起繼續猜，這支籤更希望你實際做的是：留意今天誰用一個小行動讓你感到被照顧。","adv":"留意今天誰用一個小行動讓你感到被照顧。","st":"對你的關心會特別在意，記住你說過的細節，私下提起你的頻率比自己意識到的更高。","rx":"在你的社群活動上默默按讚，或只看不按，甚至截圖跟朋友討論。","fw":"這段曖昧有升溫空間，但需要一方突破「舒適的不確定」；否則可能自然冷卻。","sa":"下一次對話結束時，你是先說再見，還是對方先說？觀察這個小細節兩三次。"},{"n":61,"t":"花開兩處","sub":"曖昧中","yu":"兩朵花可以彼此喜歡，也仍需要各自的土壤與陽光。","jie":"你問的是曖昧中，而「花開兩處」先指出一件事：親密並不要求兩個人變成同一個人。保有朋友、興趣、目標與獨處空間，反而能讓關係更有生命力。這支籤提醒你，不要把全部的自己交給一段關係定義。 這段曖昧容易因猜測變得過度複雜。少解讀暗示，多看是否願意安排時間、兌現約定、把你放進真實生活。 把答案帶回現實的方法是：今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","adv":"今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","st":"比較在乎你對他／她的評價，甚至會在對話之後反覆回想你說的話是什麼意思。","rx":"見面時特別在意自己的狀態，比平時更注意外表或說話方式。","fw":"外部因素（忙碌、朋友圈、過去的感情）正在影響對方的節奏，不完全是你的問題。","sa":"給自己設一個觀察期限（例如三週），超過了就主動一次；不然可能會等很久。"},{"n":62,"t":"星光有期","sub":"曖昧中","yu":"不是所有錯過都叫遺憾，有些只是彼此抵達的時間不同。","jie":"在曖昧中的脈絡裡，「星光有期」不是抽象的安慰。你可能在想「如果早一點、晚一點會不會不同」。但關係除了感情，也需要時機與現實條件。接受當下的限制，不代表否定曾經的心意。 關係有往前的可能，但節奏不能只由你推動。若你停一下，對方仍會靠近，才是更值得相信的訊號。 給你的行動提示是：把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","adv":"把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","st":"反覆確認你對他／她的行為有沒有不同，藉此判斷自己是否被特別對待。","rx":"對你說的話有更強的記憶，隔很久之後冒出來說「你之前說過⋯⋯」。","fw":"外部因素（忙碌、朋友圈、過去的感情）正在影響對方的節奏，不完全是你的問題。","sa":"減少主動的次數一週，看對方會不會自己找回來；這個測試比猜測有效。"},{"n":1,"t":"月影未央","sub":"關係中","yu":"月還未落，故事也還沒有走到最後；只是今夜的你，不必替明天先寫結局。","jie":"在關係中的脈絡裡，「月影未央」不是抽象的安慰。你可能正因一段關係尚未明朗而反覆猜測。這支籤提醒你，未知並不等於失去，也不代表一定會得到。比起急著確認對方的答案，更重要的是先確認自己是否在這段等待裡被好好對待。 這支籤把焦點放在「修復」而不是輸贏。近期適合談一件真正卡住你們的事，確認彼此還願不願意一起處理。 若想讓局勢開始改變，先從這一步做起：今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","adv":"今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","st":"兩人之間可能有未說完的話，不是不想說，而是找不到好的時機。","rx":"對方可能正在想辦法讓你開心，只是用的方式不在你的雷達上。","fw":"若你們能進行一次真正沒有電話的相處，關係品質會明顯上升。","sa":"讓對方知道你注意到他／她最近的辛苦；一句「你最近很努力」比很多事都有用。"},{"n":2,"t":"花未眠","sub":"關係中","yu":"有些花不是不開，只是你守得太久，忘了自己的季節也正在經過。","jie":"這次以關係中來讀「花未眠」：等待一個人久了，很容易把希望變成生活的中心。這支籤不是催你離開，而是提醒你：喜歡一個人的同時，也別讓自己的時間停止。真正適合你的關係，不會只剩等待。 你們之間不是沒有感情，而是相處方式可能累積了疲憊。先調整日常的小摩擦，比急著判斷要不要分開更有效。 比起繼續猜，這支籤更希望你實際做的是：今天安排一件完全與對方無關、但會讓你開心的小事。","adv":"今天安排一件完全與對方無關、但會讓你開心的小事。","st":"感情的根還在，但表面的養分不夠了；需要一次不是為了解決問題的相處。","rx":"若你最近情緒不穩，對方可能選擇等你先平靜，而不是當下處理。","fw":"你們現在的狀態如果繼續，關係會穩定但不太有新的進展；需要一個小改變。","sa":"讓對方知道你注意到他／她最近的辛苦；一句「你最近很努力」比很多事都有用。"},{"n":3,"t":"潮聲未止","sub":"關係中","yu":"潮水來去都有時候，心意也是；握得太緊，反而聽不見真正的聲音。","jie":"「潮聲未止」落在關係中這個問題上，重點是：你可能正在試圖從訊息、語氣或細節裡找答案。這支籤提醒你，關係裡有些變化需要時間顯現。與其不斷解讀，不如觀察對方是否有穩定而實際的行動。 籤意提醒你留意失衡：若總是一個人安撫、安排、退讓，關係會慢慢耗空。愛需要雙方都承擔維護的責任。 把答案帶回現實的方法是：今天少做一次猜測，多記錄一次事實：他實際做了什麼？","adv":"今天少做一次猜測，多記錄一次事實：他實際做了什麼？","st":"對方對你的在乎是真的，只是最近表達的方式讓你感受不到。","rx":"若你最近情緒不穩，對方可能選擇等你先平靜，而不是當下處理。","fw":"你們現在的狀態如果繼續，關係會穩定但不太有新的進展；需要一個小改變。","sa":"這週選一天，把手機放下，只有你們兩個人在；哪怕兩小時也好。"},{"n":4,"t":"星落於你","sub":"關係中","yu":"有些相遇，是宇宙借來的一束光；它照亮過你，就已經留下意義。","jie":"若把「星落於你」放進你現在的關係中處境，籤意會更直接：不是每段重要的關係都一定要以永遠作為證明。這支籤提醒你，把一段關係的價值與它最後是否留下分開來看。你曾經感受到的真實，不會因為結果改變而完全消失。 這段關係正走到需要更新規則的地方。把期待說清楚，包括時間、承諾、界線與未來，不要只靠默契猜測。 給你的行動提示是：寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","adv":"寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","st":"兩人之間可能有未說完的話，不是不想說，而是找不到好的時機。","rx":"若你最近情緒不穩，對方可能選擇等你先平靜，而不是當下處理。","fw":"有一個關於未來計劃的討論，可能比你預期的早出現，先想清楚自己的立場。","sa":"找回你們剛在一起時會做的某一件事；不是懷舊，是提醒彼此還是那兩個人。"},{"n":5,"t":"風向轉了","sub":"關係中","yu":"風沒有背叛誰，它只是開始吹往新的方向。","jie":"你問的是關係中，而「風向轉了」先指出一件事：如果你感覺一段關係正在改變，不必立刻把改變解讀成自己的不足。有時兩個人的需求、步調與方向真的會不同。真正值得確認的是：現在的關係，還有沒有雙方共同前進的意願。 若最近有距離感，先不要用最壞的答案填補空白。安排一次不帶指責的對話，看看對方是否仍願意向你靠近。 今天可以先做一件很具體的事：今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","adv":"今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","st":"對方對你的在乎是真的，只是最近表達的方式讓你感受不到。","rx":"你們之間若有一件事最近沒有說清楚，對方也感覺到了，只是不確定怎麼開口。","fw":"有一個關於未來計劃的討論，可能比你預期的早出現，先想清楚自己的立場。","sa":"把你最近沒說出口的一個想法，找一個不是睡前的時間好好說。"},{"n":6,"t":"燈還亮著","sub":"關係中","yu":"遠處的燈仍亮著，但你不必整夜站在窗前等它為你閃爍。","jie":"在關係中的脈絡裡，「燈還亮著」不是抽象的安慰。你心裡可能還留著希望。希望本身沒有錯，但若它讓你無法生活，就需要重新放回適當的位置。這支籤提醒你，可以保留可能性，同時繼續過自己的日子。 這支籤把焦點放在「修復」而不是輸贏。近期適合談一件真正卡住你們的事，確認彼此還願不願意一起處理。 若想讓局勢開始改變，先從這一步做起：替等待設一個界線：今天有哪些時間，只屬於你自己？","adv":"替等待設一個界線：今天有哪些時間，只屬於你自己？","st":"對方對你的在乎是真的，只是最近表達的方式讓你感受不到。","rx":"對方記得你們的某個重要日子或小細節，有可能會在你沒注意的時候提起。","fw":"感情在悄悄走向一個更深的階段，可能是更正式的承諾，或更坦誠的溝通。","sa":"找回你們剛在一起時會做的某一件事；不是懷舊，是提醒彼此還是那兩個人。"},{"n":7,"t":"兩岸之間","sub":"關係中","yu":"河流沒有問哪一岸更重要，只是不斷提醒彼此：靠近需要有人渡河。","jie":"這次以關係中來讀「兩岸之間」：關係不能只靠一個人維持。你也許已經做了很多努力，現在適合看看另一方是否也願意跨出距離。愛不是計較誰付出更多，而是長期是否存在雙向靠近。 你們之間不是沒有感情，而是相處方式可能累積了疲憊。先調整日常的小摩擦，比急著判斷要不要分開更有效。 比起繼續猜，這支籤更希望你實際做的是：列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","adv":"列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","st":"對方對你的在乎是真的，只是最近表達的方式讓你感受不到。","rx":"你們之間若有一件事最近沒有說清楚，對方也感覺到了，只是不確定怎麼開口。","fw":"外部壓力（家人期望、工作節奏）最近對你們的影響大於你們察覺到的，這是主因。","sa":"找一個兩人都沒去過的地方，製造一個新的共同記憶，哪怕只是一個下午。"},{"n":8,"t":"雲後有月","sub":"關係中","yu":"你看不見月亮時，它沒有因此消失；但你也不必把每一片雲，都想像成月光。","jie":"「雲後有月」落在關係中這個問題上，重點是：目前的訊號可能很模糊。這支籤提醒你保留希望，也保留判斷。不要因為想得到某個答案，就替所有曖昧的細節加上你期待的意義。 籤意提醒你留意失衡：若總是一個人安撫、安排、退讓，關係會慢慢耗空。愛需要雙方都承擔維護的責任。 把答案帶回現實的方法是：今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","adv":"今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","st":"你們正在適應某個改變（工作、距離、生活節奏），摩擦來自於適應，不是問題本身。","rx":"你們之間若有一件事最近沒有說清楚，對方也感覺到了，只是不確定怎麼開口。","fw":"這段感情現在的挑戰是維持共同語言，而不是感情本身；找一件兩人都有興趣的事。","sa":"找一個兩人都沒去過的地方，製造一個新的共同記憶，哪怕只是一個下午。"},{"n":9,"t":"回聲","sub":"關係中","yu":"你喊向山谷的話會回來，但回聲終究不是另一個人的回答。","jie":"若把「回聲」放進你現在的關係中處境，籤意會更直接：你可能在自己的想像中反覆重播對方的言行。這支籤提醒你，內心推演再多次，都不能取代真實溝通。若一件事對你真的重要，適當的時候需要讓問題走到現實裡。 這段關係正走到需要更新規則的地方。把期待說清楚，包括時間、承諾、界線與未來，不要只靠默契猜測。 給你的行動提示是：挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","adv":"挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","st":"感情仍然在，但最近的生活壓力讓彼此忽略了一些平時很小但很重要的事。","rx":"他／她最近的沉默可能是在消化某件事，不是在生你的氣。","fw":"若你們能進行一次真正沒有電話的相處，關係品質會明顯上升。","sa":"找回你們剛在一起時會做的某一件事；不是懷舊，是提醒彼此還是那兩個人。"},{"n":10,"t":"鬆開掌心","sub":"關係中","yu":"掌心鬆開，不一定是失去；有時只是終於能看清，留下的是什麼。","jie":"你問的是關係中，而「鬆開掌心」先指出一件事：你也許很害怕一旦停止努力，關係就會消失。但真正有生命力的關係，不應完全依靠你的緊抓。稍微放鬆控制，可以讓你更清楚看見對方真正的選擇。 若最近有距離感，先不要用最壞的答案填補空白。安排一次不帶指責的對話，看看對方是否仍願意向你靠近。 今天可以先做一件很具體的事：今天少做一件為了確認對方心意而做的事。","adv":"今天少做一件為了確認對方心意而做的事。","st":"你們可能都在等對方先開口一個問題，而那個問題如果說出來，可能比想的容易解決。","rx":"對方記得你們的某個重要日子或小細節，有可能會在你沒注意的時候提起。","fw":"外部壓力（家人期望、工作節奏）最近對你們的影響大於你們察覺到的，這是主因。","sa":"問對方最近最有壓力的事是什麼，然後只聽，不給建議；這一次先這樣。"},{"n":11,"t":"春信","sub":"關係中","yu":"春天從不敲鑼打鼓，它只是讓枝頭某一天忽然有了新芽。","jie":"在關係中的脈絡裡，「春信」不是抽象的安慰。新的關係或新的可能性，未必以戲劇性的方式出現。這支籤提醒你，不要只等待強烈的心動，也留意那些讓你感到安心、自然與被尊重的互動。 這支籤把焦點放在「修復」而不是輸贏。近期適合談一件真正卡住你們的事，確認彼此還願不願意一起處理。 若想讓局勢開始改變，先從這一步做起：今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","adv":"今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","st":"你們正在適應某個改變（工作、距離、生活節奏），摩擦來自於適應，不是問題本身。","rx":"若你最近情緒不穩，對方可能選擇等你先平靜，而不是當下處理。","fw":"外部壓力（家人期望、工作節奏）最近對你們的影響大於你們察覺到的，這是主因。","sa":"試著做一件讓對方驚喜但不需要花很多錢的事；小動作在感情裡比大動作有效。"},{"n":12,"t":"舊夢醒時","sub":"關係中","yu":"夢醒不是否定夢境，而是提醒你，天已經亮了。","jie":"這次以關係中來讀「舊夢醒時」：有些回憶之所以難放下，是因為它曾經真的很好。這支籤允許你珍惜過去，同時提醒你不要讓過去成為衡量所有未來的唯一標準。 你們之間不是沒有感情，而是相處方式可能累積了疲憊。先調整日常的小摩擦，比急著判斷要不要分開更有效。 比起繼續猜，這支籤更希望你實際做的是：收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","adv":"收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","st":"你們可能都在等對方先開口一個問題，而那個問題如果說出來，可能比想的容易解決。","rx":"對方可能比你知道的更擔心你的狀態，只是用沉默代替了追問。","fw":"這段感情的長期走向取決於你們能不能在忙碌中保持刻意的連結。","sa":"這週選一天，把手機放下，只有你們兩個人在；哪怕兩小時也好。"},{"n":13,"t":"心有歸處","sub":"關係中","yu":"真正的歸處，不是讓你不停猜測自己能不能留下。","jie":"「心有歸處」落在關係中這個問題上，重點是：你正在尋找安全感。這支籤提醒你，關係中的安全感除了來自自己，也應該來自對方清楚、一致且尊重的回應。若你長期處於不確定，值得認真看待這份感受。 籤意提醒你留意失衡：若總是一個人安撫、安排、退讓，關係會慢慢耗空。愛需要雙方都承擔維護的責任。 把答案帶回現實的方法是：寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","adv":"寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","st":"感情仍然在，但最近的生活壓力讓彼此忽略了一些平時很小但很重要的事。","rx":"對方可能正在想辦法讓你開心，只是用的方式不在你的雷達上。","fw":"若你們能進行一次真正沒有電話的相處，關係品質會明顯上升。","sa":"把你最近沒說出口的一個想法，找一個不是睡前的時間好好說。"},{"n":51,"t":"晨霧散去","sub":"關係中","yu":"晨霧會散，不是因為你追趕它，而是太陽終究升起。","jie":"在關係中的脈絡裡，「晨霧散去」不是抽象的安慰。有些關係的真相需要時間，而不是更多試探。你現在可能很想立刻知道答案，但過度追問只會讓自己更疲憊。讓互動自然累積，你會更容易看見對方真正的態度。 這支籤把焦點放在「修復」而不是輸贏。近期適合談一件真正卡住你們的事，確認彼此還願不願意一起處理。 若想讓局勢開始改變，先從這一步做起：今天不測試、不暗示，單純觀察一次對方自然的回應。","adv":"今天不測試、不暗示，單純觀察一次對方自然的回應。","st":"有一個小小的不安在累積，但還沒到要談的程度；這個不安如果繼續忽略，會變大。","rx":"對方可能正在想辦法讓你開心，只是用的方式不在你的雷達上。","fw":"感情在悄悄走向一個更深的階段，可能是更正式的承諾，或更坦誠的溝通。","sa":"找一個兩人都沒去過的地方，製造一個新的共同記憶，哪怕只是一個下午。"},{"n":52,"t":"未寄的信","sub":"關係中","yu":"有些話寫下來，是為了讓自己聽見，不一定非得送到誰手裡。","jie":"這次以關係中來讀「未寄的信」：你心裡可能堆著很多想說的話。表達很重要，但不是每一份情緒都必須立刻交給對方承接。先理解自己真正想被看見的是什麼，再決定是否開口。 你們之間不是沒有感情，而是相處方式可能累積了疲憊。先調整日常的小摩擦，比急著判斷要不要分開更有效。 比起繼續猜，這支籤更希望你實際做的是：寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","adv":"寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","st":"你們可能都在等對方先開口一個問題，而那個問題如果說出來，可能比想的容易解決。","rx":"他／她最近的沉默可能是在消化某件事，不是在生你的氣。","fw":"這段感情現在的挑戰是維持共同語言，而不是感情本身；找一件兩人都有興趣的事。","sa":"問對方最近最有壓力的事是什麼，然後只聽，不給建議；這一次先這樣。"},{"n":53,"t":"並肩的路","sub":"關係中","yu":"真正同行的人，不只在終點等你，也願意調整腳步與你並肩。","jie":"「並肩的路」落在關係中這個問題上，重點是：你也許正在判斷一段關係是否值得繼續。比起甜言蜜語，更值得觀察的是雙方能否協調生活、處理差異，並在不舒服時仍願意溝通。 籤意提醒你留意失衡：若總是一個人安撫、安排、退讓，關係會慢慢耗空。愛需要雙方都承擔維護的責任。 把答案帶回現實的方法是：回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","adv":"回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","st":"兩人之間可能有未說完的話，不是不想說，而是找不到好的時機。","rx":"若你給出一個主動的善意，對方的反應幾乎可以確定是正向的。","fw":"若你們能進行一次真正沒有電話的相處，關係品質會明顯上升。","sa":"找回你們剛在一起時會做的某一件事；不是懷舊，是提醒彼此還是那兩個人。"},{"n":54,"t":"蝶停掌心","sub":"關係中","yu":"蝴蝶願意停留時，不需要用手把它困住。","jie":"若把「蝶停掌心」放進你現在的關係中處境，籤意會更直接：喜歡容易帶來佔有與不安，但親密不是控制。這支籤提醒你，好的關係應該讓兩個人都有呼吸的空間。能自由留下的，比被勉強留下的更有意義。 這段關係正走到需要更新規則的地方。把期待說清楚，包括時間、承諾、界線與未來，不要只靠默契猜測。 給你的行動提示是：今天給彼此一點空間，把注意力放回自己的生活。","adv":"今天給彼此一點空間，把注意力放回自己的生活。","st":"兩人之間可能有未說完的話，不是不想說，而是找不到好的時機。","rx":"他／她在乎的那件事，可能不是你以為的那件事；直接問比猜更快。","fw":"這段感情現在的挑戰是維持共同語言，而不是感情本身；找一件兩人都有興趣的事。","sa":"把你最近沒說出口的一個想法，找一個不是睡前的時間好好說。"},{"n":55,"t":"雨中共傘","sub":"關係中","yu":"一把傘不必遮住整場雨，只要兩個人都願意往中間靠。","jie":"你問的是關係中，而「雨中共傘」先指出一件事：關係遇到困難並不可怕，重要的是雙方是否願意一起承擔。你不需要一個永遠不出問題的人，而是一個問題出現時仍願意和你站在同一邊的人。 若最近有距離感，先不要用最壞的答案填補空白。安排一次不帶指責的對話，看看對方是否仍願意向你靠近。 今天可以先做一件很具體的事：想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","adv":"想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","st":"有一個小小的不安在累積，但還沒到要談的程度；這個不安如果繼續忽略，會變大。","rx":"若你最近情緒不穩，對方可能選擇等你先平靜，而不是當下處理。","fw":"若你們能進行一次真正沒有電話的相處，關係品質會明顯上升。","sa":"這週選一天，把手機放下，只有你們兩個人在；哪怕兩小時也好。"},{"n":56,"t":"紅線鬆結","sub":"關係中","yu":"緣分不是繩索；真正相連的兩端，不需要勒痛彼此。","jie":"在關係中的脈絡裡，「紅線鬆結」不是抽象的安慰。你可能把堅持視為深情，但如果一段關係長期讓你縮小自己、害怕表達或反覆受傷，就值得重新檢視。愛可以需要磨合，卻不應以失去自己為代價。 這支籤把焦點放在「修復」而不是輸贏。近期適合談一件真正卡住你們的事，確認彼此還願不願意一起處理。 若想讓局勢開始改變，先從這一步做起：寫下一個你不願再為任何關係犧牲的界線。","adv":"寫下一個你不願再為任何關係犧牲的界線。","st":"感情的根還在，但表面的養分不夠了；需要一次不是為了解決問題的相處。","rx":"你們之間若有一件事最近沒有說清楚，對方也感覺到了，只是不確定怎麼開口。","fw":"這段感情現在的挑戰是維持共同語言，而不是感情本身；找一件兩人都有興趣的事。","sa":"下次想批評之前，先說一件你欣賞對方的事；不是敷衍，是真的先找一件。"},{"n":57,"t":"月下來客","sub":"關係中","yu":"有人走進你的夜色，不一定為了帶走孤單，也可能只是提醒你仍能心動。","jie":"這次以關係中來讀「月下來客」：新的相遇正在提醒你：你仍有感受、靠近與被理解的能力。不必急著判斷這是不是命定關係，先允許一段互動保持輕盈。 你們之間不是沒有感情，而是相處方式可能累積了疲憊。先調整日常的小摩擦，比急著判斷要不要分開更有效。 比起繼續猜，這支籤更希望你實際做的是：今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","adv":"今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","st":"你們可能都在等對方先開口一個問題，而那個問題如果說出來，可能比想的容易解決。","rx":"對方可能比你知道的更擔心你的狀態，只是用沉默代替了追問。","fw":"你們現在的狀態如果繼續，關係會穩定但不太有新的進展；需要一個小改變。","sa":"找一個兩人都沒去過的地方，製造一個新的共同記憶，哪怕只是一個下午。"},{"n":58,"t":"潮汐相認","sub":"關係中","yu":"海岸不追逐潮水，潮水也知道何時回來。","jie":"「潮汐相認」落在關係中這個問題上，重點是：穩定的關係不需要靠不停確認維持。如果一個人只有在你追趕時才靠近，你需要看的不是自己還能多努力，而是這份互動本身是否平衡。 籤意提醒你留意失衡：若總是一個人安撫、安排、退讓，關係會慢慢耗空。愛需要雙方都承擔維護的責任。 把答案帶回現實的方法是：今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","adv":"今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","st":"兩人之間可能有未說完的話，不是不想說，而是找不到好的時機。","rx":"你們之間若有一件事最近沒有說清楚，對方也感覺到了，只是不確定怎 在這段等待裡被好好對待。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","adv":"今天先不追問結果。寫下：如果不考慮害怕失去，我真正希望這段關係是什麼樣子？","st":"這段單身期讓你更清楚自己不要什麼，下一段感情的方向比以前更明確。","rx":"某個你以為只是朋友的人，可能對你的態度正在悄悄改變。","fw":"不是沒有機會，而是之前遇到的都不夠好；接下來的可能性品質會高一點。","sa":"你現在的生活若讓你滿意，感情自然會找到空間進來；若不滿意，先從這裡修。"},{"n":2,"t":"花未眠","sub":"單身中","yu":"有些花不是不開，只是你守得太久，忘了自己的季節也正在經過。","jie":"「花未眠」落在單身中這個問題上，重點是：等待一個人久了，很容易把希望變成生活的中心。這支籤不是催你離開，而是提醒你：喜歡一個人的同時，也別讓自己的時間停止。真正適合你的關係，不會只剩等待。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：今天安排一件完全與對方無關、但會讓你開心的小事。","adv":"今天安排一件完全與對方無關、但會讓你開心的小事。","st":"你已具備讓感情走遠的條件，但還在等一個對的起始點，而不是隨便一個開始。","rx":"近期有個場合，你若主動展開對話，結果可能超出你的預期。","fw":"不是沒有機會，而是之前遇到的都不夠好；接下來的可能性品質會高一點。","sa":"如果有人想介紹，先見一次；一次就夠你判斷，不去的話永遠不知道。"},{"n":3,"t":"潮聲未止","sub":"單身中","yu":"潮水來去都有時候，心意也是；握得太緊，反而聽不見真正的聲音。","jie":"若把「潮聲未止」放進你現在的單身中處境，籤意會更直接：你可能正在試圖從訊息、語氣或細節裡找答案。這支籤提醒你，關係裡有些變化需要時間顯現。與其不斷解讀，不如觀察對方是否有穩定而實際的行動。 近期若有人靠近，不必急著定義。給彼此幾次真實相處的機會；好的緣分會讓不確定逐漸減少，而不是越來越多。 若想讓局勢開始改變，先從這一步做起：今天少做一次猜測，多記錄一次事實：他實際做了什麼？","adv":"今天少做一次猜測，多記錄一次事實：他實際做了什麼？","st":"這段單身期讓你更清楚自己不要什麼，下一段感情的方向比以前更明確。","rx":"有人在等你先開口，因為他們不確定你有沒有興趣。","fw":"如果你最近在某個固定的地方或活動圈，可以多給它一些時間。","sa":"列一件只要單身才能自在做的事，把它做完；這段時間的禮物不要浪費。"},{"n":4,"t":"星落於你","sub":"單身中","yu":"有些相遇，是宇宙借來的一束光；它照亮過你，就已經留下意義。","jie":"你問的是單身中，而「星落於你」先指出一件事：不是每段重要的關係都一定要以永遠作為證明。這支籤提醒你，把一段關係的價值與它最後是否留下分開來看。你曾經感受到的真實，不會因為結果改變而完全消失。 這支籤的桃花不在「趕快遇見」，而在「辨認適合」。近期遇到的人，先看相處後你是否更自在，而不是只看心跳多快。 比起繼續猜，這支籤更希望你實際做的是：寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","adv":"寫下這段關係曾經帶給你的三件禮物，不論它最後走向哪裡。","st":"比起渴望有人，你更渴望一段讓你放鬆的關係，這個要求並不過分。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"外表的改變（造型、氣色）和你的吸引力之間有直接關係，這段時間值得投資自己。","sa":"和一個你欣賞但還不熟的人，找個機會多說一點話。"},{"n":5,"t":"風向轉了","sub":"單身中","yu":"風沒有背叛誰，它只是開始吹往新的方向。","jie":"在單身中的脈絡裡，「風向轉了」不是抽象的安慰。如果你感覺一段關係正在改變，不必立刻把改變解讀成自己的不足。有時兩個人的需求、步調與方向真的會不同。真正值得確認的是：現在的關係，還有沒有雙方共同前進的意願。 新緣分有機會從原本不特別浪漫的場合長出來，例如朋友、工作、興趣或重複出現的生活圈。保持開放即可。 把答案帶回現實的方法是：今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","adv":"今天問自己：我是在愛這個人，還是在努力維持從前的樣子？","st":"可能有人已對你有好感，但因為某些現實或個性因素，還沒主動表示。","rx":"周圍可能有人對你有好感，但用很自然的方式靠近，不動聲色。","fw":"外表的改變（造型、氣色）和你的吸引力之間有直接關係，這段時間值得投資自己。","sa":"試著去一個你從來沒去過的地方或活動，打破熟悉的圈子。"},{"n":6,"t":"燈還亮著","sub":"單身中","yu":"遠處的燈仍亮著，但你不必整夜站在窗前等它為你閃爍。","jie":"這次以單身中來讀「燈還亮著」：你心裡可能還留著希望。希望本身沒有錯，但若它讓你無法生活，就需要重新放回適當的位置。這支籤提醒你，可以保留可能性，同時繼續過自己的日子。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：替等待設一個界線：今天有哪些時間，只屬於你自己？","adv":"替等待設一個界線：今天有哪些時間，只屬於你自己？","st":"比起渴望有人，你更渴望一段讓你放鬆的關係，這個要求並不過分。","rx":"有人在等你先開口，因為他們不確定你有沒有興趣。","fw":"單身狀態不會是長期的，但緣分多半出現在你不刻意找的時候。","sa":"試著去一個你從來沒去過的地方或活動，打破熟悉的圈子。"},{"n":7,"t":"兩岸之間","sub":"單身中","yu":"河流沒有問哪一岸更重要，只是不斷提醒彼此：靠近需要有人渡河。","jie":"「兩岸之間」落在單身中這個問題上，重點是：關係不能只靠一個人維持。你也許已經做了很多努力，現在適合看看另一方是否也願意跨出距離。愛不是計較誰付出更多，而是長期是否存在雙向靠近。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","adv":"列出最近三次主動靠近的行動，看看是否總是由同一個人發起。","st":"比起渴望有人，你更渴望一段讓你放鬆的關係，這個要求並不過分。","rx":"某個你以為只是朋友的人，可能對你的態度正在悄悄改變。","fw":"單身狀態不會是長期的，但緣分多半出現在你不刻意找的時候。","sa":"試著去一個你從來沒去過的地方或活動，打破熟悉的圈子。"},{"n":8,"t":"雲後有月","sub":"單身中","yu":"你看不見月亮時，它沒有因此消失；但你也不必把每一片雲，都想像成月光。","jie":"若把「雲後有月」放進你現在的單身中處境，籤意會更直接：目前的訊號可能很模糊。這支籤提醒你保留希望，也保留判斷。不要因為想得到某個答案，就替所有曖昧的細節加上你期待的意義。 近期若有人靠近，不必急著定義。給彼此幾次真實相處的機會；好的緣分會讓不確定逐漸減少，而不是越來越多。 若想讓局勢開始改變，先從這一步做起：今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","adv":"今天把「我希望是真的」和「我確定知道的」分成兩欄寫下來。","st":"這段時間是你理解自己的重要階段，下一段關係的品質會因此提高。","rx":"你對某些人的直覺評估其實很準；信任你的第一印象。","fw":"下一個進入你生命的人，可能不是你以為的類型，但相處起來比預期的自在。","sa":"不把感情的事放在每天的待辦事項裡，但當機會出現時，別因為怕麻煩而錯過。"},{"n":9,"t":"回聲","sub":"單身中","yu":"你喊向山谷的話會回來，但回聲終究不是另一個人的回答。","jie":"你問的是單身中，而「回聲」先指出一件事：你可能在自己的想像中反覆重播對方的言行。這支籤提醒你，內心推演再多次，都不能取代真實溝通。若一件事對你真的重要，適當的時候需要讓問題走到現實裡。 這支籤的桃花不在「趕快遇見」，而在「辨認適合」。近期遇到的人，先看相處後你是否更自在，而不是只看心跳多快。 比起繼續猜，這支籤更希望你實際做的是：挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","adv":"挑一個你最想確認的問題，把它改寫成不指責、可以直接詢問的一句話。","st":"現在的單身可能不是因為機會少，而是你的標準在升級，只是還沒遇到對的。","rx":"某個你以為只是朋友的人，可能對你的態度正在悄悄改變。","fw":"單身狀態不會是長期的，但緣分多半出現在你不刻意找的時候。","sa":"如果有人想介紹，先見一次；一次就夠你判斷，不去的話永遠不知道。"},{"n":10,"t":"鬆開掌心","sub":"單身中","yu":"掌心鬆開，不一定是失去；有時只是終於能看清，留下的是什麼。","jie":"在單身中的脈絡裡，「鬆開掌心」不是抽象的安慰。你也許很害怕一旦停止努力，關係就會消失。但真正有生命力的關係，不應完全依靠你的緊抓。稍微放鬆控制，可以讓你更清楚看見對方真正的選擇。 新緣分有機會從原本不特別浪漫的場合長出來，例如朋友、工作、興趣或重複出現的生活圈。保持開放即可。 把答案帶回現實的方法是：今天少做一件為了確認對方心意而做的事。","adv":"今天少做一件為了確認對方心意而做的事。","st":"這段時間是你理解自己的重要階段，下一段關係的品質會因此提高。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"接下來一到三個月，若你增加社交的廣度，遇到合適的人機率明顯上升。","sa":"讓你欣賞的人知道你欣賞他們，不一定是表白，而是真誠的一句話。"},{"n":11,"t":"春信","sub":"單身中","yu":"春天從不敲鑼打鼓，它只是讓枝頭某一天忽然有了新芽。","jie":"這次以單身中來讀「春信」：新的關係或新的可能性，未必以戲劇性的方式出現。這支籤提醒你，不要只等待強烈的心動，也留意那些讓你感到安心、自然與被尊重的互動。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","adv":"今天留意一個讓你感到舒服的人際瞬間，不急著替它命名。","st":"你對感情有認真的期待，不是因為焦慮，而是因為你知道自己值得被認真對待。","rx":"你對某些人的直覺評估其實很準；信任你的第一印象。","fw":"外表的改變（造型、氣色）和你的吸引力之間有直接關係，這段時間值得投資自己。","sa":"不需要主動尋找，但也不要拒絕被找；先把自己的狀態調整好，機會自己會來。"},{"n":12,"t":"舊夢醒時","sub":"單身中","yu":"夢醒不是否定夢境，而是提醒你，天已經亮了。","jie":"「舊夢醒時」落在單身中這個問題上，重點是：有些回憶之所以難放下，是因為它曾經真的很好。這支籤允許你珍惜過去，同時提醒你不要讓過去成為衡量所有未來的唯一標準。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","adv":"收起一件會讓你反覆回到過去的東西，先放七天，不必丟掉。","st":"你可能正在不自覺地對感情保持距離，用忙碌或「時候未到」保護自己。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"接下來一到三個月，若你增加社交的廣度，遇到合適的人機率明顯上升。","sa":"你現在的生活若讓你滿意，感情自然會找到空間進來；若不滿意，先從這裡修。"},{"n":13,"t":"心有歸處","sub":"單身中","yu":"真正的歸處，不是讓你不停猜測自己能不能留下。","jie":"若把「心有歸處」放進你現在的單身中處境，籤意會更直接：你正在尋找安全感。這支籤提醒你，關係中的安全感除了來自自己，也應該來自對方清楚、一致且尊重的回應。若你長期處於不確定，值得認真看待這份感受。 近期若有人靠近，不必急著定義。給彼此幾次真實相處的機會；好的緣分會讓不確定逐漸減少，而不是越來越多。 若想讓局勢開始改變，先從這一步做起：寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","adv":"寫下：什麼樣的行為會讓我在關係裡感到安心？列三項。","st":"這段時間是你理解自己的重要階段，下一段關係的品質會因此提高。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"下一個進入你生命的人，可能不是你以為的類型，但相處起來比預期的自在。","sa":"列一件只要單身才能自在做的事，把它做完；這段時間的禮物不要浪費。"},{"n":51,"t":"晨霧散去","sub":"單身中","yu":"晨霧會散，不是因為你追趕它，而是太陽終究升起。","jie":"這次以單身中來讀「晨霧散去」：有些關係的真相需要時間，而不是更多試探。你現在可能很想立刻知道答案，但過度追問只會讓自己更疲憊。讓互動自然累積，你會更容易看見對方真正的態度。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：今天不測試、不暗示，單純觀察一次對方自然的回應。","adv":"今天不測試、不暗示，單純觀察一次對方自然的回應。","st":"你對感情有認真的期待，不是因為焦慮，而是因為你知道自己值得被認真對待。","rx":"近期有個場合，你若主動展開對話，結果可能超出你的預期。","fw":"下一段感情的條件比之前更成熟，不是因為你降低了標準，而是你更了解自己。","sa":"試著去一個你從來沒去過的地方或活動，打破熟悉的圈子。"},{"n":52,"t":"未寄的信","sub":"單身中","yu":"有些話寫下來，是為了讓自己聽見，不一定非得送到誰手裡。","jie":"「未寄的信」落在單身中這個問題上，重點是：你心裡可能堆著很多想說的話。表達很重要，但不是每一份情緒都必須立刻交給對方承接。先理解自己真正想被看見的是什麼，再決定是否開口。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","adv":"寫一封不必寄出的信，最後圈出你真正想讓對方知道的一句話。","st":"你可能正在不自覺地對感情保持距離，用忙碌或「時候未到」保護自己。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"下一個進入你生命的人，可能不是你以為的類型，但相處起來比預期的自在。","sa":"讓你欣賞的人知道你欣賞他們，不一定是表白，而是真誠的一句話。"},{"n":53,"t":"並肩的路","sub":"單身中","yu":"真正同行的人，不只在終點等你，也願意調整腳步與你並肩。","jie":"若把「並肩的路」放進你現在的單身中處境，籤意會更直接：你也許正在判斷一段關係是否值得繼續。比起甜言蜜語，更值得觀察的是雙方能否協調生活、處理差異，並在不舒服時仍願意溝通。 近期若有人靠近，不必急著定義。給彼此幾次真實相處的機會；好的緣分會讓不確定逐漸減少，而不是越來越多。 若想讓局勢開始改變，先從這一步做起：回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","adv":"回想最近一次意見不同：你們是在解決問題，還是在分輸贏？","st":"可能有人已對你有好感，但因為某些現實或個性因素，還沒主動表示。","rx":"透過共同朋友或日常活動，有遇到合適對象的可能性在上升。","fw":"下一段感情的條件比之前更成熟，不是因為你降低了標準，而是你更了解自己。","sa":"讓你欣賞的人知道你欣賞他們，不一定是表白，而是真誠的一句話。"},{"n":54,"t":"蝶停掌心","sub":"單身中","yu":"蝴蝶願意停留時，不需要用手把它困住。","jie":"你問的是單身中，而「蝶停掌心」先指出一件事：喜歡容易帶來佔有與不安，但親密不是控制。這支籤提醒你，好的關係應該讓兩個人都有呼吸的空間。能自由留下的，比被勉強留下的更有意義。 這支籤的桃花不在「趕快遇見」，而在「辨認適合」。近期遇到的人，先看相處後你是否更自在，而不是只看心跳多快。 比起繼續猜，這支籤更希望你實際做的是：今天給彼此一點空間，把注意力放回自己的生活。","adv":"今天給彼此一點空間，把注意力放回自己的生活。","st":"比起渴望有人，你更渴望一段讓你放鬆的關係，這個要求並不過分。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"如果你最近在某個固定的地方或活動圈，可以多給它一些時間。","sa":"你現在的生活若讓你滿意，感情自然會找到空間進來；若不滿意，先從這裡修。"},{"n":55,"t":"雨中共傘","sub":"單身中","yu":"一把傘不必遮住整場雨，只要兩個人都願意往中間靠。","jie":"在單身中的脈絡裡，「雨中共傘」不是抽象的安慰。關係遇到困難並不可怕，重要的是雙方是否願意一起承擔。你不需要一個永遠不出問題的人，而是一個問題出現時仍願意和你站在同一邊的人。 新緣分有機會從原本不特別浪漫的場合長出來，例如朋友、工作、興趣或重複出現的生活圈。保持開放即可。 把答案帶回現實的方法是：想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","adv":"想想目前的困難：這是「我們一起面對」，還是「只有我在處理」？","st":"這段單身期讓你更清楚自己不要什麼，下一段感情的方向比以前更明確。","rx":"你對某些人的直覺評估其實很準；信任你的第一印象。","fw":"接下來一到三個月，若你增加社交的廣度，遇到合適的人機率明顯上升。","sa":"試著去一個你從來沒去過的地方或活動，打破熟悉的圈子。"},{"n":56,"t":"紅線鬆結","sub":"單身中","yu":"緣分不是繩索；真正相連的兩端，不需要勒痛彼此。","jie":"這次以單身中來讀「紅線鬆結」：你可能把堅持視為深情，但如果一段關係長期讓你縮小自己、害怕表達或反覆受傷，就值得重新檢視。愛可以需要磨合，卻不應以失去自己為代價。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：寫下一個你不願再為任何關係犧牲的界線。","adv":"寫下一個你不願再為任何關係犧牲的界線。","st":"你可能正在不自覺地對感情保持距離，用忙碌或「時候未到」保護自己。","rx":"有人可能已在觀察你，只是你還沒有注意到他們在注意你。","fw":"如果你最近在某個固定的地方或活動圈，可以多給它一些時間。","sa":"你現在的生活若讓你滿意，感情自然會找到空間進來；若不滿意，先從這裡修。"},{"n":57,"t":"月下來客","sub":"單身中","yu":"有人走進你的夜色，不一定為了帶走孤單，也可能只是提醒你仍能心動。","jie":"「月下來客」落在單身中這個問題上，重點是：新的相遇正在提醒你：你仍有感受、靠近與被理解的能力。不必急著判斷這是不是命定關係，先允許一段互動保持輕盈。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","adv":"今天若有人讓你感到舒服，就真誠回應，不急著預測後續。","st":"可能有人已對你有好感，但因為某些現實或個性因素，還沒主動表示。","rx":"透過共同朋友或日常活動，有遇到合適對象的可能性在上升。","fw":"不是沒有機會，而是之前遇到的都不夠好；接下來的可能性品質會高一點。","sa":"讓你欣賞的人知道你欣賞他們，不一定是表白，而是真誠的一句話。"},{"n":58,"t":"潮汐相認","sub":"單身中","yu":"海岸不追逐潮水，潮水也知道何時回來。","jie":"若把「潮汐相認」放進你現在的單身中處境，籤意會更直接：穩定的關係不需要靠不停確認維持。如果一個人只有在你追趕時才靠近，你需要看的不是自己還能多努力，而是這份互動本身是否平衡。 近期若有人靠近，不必急著定義。給彼此幾次真實相處的機會；好的緣分會讓不確定逐漸減少，而不是越來越多。 若想讓局勢開始改變，先從這一步做起：今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","adv":"今天停止一次主動追趕，看看關係是否仍會自然向你靠近。","st":"可能有人已對你有好感，但因為某些現實或個性因素，還沒主動表示。","rx":"周圍可能有人對你有好感，但用很自然的方式靠近，不動聲色。","fw":"有緣分在前面，但時間點你控制不了；你能控制的是讓自己保持開放的狀態。","sa":"不需要主動尋找，但也不要拒絕被找；先把自己的狀態調整好，機會自己會來。"},{"n":59,"t":"鏡中花","sub":"單身中","yu":"你愛上的若只是想像，再美的花也無法真正被觸碰。","jie":"你問的是單身中，而「鏡中花」先指出一件事：你可能把期待、潛力或過去的美好投射在一個人身上。這支籤提醒你，把「他可能成為誰」與「他現在是誰」分開，會更接近真實。 這支籤的桃花不在「趕快遇見」，而在「辨認適合」。近期遇到的人，先看相處後你是否更自在，而不是只看心跳多快。 比起繼續猜，這支籤更希望你實際做的是：列出對方現在實際具備的三個特質，不寫「也許以後」。","adv":"列出對方現在實際具備的三個特質，不寫「也許以後」。","st":"你已具備讓感情走遠的條件，但還在等一個對的起始點，而不是隨便一個開始。","rx":"近期有個場合，你若主動展開對話，結果可能超出你的預期。","fw":"下一段感情的條件比之前更成熟，不是因為你降低了標準，而是你更了解自己。","sa":"你現在的生活若讓你滿意，感情自然會找到空間進來；若不滿意，先從這裡修。"},{"n":60,"t":"暖燈","sub":"單身中","yu":"真正的靠近，不一定耀眼；有時只是你回頭時，那盞燈一直都在。","jie":"在單身中的脈絡裡，「暖燈」不是抽象的安慰。你可能習慣被強烈情緒吸引，卻忽略穩定的善意。長久關係往往藏在一致、可靠與願意回應的細節裡。平靜不一定代表無聊，也可能代表安全。 新緣分有機會從原本不特別浪漫的場合長出來，例如朋友、工作、興趣或重複出現的生活圈。保持開放即可。 把答案帶回現實的方法是：留意今天誰用一個小行動讓你感到被照顧。","adv":"留意今天誰用一個小行動讓你感到被照顧。","st":"這段單身期讓你更清楚自己不要什麼，下一段感情的方向比以前更明確。","rx":"可能在某個不那麼刻意的場合，遇到讓你多看一眼的人。","fw":"外表的改變（造型、氣色）和你的吸引力之間有直接關係，這段時間值得投資自己。","sa":"如果有人想介紹，先見一次；一次就夠你判斷，不去的話永遠不知道。"},{"n":61,"t":"花開兩處","sub":"單身中","yu":"兩朵花可以彼此喜歡，也仍需要各自的土壤與陽光。","jie":"這次以單身中來讀「花開兩處」：親密並不要求兩個人變成同一個人。保有朋友、興趣、目標與獨處空間，反而能讓關係更有生命力。這支籤提醒你，不要把全部的自己交給一段關係定義。 籤意要你先鬆開對特定類型或劇情的執著。下一段關係可能不像你預想的樣子，卻更穩、更能被好好回應。 給你的行動提示是：今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","adv":"今天做一件只屬於你、不是以伴侶或喜歡的人為中心的事。","st":"這段單身期讓你更清楚自己不要什麼，下一段感情的方向比以前更明確。","rx":"某個你以為只是朋友的人，可能對你的態度正在悄悄改變。","fw":"不是沒有機會，而是之前遇到的都不夠好；接下來的可能性品質會高一點。","sa":"不需要主動尋找，但也不要拒絕被找；先把自己的狀態調整好，機會自己會來。"},{"n":62,"t":"星光有期","sub":"單身中","yu":"不是所有錯過都叫遺憾，有些只是彼此抵達的時間不同。","jie":"「星光有期」落在單身中這個問題上，重點是：你可能在想「如果早一點、晚一點會不會不同」。但關係除了感情，也需要時機與現實條件。接受當下的限制，不代表否定曾經的心意。 現在適合把生活過得有內容，而不是把等待桃花當成主線。當你有自己的節奏，反而更容易辨認誰真的適合加入。 今天可以先做一件很具體的事：把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","adv":"把一個反覆出現的「如果當時」改寫成「現在我能做的是」。","st":"比起渴望有人，你更渴望一段讓你放鬆的關係，這個要求並不過分。","rx":"周圍可能有人對你有好感，但用很自然的方式靠近，不動聲色。","fw":"不是沒有機會，而是之前遇到的都不夠好；接下來的可能性品質會高一點。","sa":"如果有人想介紹，先見一次；一次就夠你判斷，不去的話永遠不知道。"}],"work":[{"n":14,"t":"霧裡的燈","sub":"迷惘中","yu":"霧沒有帶走道路，只是讓你暫時看不見遠方；今夜看清下一步就夠了。","jie":"這次以迷惘中來讀「霧裡的燈」：你可能因為看不清長期方向而焦慮。其實很多職涯答案不是想出來的，而是在行動後逐漸變清楚。先完成一個可驗證的小步驟，比逼自己立刻決定未來更有幫助。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：選一件30分鐘內能完成、且能讓事情往前的工作，先做它。","adv":"選一件30分鐘內能完成、且能讓事情往前的工作，先做它。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"有人在等你做決定之後才會告訴你他們的意見，所以先做，才能得到更多資訊。","fw":"你現在面對的困境，六個月後回看，可能會是你做過最好的一個轉折點。","sa":"今天做一件你一直說「以後再說」的工作相關的事；明天永遠比今天容易拖延。"},{"n":15,"t":"星火","sub":"迷惘中","yu":"微光雖小，也足以告訴你火從哪裡開始。","jie":"「星火」落在迷惘中這個問題上，重點是：你現在可能覺得自己的能力或成果還不夠大。但這支籤提醒你，值得發展的方向往往先以小小的興趣、稱讚或成果出現。不要因為它還不成熟就忽略它。 這支籤不要求你立刻選出一生的方向。先找「下一個值得驗證的方向」，用一個小專案、一次訪談或一門課換取真實資訊。 給你的行動提示是：找出最近一件你做得特別順、也被肯定的事情，記下其中使用了什麼能力。","adv":"找出最近一件你做得特別順、也被肯定的事情，記下其中使用了什麼能力。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"你的某個行動或輸出，已在某個你不知道的地方留下了好的印象。","fw":"若你持續做你現在在做的事，一年後的狀態和現在差不多；需要一個系統性的改變。","sa":"你身邊有一個比你更早走過這條路的人，去問他們走到你現在這一步時，他們做了什麼。"},{"n":16,"t":"逆風之帆","sub":"迷惘中","yu":"逆風不是命令你停下，而是要求你重新調整帆的角度。","jie":"若把「逆風之帆」放進你現在的迷惘中處境，籤意會更直接：眼前的阻力未必表示方向完全錯誤，也可能是方法需要調整。與其一味增加努力，不如辨認真正卡住你的因素：資源、能力、溝通，還是環境本身。 你現在的迷惘可能不是能力不足，而是選項太多。先排除明確不要的，再看哪條路能同時累積能力與生活品質。 今天可以先做一件很具體的事：把目前最大的工作阻力寫成一句具體問題，避免只寫「很煩」或「做不到」。","adv":"把目前最大的工作阻力寫成一句具體問題，避免只寫「很煩」或「做不到」。","st":"外部的比較（別人的薪水、職稱、速度）正在影響你對自己的評估，但那是他們的路。","rx":"身邊某個你信任的人，對你目前的狀況可能有一個你沒想過的看法，可以試著問。","fw":"外部環境的變化正在製造一個你目前還不完全看見的機會；保持資訊更新的習慣。","sa":"把你的目標從「模糊的理想」改成「三個月內可以完成的具體事」，從那裡開始。"},{"n":17,"t":"門縫有光","sub":"迷惘中","yu":"門還沒有完全打開，但光已經從縫裡進來。","jie":"你問的是迷惘中，而「門縫有光」先指出一件事：新的機會可能正在形成，只是還沒有成熟到能被明確看見。這支籤適合提醒你保持準備，而不是被動等待。當機會真的出現時，你是否已經有作品、能力或資料可以接住它？ 籤意偏向先整理再決定。把「我討厭現在什麼」和「我真正想靠近什麼」分開寫，答案會比單純想離開更清楚。 若想讓局勢開始改變，先從這一步做起：今天整理一項能代表你的成果，讓它成為隨時可以拿出去的作品。","adv":"今天整理一項能代表你的成果，讓它成為隨時可以拿出去的作品。","st":"下一步最重要的不是決定對不對，而是先開始動，然後根據反饋調整。","rx":"有人在等你做決定之後才會告訴你他們的意見，所以先做，才能得到更多資訊。","fw":"目前的不確定感是真實的，但它的有效期不長；接下來有個事件會讓方向清晰。","sa":"找一個比你更資深的人，把你的困境說清楚，然後問他們遇到這樣的情況會怎麼做。"},{"n":18,"t":"山不催人","sub":"迷惘中","yu":"山一直在那裡，真正改變高度的，是你每天走過的那一小段路。","jie":"在迷惘中的脈絡裡，「山不催人」不是抽象的安慰。你可能因為進度不夠快而否定自己。這支籤提醒你，長期能力與事業往往靠累積，而不是一次突破。不要只看距離終點還有多遠，也看看自己已經走了多少。 方向感會從行動中長出來。與其再想一百遍，不如做一次低成本嘗試；做完之後的感受，會比想像更可靠。 比起繼續猜，這支籤更希望你實際做的是：記錄最近三個月你多會了什麼，即使只是很小的技能。","adv":"記錄最近三個月你多會了什麼，即使只是很小的技能。","st":"你的直覺告訴你現在的路不太對，而直覺通常在你的意識之前就已看清。","rx":"周圍的人可能比你意識到的更願意幫你，只是你沒有開口問。","fw":"下一個重要的里程碑，可能比你預期的更快到達，但需要你現在做一件準備的事。","sa":"如果你的理想方向需要一個新的技能，今天花三十分鐘找出最短的學習路徑。"},{"n":19,"t":"換一扇窗","sub":"迷惘中","yu":"房間沒有變，但換一扇窗，看到的世界就不同了。","jie":"這次以迷惘中來讀「換一扇窗」：有時你需要的不是立刻換工作，而是先換一種做法、合作方式或觀看問題的角度。先測試小改變，可以幫助你判斷真正需要離開的是職位、環境，還是目前的方法。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：挑一個最困擾你的工作流程，想一個完全不同的處理方式並試一次。","adv":"挑一個最困擾你的工作流程，想一個完全不同的處理方式並試一次。","st":"你目前的狀態需要一個停下來整理的時間，不是因為走錯了，而是走太快看不清方向了。","rx":"你若主動找一個你尊重的人問意見，對方給的答案可能讓你豁然開朗。","fw":"有一件你一直想做但一直用「條件不夠」擱置的事，現在的條件其實比你以為的足夠。","sa":"先寫下你不想做的事，再從剩下的選項裡找，比從全部選項裡選更快。"},{"n":20,"t":"鐘聲將響","sub":"迷惘中","yu":"鐘還沒響，不代表時間沒有前進。","jie":"「鐘聲將響」落在迷惘中這個問題上，重點是：你可能正在等待回覆、升遷、面試結果或某個重要決定。等待期間最容易把注意力全部交給別人。這支籤提醒你，把能控制的部分拿回來，繼續為下一個可能性準備。 這支籤不要求你立刻選出一生的方向。先找「下一個值得驗證的方向」，用一個小專案、一次訪談或一門課換取真實資訊。 給你的行動提示是：今天做一件即使結果不如預期，也仍然對你有幫助的準備。","adv":"今天做一件即使結果不如預期，也仍然對你有幫助的準備。","st":"你目前的狀態需要一個停下來整理的時間，不是因為走錯了，而是走太快看不清方向了。","rx":"你若主動找一個你尊重的人問意見，對方給的答案可能讓你豁然開朗。","fw":"接下來的一到三個月，若你能做出一個具體的行動（而不是計劃），就會有明顯進展。","sa":"如果你的理想方向需要一個新的技能，今天花三十分鐘找出最短的學習路徑。"},{"n":21,"t":"石中之玉","sub":"迷惘中","yu":"尚未被看見的價值，不等於不存在。","jie":"若把「石中之玉」放進你現在的迷惘中處境，籤意會更直接：如果你的努力暫時沒有得到相稱的回應，不必立刻把它理解成自己沒有能力。但價值也需要被清楚呈現。這支籤提醒你，同時培養能力與表達成果的方式。 你現在的迷惘可能不是能力不足，而是選項太多。先排除明確不要的，再看哪條路能同時累積能力與生活品質。 今天可以先做一件很具體的事：把一項工作成果改寫成「我解決了什麼問題、帶來什麼結果」。","adv":"把一項工作成果改寫成「我解決了什麼問題、帶來什麼結果」。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"你的決定若說出來，可能得到比預期更多的支持；你擔心的反應不一定會發生。","fw":"接下來的一到三個月，若你能做出一個具體的行動（而不是計劃），就會有明顯進展。","sa":"今天做一件你一直說「以後再說」的工作相關的事；明天永遠比今天容易拖延。"},{"n":22,"t":"渡口","sub":"迷惘中","yu":"船來之前，先確認你真正想去的是哪一岸。","jie":"你問的是迷惘中，而「渡口」先指出一件事：轉職或重大職涯選擇容易讓人只關注「離開現在」，卻忘了定義「想去哪裡」。這支籤提醒你，逃離不舒服與走向想要的生活，是兩件不同的事。 籤意偏向先整理再決定。把「我討厭現在什麼」和「我真正想靠近什麼」分開寫，答案會比單純想離開更清楚。 若想讓局勢開始改變，先從這一步做起：列出下一份工作一定要有的三個條件，以及不能接受的三件事。","adv":"列出下一份工作一定要有的三個條件，以及不能接受的三件事。","st":"正在重新評估「成功」對你的定義；這個思考過程比你以為的更重要。","rx":"某個你覺得和這件事無關的人，可能意外地成為你的重要資源。","fw":"下一個重要的里程碑，可能比你預期的更快到達，但需要你現在做一件準備的事。","sa":"你目前最需要的不是更多選項，而是把現有的選項說得更清楚；寫下來再看。"},{"n":23,"t":"慢火","sub":"迷惘中","yu":"有些東西不能用大火催熟，火太急，反而失去原本的味道。","jie":"在迷惘中的脈絡裡，「慢火」不是抽象的安慰。你可能想快速證明自己或追上別人，但某些能力需要時間形成。這支籤提醒你，速度不是唯一的衡量方式。穩定、可持續的成長，往往比短期燃燒更重要。 方向感會從行動中長出來。與其再想一百遍，不如做一次低成本嘗試；做完之後的感受，會比想像更可靠。 比起繼續猜，這支籤更希望你實際做的是：今天替自己設定一個可以持續四週的小型學習計畫。","adv":"今天替自己設定一個可以持續四週的小型學習計畫。","st":"正在重新評估「成功」對你的定義；這個思考過程比你以為的更重要。","rx":"有人在等你做決定之後才會告訴你他們的意見，所以先做，才能得到更多資訊。","fw":"有一件你一直想做但一直用「條件不夠」擱置的事，現在的條件其實比你以為的足夠。","sa":"先寫下你不想做的事，再從剩下的選項裡找，比從全部選項裡選更快。"},{"n":24,"t":"風起之前","sub":"迷惘中","yu":"旗幟尚未飄動時，先把繩結綁好。","jie":"這次以迷惘中來讀「風起之前」：平靜期很適合準備。當事情還沒有非常忙、機會也還沒有正式出現時，反而是整理流程、作品與能力的最好時刻。不要等風來了才開始找帆。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：整理一份未來可能會用到的履歷、作品或提案素材。","adv":"整理一份未來可能會用到的履歷、作品或提案素材。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"你若主動找一個你尊重的人問意見，對方給的答案可能讓你豁然開朗。","fw":"若你持續做你現在在做的事，一年後的狀態和現在差不多；需要一個系統性的改變。","sa":"你目前最需要的不是更多選項，而是把現有的選項說得更清楚；寫下來再看。"},{"n":25,"t":"留下痕跡","sub":"迷惘中","yu":"做過的事情若沒有留下痕跡，很容易連自己都忘記走了多遠。","jie":"「留下痕跡」落在迷惘中這個問題上，重點是：你可能累積了很多工作，但沒有系統整理，因此在需要證明能力時反而說不清楚。這支籤提醒你開始建立自己的成果紀錄。 這支籤不要求你立刻選出一生的方向。先找「下一個值得驗證的方向」，用一個小專案、一次訪談或一門課換取真實資訊。 給你的行動提示是：建立一份「完成清單」，今天先記錄最近五項成果。","adv":"建立一份「完成清單」，今天先記錄最近五項成果。","st":"有個關於工作的決定，你拖了一段時間，而拖著不決定也是一種決定。","rx":"某個你覺得和這件事無關的人，可能意外地成為你的重要資源。","fw":"下一個重要的里程碑，可能比你預期的更快到達，但需要你現在做一件準備的事。","sa":"把「我不知道」換成「我不知道，但我可以先做這件事來找出答案」。"},{"n":26,"t":"北星","sub":"迷惘中","yu":"方向不必一直改，只因為別人的船走得比較快。","jie":"若把「北星」放進你現在的迷惘中處境，籤意會更直接：比較容易讓你懷疑自己的路。這支籤提醒你，別人的速度、職稱與收入可以參考，但不能完全取代你的價值排序。你需要的是自己的北極星。 你現在的迷惘可能不是能力不足，而是選項太多。先排除明確不要的，再看哪條路能同時累積能力與生活品質。 今天可以先做一件很具體的事：寫下工作對你最重要的三件事，並排出順序。","adv":"寫下工作對你最重要的三件事，並排出順序。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"你若主動找一個你尊重的人問意見，對方給的答案可能讓你豁然開朗。","fw":"你現在面對的困境，六個月後回看，可能會是你做過最好的一個轉折點。","sa":"找一個比你更資深的人，把你的困境說清楚，然後問他們遇到這樣的情況會怎麼做。"},{"n":63,"t":"磨亮的刃","sub":"迷惘中","yu":"刀鋒不是在掌聲裡變利，而是在一次次磨過之後。","jie":"在迷惘中的脈絡裡，「磨亮的刃」不是抽象的安慰。你正在累積一項還沒有立刻被看見的能力。重複練習可能枯燥，但專業往往就在這些不起眼的次數裡形成。不要只追求新的刺激，也要留下時間深化核心能力。 方向感會從行動中長出來。與其再想一百遍，不如做一次低成本嘗試；做完之後的感受，會比想像更可靠。 比起繼續猜，這支籤更希望你實際做的是：選一項最值得長期累積的技能，今天專注練習25分鐘。","adv":"選一項最值得長期累積的技能，今天專注練習25分鐘。","st":"正在重新評估「成功」對你的定義；這個思考過程比你以為的更重要。","rx":"某個合作或機會的提議，可能在你沒特別期待的時候忽然出現。","fw":"有一件你一直想做但一直用「條件不夠」擱置的事，現在的條件其實比你以為的足夠。","sa":"找一個比你更資深的人，把你的困境說清楚，然後問他們遇到這樣的情況會怎麼做。"},{"n":64,"t":"暗潮","sub":"迷惘中","yu":"水面平靜時，潮流仍在改變方向。","jie":"這次以迷惘中來讀「暗潮」：工作環境裡可能正在發生尚未明說的變化。與其被猜測拖著走，不如留意具體訊號並替自己準備備案。準備不是悲觀，而是保留選擇權。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：列出目前職場中三個可觀察的變化，只記錄事實，不下結論。","adv":"列出目前職場中三個可觀察的變化，只記錄事實，不下結論。","st":"外部的比較（別人的薪水、職稱、速度）正在影響你對自己的評估，但那是他們的路。","rx":"周圍的人可能比你意識到的更願意幫你，只是你沒有開口問。","fw":"有一件你一直想做但一直用「條件不夠」擱置的事，現在的條件其實比你以為的足夠。","sa":"把「我不知道」換成「我不知道，但我可以先做這件事來找出答案」。"},{"n":65,"t":"借風","sub":"迷惘中","yu":"會航海的人，不只靠自己的力氣，也懂得辨認可以借用的風。","jie":"「借風」落在迷惘中這個問題上，重點是：你不必所有事情都獨自完成。工具、同事、資源與合作都可能讓成果更好。求助並不會削弱能力，知道何時借力也是專業的一部分。 這支籤不要求你立刻選出一生的方向。先找「下一個值得驗證的方向」，用一個小專案、一次訪談或一門課換取真實資訊。 給你的行動提示是：找一件卡住的事，今天向一個適合的人提出具體問題。","adv":"找一件卡住的事，今天向一個適合的人提出具體問題。","st":"你目前的狀態需要一個停下來整理的時間，不是因為走錯了，而是走太快看不清方向了。","rx":"你的某個行動或輸出，已在某個你不知道的地方留下了好的印象。","fw":"外部環境的變化正在製造一個你目前還不完全看見的機會；保持資訊更新的習慣。","sa":"找一個比你更資深的人，把你的困境說清楚，然後問他們遇到這樣的情況會怎麼做。"},{"n":66,"t":"高塔之窗","sub":"迷惘中","yu":"站得更高，不只是看得更遠，也會看見原本忽略的全貌。","jie":"若把「高塔之窗」放進你現在的迷惘中處境，籤意會更直接：你可能太靠近眼前的任務，以至於忘了它真正服務的目標。這支籤提醒你偶爾跳出執行層，理解需求、使用者與整體策略，會讓你的判斷更成熟。 你現在的迷惘可能不是能力不足，而是選項太多。先排除明確不要的，再看哪條路能同時累積能力與生活品質。 今天可以先做一件很具體的事：替今天最重要的工作回答一句：它最終要解決誰的什麼問題？","adv":"替今天最重要的工作回答一句：它最終要解決誰的什麼問題？","st":"你在某個領域的積累已比你自己知道的更多，只是還沒找到最好的出口。","rx":"有人在等你做決定之後才會告訴你他們的意見，所以先做，才能得到更多資訊。","fw":"有一件你一直想做但一直用「條件不夠」擱置的事，現在的條件其實比你以為的足夠。","sa":"把你的目標從「模糊的理想」改成「三個月內可以完成的具體事」，從那裡開始。"},{"n":67,"t":"種子庫","sub":"迷惘中","yu":"不是每顆種子今天都要發芽，但值得的種子要先保存。","jie":"你問的是迷惘中，而「種子庫」先指出一件事：靈感、企劃、人脈與學習素材若沒有整理，很容易在需要時找不到。你現在適合建立自己的資源庫，讓零散累積在未來成為可用的資產。 籤意偏向先整理再決定。把「我討厭現在什麼」和「我真正想靠近什麼」分開寫，答案會比單純想離開更清楚。 若想讓局勢開始改變，先從這一步做起：建立一個資料夾，收進最近五個值得保留的靈感或成果。","adv":"建立一個資料夾，收進最近五個值得保留的靈感或成果。","st":"你在某個領域的積累已比你自己知道的更多，只是還沒找到最好的出口。","rx":"周圍的人可能比你意識到的更願意幫你，只是你沒有開口問。","fw":"你最在意的那個目標，還沒放棄的可能性。它只是需要一個不同的入口。","sa":"如果你的理想方向需要一個新的技能，今天花三十分鐘找出最短的學習路徑。"},{"n":68,"t":"退潮見礁","sub":"迷惘中","yu":"水退之後，才看得見一直藏在下面的石頭。","jie":"在迷惘中的脈絡裡，「退潮見礁」不是抽象的安慰。當忙碌暫停或事情出錯時，真正的流程問題往往才浮現。不要急著把錯誤遮過去，它可能正在指出值得改善的地方。 方向感會從行動中長出來。與其再想一百遍，不如做一次低成本嘗試；做完之後的感受，會比想像更可靠。 比起繼續猜，這支籤更希望你實際做的是：挑一個最近的小失誤，寫下造成它的流程原因，而不是責怪某個人。","adv":"挑一個最近的小失誤，寫下造成它的流程原因，而不是責怪某個人。","st":"有個關於工作的決定，你拖了一段時間，而拖著不決定也是一種決定。","rx":"周圍的人可能比你意識到的更願意幫你，只是你沒有開口問。","fw":"接下來的一到三個月，若你能做出一個具體的行動（而不是計劃），就會有明顯進展。","sa":"把「我不知道」換成「我不知道，但我可以先做這件事來找出答案」。"},{"n":69,"t":"新枝","sub":"迷惘中","yu":"老樹長出新枝，不需要先否定過去的年輪。","jie":"這次以迷惘中來讀「新枝」：你可能想轉換方向，又擔心以前累積的經驗浪費。其實轉型通常不是從零開始，而是重新組合既有能力。你走過的路仍然可以成為新方向的養分。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：寫下三項舊經驗，分別想一個能帶到新方向的用途。","adv":"寫下三項舊經驗，分別想一個能帶到新方向的用途。","st":"你目前的狀態需要一個停下來整理的時間，不是因為走錯了，而是走太快看不清方向了。","rx":"有人在等你做決定之後才會告訴你他們的意見，所以先做，才能得到更多資訊。","fw":"目前的不確定感是真實的，但它的有效期不長；接下來有個事件會讓方向清晰。","sa":"找一個比你更資深的人，把你的困境說清楚，然後問他們遇到這樣的情況會怎麼做。"},{"n":70,"t":"界線","sub":"迷惘中","yu":"門的存在不是拒絕所有人，而是讓你決定什麼時候開門。","jie":"「界線」落在迷惘中這個問題上，重點是：工作責任若沒有界線，很容易無限擴張。這支籤提醒你，可靠不等於永遠答應。清楚說明時間、範圍與優先順序，反而能保護工作的品質。 這支籤不要求你立刻選出一生的方向。先找「下一個值得驗證的方向」，用一個小專案、一次訪談或一門課換取真實資訊。 給你的行動提示是：今天對一件新增需求確認期限、範圍或優先順序，不直接全盤接下。","adv":"今天對一件新增需求確認期限、範圍或優先順序，不直接全盤接下。","st":"你的直覺告訴你現在的路不太對，而直覺通常在你的意識之前就已看清。","rx":"你的決定若說出來，可能得到比預期更多的支持；你擔心的反應不一定會發生。","fw":"目前的不確定感是真實的，但它的有效期不長；接下來有個事件會讓方向清晰。","sa":"把你的目標從「模糊的理想」改成「三個月內可以完成的具體事」，從那裡開始。"},{"n":71,"t":"金線","sub":"迷惘中","yu":"散落的珠子有了線，才會成為一串完整的飾物。","jie":"若把「金線」放進你現在的迷惘中處境，籤意會更直接：你可能做了很多事，但彼此看起來零散。試著找出其中共同的能力、主題或價值，會幫助你建立更清楚的職涯敘事。 你現在的迷惘可能不是能力不足，而是選項太多。先排除明確不要的，再看哪條路能同時累積能力與生活品質。 今天可以先做一件很具體的事：把三個代表作品放在一起，找出它們共同展現的一項能力。","adv":"把三個代表作品放在一起，找出它們共同展現的一項能力。","st":"正在重新評估「成功」對你的定義；這個思考過程比你以為的更重要。","rx":"某個你覺得和這件事無關的人，可能意外地成為你的重要資源。","fw":"外部環境的變化正在製造一個你目前還不完全看見的機會；保持資訊更新的習慣。","sa":"你身邊有一個比你更早走過這條路的人，去問他們走到你現在這一步時，他們做了什麼。"},{"n":72,"t":"燈塔不走","sub":"迷惘中","yu":"燈塔不追船，它只是把自己的光照得足夠清楚。","jie":"你問的是迷惘中，而「燈塔不走」先指出一件事：你不必不停證明自己才能被看見。比起追逐所有機會，更有效的是讓自己的專長、成果與定位清楚可辨，讓適合的合作知道如何找到你。 籤意偏向先整理再決定。把「我討厭現在什麼」和「我真正想靠近什麼」分開寫，答案會比單純想離開更清楚。 若想讓局勢開始改變，先從這一步做起：用一句話寫出：別人最適合因為什麼事情來找我？","adv":"用一句話寫出：別人最適合因為什麼事情來找我？","st":"有個關於工作的決定，你拖了一段時間，而拖著不決定也是一種決定。","rx":"你的決定若說出來，可能得到比預期更多的支持；你擔心的反應不一定會發生。","fw":"你現在面對的困境，六個月後回看，可能會是你做過最好的一個轉折點。","sa":"把「我不知道」換成「我不知道，但我可以先做這件事來找出答案」。"},{"n":73,"t":"第二把鑰匙","sub":"迷惘中","yu":"打不開一扇門時，不一定要更用力，也許只是需要另一把鑰匙。","jie":"在迷惘中的脈絡裡，「第二把鑰匙」不是抽象的安慰。當方法反覆失效，繼續加倍投入未必是最佳解。這支籤提醒你換工具、換順序、換溝通方式，甚至重新定義問題。靈活不是放棄，而是提高成功機率。 方向感會從行動中長出來。與其再想一百遍，不如做一次低成本嘗試；做完之後的感受，會比想像更可靠。 比起繼續猜，這支籤更希望你實際做的是：對一個卡關問題提出三種與原方法不同的解法。","adv":"對一個卡關問題提出三種與原方法不同的解法。","st":"你目前的困惑來自於目標和現實的落差，但落差本身是成長的跡象，不是失敗的證明。","rx":"身邊某個你信任的人，對你目前的狀況可能有一個你沒想過的看法，可以試著問。","fw":"你最在意的那個目標，還沒放棄的可能性。它只是需要一個不同的入口。","sa":"把你的目標從「模糊的理想」改成「三個月內可以完成的具體事」，從那裡開始。"},{"n":74,"t":"收帆","sub":"迷惘中","yu":"懂得何時收帆的人，才有力氣迎接下一段風。","jie":"這次以迷惘中來讀「收帆」：長期高強度輸出會讓判斷與創造力下降。休息不是工作之外的獎勵，而是維持專業表現的一部分。若你已經疲憊，今天更適合整理而不是硬衝。 目前適合把職涯拉遠一點看。問自己三年後希望擁有什麼能力、作品與生活，而不是只問下一份工作的職稱。 把答案帶回現實的方法是：替今天設定明確的收工時間，到點就停止新增任務。","adv":"替今天設定明確的收工時間，到點就停止新增任務。","st":"正在重新評估「成功」對你的定義；這個思考過程比你以為的更重要。","rx":"你的決定若說出來，可能得到比預期更多的支持；你擔心的反應不一定會發生。","fw":"你最在意的那個目標，還沒放棄的可能性。它只是需要一個不同的入口。","sa":"如果你的理想方向需要一個新的技能，今天花三十分鐘找出最短的學習路徑。"},{"n":14,"t":"霧裡的燈","sub":"求職中","yu":"霧沒有帶走道路，只是讓你暫時看不見遠方；今夜看清下一步就夠了。","jie":"「霧裡的燈」落在求職中這個問題上，重點是：你可能因為看不清長期方向而焦慮。其實很多職涯答案不是想出來的，而是在行動後逐漸變清楚。先完成一個可驗證的小步驟，比逼自己立刻決定未來更有幫助。 近期求職重點在精準，不在大量亂投。把履歷與作品對準職缺最在意的三件事，會比再增加很多無關內容有效。 若想讓局勢開始改變，先從這一步做起：選一件30分鐘內能完成、且能讓事情往前的工作，先做它。","adv":"選一件30分鐘內能完成、且能讓事情往前的工作，先做它。","st":"目前的求職方向可能太廣或太窄，需要根據近期的回饋做一次調整。","rx":"有一份投出去的履歷，可能在你已經快忘記時突然有了回音。","fw":"接下來四到六週是關鍵期，若沒有進展，需要根本性調整投遞策略，而不是繼續量取勝。","sa":"每天的求職時間控制在三小時以內；超過了效率反而下降，焦慮反而上升。"},{"n":15,"t":"星火","sub":"求職中","yu":"微光雖小，也足以告訴你火從哪裡開始。","jie":"若把「星火」放進你現在的求職中處境，籤意會更直接：你現在可能覺得自己的能力或成果還不夠大。但這支籤提醒你，值得發展的方向往往先以小小的興趣、稱讚或成果出現。不要因為它還不成熟就忽略它。 若目前回覆不多，籤意偏向調整呈現方式，而不是否定能力。讓成果可量化、案例有脈絡，並主動請可信任的人幫你檢視。 比起繼續猜，這支籤更希望你實際做的是：找出最近一件你做得特別順、也被肯定的事情，記下其中使用了什麼能力。","adv":"找出最近一件你做得特別順、也被肯定的事情，記下其中使用了什麼能力。","st":"比較劣勢不在技能，而在如何讓別人快速看見你的優勢；自我介紹的方式值得調整。","rx":"你投遞的某個職缺，目前的進展比你知道的更接近了。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"今天聯絡一個你欣賞的業界前輩，問一個具體的問題，而不是泛泛的「有沒有機會」。"},{"n":16,"t":"逆風之帆","sub":"求職中","yu":"逆風不是命令你停下，而是要求你重新調整帆的角度。","jie":"你問的是求職中，而「逆風之帆」先指出一件事：眼前的阻力未必表示方向完全錯誤，也可能是方法需要調整。與其一味增加努力，不如辨認真正卡住你的因素：資源、能力、溝通，還是環境本身。 機會可能不是從最期待的那一間來。保持多線進行，在收到正式 offer 前，不要因一場聊得很好的面試就停止其他選項。 把答案帶回現實的方法是：把目前最大的工作阻力寫成一句具體問題，避免只寫「很煩」或「做不到」。","adv":"把目前最大的工作阻力寫成一句具體問題，避免只寫「很煩」或「做不到」。","st":"可能正在等一個不完全符合夢想但值得踏進去的入口；有時候起點不完美，路卻是對的。","rx":"你投遞的某個職缺，目前的進展比你知道的更接近了。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"把你的履歷讓一個在你目標產業工作的朋友看，請他說真心話，而不是鼓勵。"},{"n":17,"t":"門縫有光","sub":"求職中","yu":"門還沒有完全打開，但光已經從縫裡進來。","jie":"在求職中的脈絡裡，「門縫有光」不是抽象的安慰。新的機會可能正在形成，只是還沒有成熟到能被明確看見。這支籤適合提醒你保持準備，而不是被動等待。當機會真的出現時，你是否已經有作品、能力或資料可以接住它？ 這支籤適合主動出擊。除了投遞，也可以找內推、直接聯絡用人主管或整理作品公開曝光，讓機會有更多入口。 給你的行動提示是：今天整理一項能代表你的成果，讓它成為隨時可以拿出去的作品。","adv":"今天整理一項能代表你的成果，讓它成為隨時可以拿出去的作品。","st":"求職過程的停滯通常來自訊息不對稱；找到一個在你目標產業工作的人聊一次，比投五份履歷有效。","rx":"你的人脈裡有人正想到你，但還沒確定要不要推薦，需要一個小的推力。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"找出三個你最想去的公司，搞清楚他們的招募窗口在哪裡，比在 104 等更有效。"},{"n":18,"t":"山不催人","sub":"求職中","yu":"山一直在那裡，真正改變高度的，是你每天走過的那一小段路。","jie":"這次以求職中來讀「山不催人」：你可能因為進度不夠快而否定自己。這支籤提醒你，長期能力與事業往往靠累積，而不是一次突破。不要只看距離終點還有多遠，也看看自己已經走了多少。 這支籤提醒你把「被選上」改成「彼此選擇」。面試時除了證明能力，也要確認主管、工作內容與文化是否值得你投入。 今天可以先做一件很具體的事：記錄最近三個月你多會了什麼，即使只是很小的技能。","adv":"記錄最近三個月你多會了什麼，即使只是很小的技能。","st":"比較劣勢不在技能，而在如何讓別人快速看見你的優勢；自我介紹的方式值得調整。","rx":"接下來一到兩週，先收到的回應可能不是最好的；別用第一批結果否定整個方向。","fw":"接下來四到六週是關鍵期，若沒有進展，需要根本性調整投遞策略，而不是繼續量取勝。","sa":"找出你過去最有成就感的一個工作片段，把它轉成一個可以在面試講的完整故事。"},{"n":19,"t":"換一扇窗","sub":"求職中","yu":"房間沒有變，但換一扇窗，看到的世界就不同了。","jie":"「換一扇窗」落在求職中這個問題上，重點是：有時你需要的不是立刻換工作，而是先換一種做法、合作方式或觀看問題的角度。先測試小改變，可以幫助你判斷真正需要離開的是職位、環境，還是目前的方法。 近期求職重點在精準，不在大量亂投。把履歷與作品對準職缺最在意的三件事，會比再增加很多無關內容有效。 若想讓局勢開始改變，先從這一步做起：挑一個最困擾你的工作流程，想一個完全不同的處理方式並試一次。","adv":"挑一個最困擾你的工作流程，想一個完全不同的處理方式並試一次。","st":"求職期的焦慮在消耗你的判斷力；先降低對「完美工作」的執著，把焦點放在「好的開始」。","rx":"有個機會因為時間差而錯開，但還沒真正結束；保持聯絡的管道。","fw":"你的理想目標在一到兩年內可以到達，但起點可能和想像的不一樣。","sa":"面試後二十四小時內寄一封短信給面試官，說一件你面試後想到但沒說完的事。"},{"n":20,"t":"鐘聲將響","sub":"求職中","yu":"鐘還沒響，不代表時間沒有前進。","jie":"若把「鐘聲將響」放進你現在的求職中處境，籤意會更直接：你可能正在等待回覆、升遷、面試結果或某個重要決定。等待期間最容易把注意力全部交給別人。這支籤提醒你，把能控制的部分拿回來，繼續為下一個可能性準備。 若目前回覆不多，籤意偏向調整呈現方式，而不是否定能力。讓成果可量化、案例有脈絡，並主動請可信任的人幫你檢視。 比起繼續猜，這支籤更希望你實際做的是：今天做一件即使結果不如預期，也仍然對你有幫助的準備。","adv":"今天做一件即使結果不如預期，也仍然對你有幫助的準備。","st":"可能正在等一個不完全符合夢想但值得踏進去的入口；有時候起點不完美，路卻是對的。","rx":"接下來一到兩週，先收到的回應可能不是最好的；別用第一批結果否定整個方向。","fw":"你的下一份工作不一定是你申請的，可能是某次對話帶來的意外機會。","sa":"重新寫一版自我介紹，只說「我能為這間公司解決什麼問題」，去掉所有自我描述。"},{"n":21,"t":"石中之玉","sub":"求職中","yu":"尚未被看見的價值，不等於不存在。","jie":"你問的是求職中，而「石中之玉」先指出一件事：如果你的努力暫時沒有得到相稱的回應，不必立刻把它理解成自己沒有能力。但價值也需要被清楚呈現。這支籤提醒你，同時培養能力與表達成果的方式。 機會可能不是從最期待的那一間來。保持多線進行，在收到正式 offer 前，不要因一場聊得很好的面試就停止其他選項。 把答案帶回現實的方法是：把一項工作成果改寫成「我解決了什麼問題、帶來什麼結果」。","adv":"把一項工作成果改寫成「我解決了什麼問題、帶來什麼結果」。","st":"求職期的焦慮在消耗你的判斷力；先降低對「完美工作」的執著，把焦點放在「好的開始」。","rx":"面試中展現的某一個特質，可能讓你在競爭者中留下獨特印象。","fw":"最近三個月內有具體機會，但需要你主動推進，而不是被動等待。","sa":"把你的履歷讓一個在你目標產業工作的朋友看，請他說真心話，而不是鼓勵。"},{"n":22,"t":"渡口","sub":"求職中","yu":"船來之前，先確認你真正想去的是哪一岸。","jie":"在求職中的脈絡裡，「渡口」不是抽象的安慰。轉職或重大職涯選擇容易讓人只關注「離開現在」，卻忘了定義「想去哪裡」。這支籤提醒你，逃離不舒服與走向想要的生活，是兩件不同的事。 這支籤適合主動出擊。除了投遞，也可以找內推、直接聯絡用人主管或整理作品公開曝光，讓機會有更多入口。 給你的行動提示是：列出下一份工作一定要有的三個條件，以及不能接受的三件事。","adv":"列出下一份工作一定要有的三個條件，以及不能接受的三件事。","st":"目前的求職方向可能太廣或太窄，需要根據近期的回饋做一次調整。","rx":"某個你覺得不理想的機會，主動聯繫後，條件可能比公告的更有彈性。","fw":"你的理想目標在一到兩年內可以到達，但起點可能和想像的不一樣。","sa":"把這週的投遞數量減半，把省下的時間花在把每一份客製化到位。"},{"n":23,"t":"慢火","sub":"求職中","yu":"有些東西不能用大火催熟，火太急，反而失去原本的味道。","jie":"這次以求職中來讀「慢火」：你可能想快速證明自己或追上別人，但某些能力需要時間形成。這支籤提醒你，速度不是唯一的衡量方式。穩定、可持續的成長，往往比短期燃燒更重要。 這支籤提醒你把「被選上」改成「彼此選擇」。面試時除了證明能力，也要確認主管、工作內容與文化是否值得你投入。 今天可以先做一件很具體的事：今天替自己設定一個可以持續四週的小型學習計畫。","adv":"今天替自己設定一個可以持續四週的小型學習計畫。","st":"履歷已傳達出一定的專業度，現在的問題不是品質，而是精準度——是否打到了正確的機會。","rx":"某個你覺得不理想的機會，主動聯繫後，條件可能比公告的更有彈性。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"重新寫一版自我介紹，只說「我能為這間公司解決什麼問題」，去掉所有自我描述。"},{"n":24,"t":"風起之前","sub":"求職中","yu":"旗幟尚未飄動時，先把繩結綁好。","jie":"「風起之前」落在求職中這個問題上，重點是：平靜期很適合準備。當事情還沒有非常忙、機會也還沒有正式出現時，反而是整理流程、作品與能力的最好時刻。不要等風來了才開始找帆。 近期求職重點在精準，不在大量亂投。把履歷與作品對準職缺最在意的三件事，會比再增加很多無關內容有效。 若想讓局勢開始改變，先從這一步做起：整理一份未來可能會用到的履歷、作品或提案素材。","adv":"整理一份未來可能會用到的履歷、作品或提案素材。","st":"求職過程的停滯通常來自訊息不對稱；找到一個在你目標產業工作的人聊一次，比投五份履歷有效。","rx":"某個你覺得不理想的機會，主動聯繫後，條件可能比公告的更有彈性。","fw":"你的下一份工作不一定是你申請的，可能是某次對話帶來的意外機會。","sa":"找出三個你最想去的公司，搞清楚他們的招募窗口在哪裡，比在 104 等更有效。"},{"n":25,"t":"留下痕跡","sub":"求職中","yu":"做過的事情若沒有留下痕跡，很容易連自己都忘記走了多遠。","jie":"若把「留下痕跡」放進你現在的求職中處境，籤意會更直接：你可能累積了很多工作，但沒有系統整理，因此在需要證明能力時反而說不清楚。這支籤提醒你開始建立自己的成果紀錄。 若目前回覆不多，籤意偏向調整呈現方式，而不是否定能力。讓成果可量化、案例有脈絡，並主動請可信任的人幫你檢視。 比起繼續猜，這支籤更希望你實際做的是：建立一份「完成清單」，今天先記錄最近五項成果。","adv":"建立一份「完成清單」，今天先記錄最近五項成果。","st":"目前的求職方向可能太廣或太窄，需要根據近期的回饋做一次調整。","rx":"面試官的評價可能比你感受到的更正面，只是最後決策受到其他因素影響。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"重新寫一版自我介紹，只說「我能為這間公司解決什麼問題」，去掉所有自我描述。"},{"n":26,"t":"北星","sub":"求職中","yu":"方向不必一直改，只因為別人的船走得比較快。","jie":"你問的是求職中，而「北星」先指出一件事：比較容易讓你懷疑自己的路。這支籤提醒你，別人的速度、職稱與收入可以參考，但不能完全取代你的價值排序。你需要的是自己的北極星。 機會可能不是從最期待的那一間來。保持多線進行，在收到正式 offer 前，不要因一場聊得很好的面試就停止其他選項。 把答案帶回現實的方法是：寫下工作對你最重要的三件事，並排出順序。","adv":"寫下工作對你最重要的三件事，並排出順序。","st":"可能正在等一個不完全符合夢想但值得踏進去的入口；有時候起點不完美，路卻是對的。","rx":"你的人脈裡有人正想到你，但還沒確定要不要推薦，需要一個小的推力。","fw":"現在若能找到一個「可以學到你缺的那塊」的工作，即使不完美，也值得認真考慮。","sa":"把這週的投遞數量減半，把省下的時間花在把每一份客製化到位。"},{"n":63,"t":"磨亮的刃","sub":"求職中","yu":"刀鋒不是在掌聲裡變利，而是在一次次磨過之後。","jie":"這次以求職中來讀「磨亮的刃」：你正在累積一項還沒有立刻被看見的能力。重複練習可能枯燥，但專業往往就在這些不起眼的次數裡形成。不要只追求新的刺激，也要留下時間深化核心能力。 這支籤提醒你把「被選上」改成「彼此選擇」。面試時除了證明能力，也要確認主管、工作內容與文化是否值得你投入。 今天可以先做一件很具體的事：選一項最值得長期累積的技能，今天專注練習25分鐘。","adv":"選一項最值得長期累積的技能，今天專注練習25分鐘。","st":"若你曾在某個領域有特別深的積累，現在比任何時候都更需要把它說出來。","rx":"你的人脈裡有人正想到你，但還沒確定要不要推薦，需要一個小的推力。","fw":"若你目前定位在「轉職」而非「升職」，要特別說明你帶過來的價值，而不是只強調學習意願。","sa":"今天聯絡一個你欣賞的業界前輩，問一個具體的問題，而不是泛泛的「有沒有機會」。"},{"n":64,"t":"暗潮","sub":"求職中","yu":"水面平靜時，潮流仍在改變方向。","jie":"「暗潮」落在求職中這個問題上，重點是：工作環境裡可能正在發生尚未明說的變化。與其被猜測拖著走，不如留意具體訊號並替自己準備備案。準備不是悲觀，而是保留選擇權。 近期求職重點在精準，不在大量亂投。把履歷與作品對準職缺最在意的三件事，會比再增加很多無關內容有效。 若想讓局勢開始改變，先從這一步做起：列出目前職場中三個可觀察的變化，只記錄事實，不下結論。","adv":"列出目前職場中三個可觀察的變化，只記錄事實，不下結論。","st":"求職過程的停滯通常來自訊息不對稱；找到一個在你目標產業工作的人聊一次，比投五份履歷有效。","rx":"面試官的評價可能比你感受到的更正面，只是最後決策受到其他因素影響。","fw":"若你目前定位在「轉職」而非「升職」，要特別說明你帶過來的價值，而不是只強調學習意願。","sa":"把你的履歷讓一個在你目標產業工作的朋友看，請他說真心話，而不是鼓勵。"},{"n":65,"t":"借風","sub":"求職中","yu":"會航海的人，不只靠自己的力氣，也懂得辨認可以借用的風。","jie":"若把「借風」放進你現在的求職中處境，籤意會更直接：你不必所有事情都獨自完成。工具、同事、資源與合作都可能讓成果更好。求助並不會削弱能力，知道何時借力也是專業的一部分。 若目前回覆不多，籤意偏向調整呈現方式，而不是否定能力。讓成果可量化、案例有脈絡，並主動請可信任的人幫你檢視。 比起繼續猜，這支籤更希望你實際做的是：找一件卡住的事，今天向一個適合的人提出具體問題。","adv":"找一件卡住的事，今天向一個適合的人提出具體問題。","st":"若你曾在某個領域有特別深的積累，現在比任何時候都更需要把它說出來。","rx":"你投遞的某個職缺，目前的進展比你知道的更接近了。","fw":"若你目前定位在「轉職」而非「升職」，要特別說明你帶過來的價值，而不是只強調學習意願。","sa":"找出你過去最有成就感的一個工作片段，把它轉成一個可以在面試講的完整故事。"},{"n":66,"t":"高塔之窗","sub":"求職中","yu":"站得更高，不只是看得更遠，也會看見原本忽略的全貌。","jie":"你問的是求職中，而「高塔之窗」先指出一件事：你可能太靠近眼前的任務，以至於忘了它真正服務的目標。這支籤提醒你偶爾跳出執行層，理解需求、使用者與整體策略，會讓你的判斷更成熟。 機會可能不是從最期待的那一間來。保持多線進行，在收到正式 offer 前，不要因一場聊得很好的面試就停止其他選項。 把答案帶回現實的方法是：替今天最重要的工作回答一句：它最終要解決誰的什麼問題？","adv":"替今天最重要的工作回答一句：它最終要解決誰的什麼問題？","st":"可能正在等一個不完全符合夢想但值得踏進去的入口；有時候起點不完美，路卻是對的。","rx":"面試官的評價可能比你感受到的更正面，只是最後決策受到其他因素影響。","fw":"接下來四到六週是關鍵期，若沒有進展，需要根本性調整投遞策略，而不是繼續量取勝。","sa":"把這週的投遞數量減半，把省下的時間花在把每一份客製化到位。"},{"n":67,"t":"種子庫","sub":"求職中","yu":"不是每顆種子今天都要發芽，但值得的種子要先保存。","jie":"在求職中的脈絡裡，「種
