<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你的限定籤｜未完籤所</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/site-header.css"><link rel="stylesheet" href="/assets/survey.css"><link rel="stylesheet" href="/assets/survey-reward.css"></head><body>
<header class="ww-site-header"><div class="ww-header-inner"><a class="ww-logo" href="/">未 完 籤 所</a></div></header>
<main class="sv-wrap reward-page"><section class="sv-card reward-card"><div class="sv-kicker">THANK YOU · 限定回信</div>
<div id="intro"><div class="reward-orb"><span>✦</span></div><h1>謝謝你留下真實的感受</h1><p>現在，請安靜一下。<br>想著此刻最需要被提醒的事，抽一支只屬於你的回信。</p><button id="drawBtn" class="reward-button">抽取此刻的提醒</button></div>
<div id="loading" hidden><div class="reward-orb spinning"><span>✦</span></div><p>正在接住此刻的訊息…</p></div>
<article id="result" class="fortune" hidden><div class="fortune-no" id="fortuneNo"></div><p class="fortune-label">此刻的你，最需要被提醒的一句話</p><h1 id="fortuneTitle"></h1><div class="fortune-divider">✦</div><p id="fortuneMessage" class="fortune-message"></p><section class="fortune-action"><small>給今天的你</small><p id="fortuneAction"></p></section><p class="fortune-note">這支籤不替你決定答案，只想提醒你：<br>在等待別人的選擇以前，你也可以先選擇照顧自己。</p><a class="reward-link" href="/">回到未完籤所</a></article><div id="rewardError" class="sv-error"></div></section></main>
<script>const intro=document.getElementById('intro'),loading=document.getElementById('loading'),result=document.getElementById('result'),errorBox=document.getElementById('rewardError');const queryToken=new URLSearchParams(location.search).get('token');if(queryToken){sessionStorage.setItem('uw_survey_reward',queryToken);history.replaceState({},'',location.pathname)}const token=sessionStorage.getItem('uw_survey_reward')||'';function showFortune(f){intro.hidden=true;loading.hidden=true;result.hidden=false;fortuneNo.textContent='限定籤 · '+String(f.id||'').replace('reply_','').padStart(2,'0');fortuneTitle.textContent=f.title;fortuneMessage.textContent=f.message;fortuneAction.textContent=f.action;requestAnimationFrame(()=>result.classList.add('shown'))}async function draw(){if(!token){intro.hidden=true;errorBox.innerHTML='這個限定籤入口無效或已遺失。<br><a href="/survey/">重新前往問卷</a>';return}intro.hidden=true;loading.hidden=false;errorBox.textContent='';try{await new Promise(r=>setTimeout(r,1300));const r=await fetch('/api/survey/reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error==='expired_token'?'限定籤資格已超過 30 天':'目前無法取得限定籤');showFortune(d.fortune)}catch(e){loading.hidden=true;errorBox.textContent=e.message}}document.getElementById('drawBtn').onclick=draw;</script></body></html>
