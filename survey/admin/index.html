<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問卷報表｜未完籤所</title>
<style>body{font:14px system-ui;margin:0;background:#f4f0f5;color:#302437}.wrap{max-width:1200px;margin:auto;padding:28px}.bar,.cards{display:flex;gap:12px;flex-wrap:wrap}.bar input,.bar button{padding:10px 14px;border:1px solid #ccc;border-radius:9px}.bar button{background:#633c76;color:#fff}.card{background:#fff;padding:18px;border-radius:14px;min-width:170px}.card strong{font-size:30px;display:block}table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;max-width:260px}th{position:sticky;top:0;background:#5b376d;color:white}.table{overflow:auto;max-height:65vh;border-radius:14px}#msg{color:#a33}</style></head>
<body><main class="wrap"><h1>使用體驗問卷報表</h1><div class="bar"><input id="key" type="password" placeholder="管理員密碼"><button id="load">載入報表</button><button id="csv" style="display:none">下載 CSV</button></div><p id="msg"></p>
<div class="cards"><div class="card">有效回答<strong id="total">—</strong></div><div class="card">平均符合度<strong id="avg">—</strong></div><div class="card">已購買延伸籤<strong id="bought">—</strong></div><div class="card">已抽限定籤<strong id="claimed">—</strong></div></div>
<div class="table"><table><thead><tr><th>時間</th><th>暱稱</th><th>Email</th><th>主題</th><th>來源</th><th>流程</th><th>符合度</th><th>延伸籤</th><th>限定籤</th><th>最想改善</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let DATA=[];const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('load').onclick=async()=>{const key=$('key').value;sessionStorage.setItem('uw_admin',key);try{const r=await fetch('/api/survey/admin',{headers:{'X-Admin-Key':key}}),d=await r.json();if(!r.ok)throw Error('密碼錯誤或無法載入');DATA=d.rows||[];$('total').textContent=DATA.length;const scores=DATA.map(x=>+x.matchScore).filter(Boolean);$('avg').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'—';$('bought').textContent=DATA.filter(x=>x.extendedAwareness==='有，而且已經購買').length;$('claimed').textContent=d.rewardCount||0;$('rows').innerHTML=DATA.map(x=>`<tr><td>${esc(new Date(x.createdAt).toLocaleString('zh-TW'))}</td><td>${esc(x.nickname)}</td><td>${esc(x.email)}</td><td>${esc(x.topic)}</td><td>${esc(x.source)}</td><td>${esc(x.flowClarity)}</td><td>${esc(x.matchScore)}</td><td>${esc(x.extendedAwareness)}</td><td>${esc(x.rewardFortuneId)}</td><td>${esc(x.oneChange)}</td></tr>`).join('');$('csv').style.display='inline-block';$('msg').textContent=''}catch(e){$('msg').textContent=e.message}};
$('key').value=sessionStorage.getItem('uw_admin')||'';
$('csv').onclick=()=>{const cols=['createdAt','nickname','email','topic','distress','source','categoryEase','flowClarity','issues','device','matchScore','readability','benefits','missing','extendedAwareness','noBuyReasons','buyMotivators','wantedFeatures','age','relationship','oneChange','rewardClaimedAt','rewardFortuneId'],q=v=>'"'+String(Array.isArray(v)?v.join('、'):v||'').replaceAll('"','""')+'"',text='\ufeff'+[cols.join(','),...DATA.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='unfinished-survey-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
</script>
